table_contracts:
  account_transitions_parent_keys:
    - retain transition_id primary key and add unique transition_id/store_id
    - add unique transition_id/account_id/store_id
    - these are immutable origin parents; they do not add a writer or change transition state semantics
  registered_credentials:
    columns:
      - credential_id BLOB16 primary key
      - account_id BLOB16
      - store_id BLOB16
      - created_transition_id BLOB16 unique
      - created_at nonnegative INTEGER
    relationships:
      - unique credential_id/account_id/store_id parent tuple
      - account_id/store_id references the stable registered account identity
      - created_transition_id/account_id/store_id references the exact composite account transition that created the credential identity
    lifecycle:
      - inserted only when account create or binding-changing update reserves a new credential; those writers remain T202C2/T202C3-owned
      - never updated or deleted by supported application paths
      - a credential reserved by a later-aborted transition remains permanently unavailable
  registered_store_versions:
    key: primary key store_id/config_generation
    columns:
      - store_id BLOB16
      - location_sha256 BLOB32
      - positive SQLite-representable config_generation
      - config_sha256 BLOB32
      - nullable unique enrolled_receipt_id BLOB16
      - nullable unique committed_transition_id BLOB16
      - created_at nonnegative INTEGER
    invariants:
      - exactly one of enrolled_receipt_id or committed_transition_id is present
      - store_id/location_sha256 references the immutable identity pair in registered_stores
      - receipt origin references authorization_receipts and the exact enrolled store/location/receipt tuple
      - transition origin references the exact transition_id/store_id composite
      - unique store/config-generation/config-digest and exact remote-effect parent composite
      - generation order for one store is the composite primary-key order
      - never updated or deleted by supported application paths
  registered_account_versions:
    key: primary key account_id/account_generation
    columns:
      - account_id BLOB16
      - store_id BLOB16
      - positive SQLite-representable account_generation
      - credential_id BLOB16
      - binding_sha256 BLOB32
      - committed_transition_id BLOB16 unique
      - created_at nonnegative INTEGER
    relationships:
      - account_id/store_id references the stable registered account identity
      - credential_id/account_id/store_id references the immutable credential identity
      - committed_transition_id/account_id/store_id references the exact composite transition that committed this account tuple
      - exact account/store/generation/credential/binding tuple is unique and is the remote-effect account parent
    lifecycle:
      - inserted only when an after account snapshot reaches config_committed; writer remains T202C2/T202C3-owned
      - create uses generation one; account update, credential set, and credential delete advance generation exactly once
      - account removal has no synthetic after account version
      - never updated or deleted by supported application paths
  mutable_projection_adjustments:
    registered_stores:
      - retain store_id primary key and globally unique location_sha256
      - expose unique store_id/location_sha256 and store_id/location_sha256/enrolled_receipt_id parents
      - current config generation/digest/state/update fields remain mutable and are not remote-effect parents
    registered_accounts:
      - retain stable account identity, current tuple, active display partial uniqueness, and transition cycle
      - current credential/account/store tuple must reference registered_credentials
      - current generation/credential/binding tuple is not a remote-effect parent
  remote_effects:
    - store/location/config-generation/config-digest FK references registered_store_versions
    - account/store/account-generation/credential/binding FK references registered_account_versions
    - all challenge, grant, trust, effect, claim, invocation, and observation relationships remain unchanged
    - an effect referencing only a current projection and no immutable version is rejected

enrollment_delta:
  first_success:
    - after the registered_stores insert, insert exactly one registered_store_versions row before store_enrolled event and commit
    - version store/location/config pair equals the sealed enrollment manifest and current store row
    - enrolled_receipt_id equals the consumed immutable receipt; committed_transition_id is NULL
    - version created_at equals the effective grant/store/event time
    - the version insert consumes no entropy and emits no new event
  exact_recovery:
    - validate the immutable version row before returning the accepted store projection
    - projection generation/state/timestamps remain the original enrollment result, not a mutable current projection
    - a missing, duplicate, cross-linked, mutated, or transition-origin initial version is owner_recovery_required
    - exact retry appends no row or event and may advance only the accepted paired clock high-water
  fault_atomicity:
    - add a deterministic fault immediately after initial version insertion
    - every fault before commit rolls back grant, grant event, current store, initial version, store event, and clock together
    - after-commit response loss leaves exactly one recoverable initial version

restart_validator:
  stage_rules:
    - T202A pending/ready bootstrap and T202B history require all three new tables empty
    - T202C1 requires registered_credentials and registered_account_versions empty
    - T202C1 requires exactly one receipt-origin initial store version per registered store and no transition-origin store version
    - account, transition, cleanup, remote-effect, claim, invocation, observation, rotation, and recovery stage fences otherwise remain accepted T202C1 behavior
  validation:
    - preflight storage class, exact lengths, ranges, nullable-origin XOR, and bounded values before Rust row construction
    - stream store versions by store_id/config_generation primary-key order with O(1) additional Rust history memory
    - recompute each initial version from sealed enrollment manifest, receipt, grant, current stable store identity, events, and timestamps
    - schema-level tests raw-insert complete synthetic later version/credential/account graphs to prove every FK and current-projection evolution relationship
    - no production validator accepts account or transition rows in this stage merely because schema-level fixtures can construct them
  query_plan:
    - EXPLAIN QUERY PLAN for one-store ordered version stream uses the composite primary-key autoindex
    - plans contain no USE TEMP B-TREE and no repeated unindexed full scan
    - remote-effect parent and credential/account/version keyed checks use primary or unique indexes
  corruption:
    - old inventory, malformed row, missing origin, both origins, wrong receipt, wrong transition, cross-store location, cross-account credential, duplicate generation, missing initial version, or effect without exact version parent fails closed

