  exception: null
  red:
    allowed_test_files:
      - crates/kirje-store/tests/authority_schema.rs
      - crates/kirje-store/tests/authority_registry.rs
    targets:
      - canonical inventory expects 20 tables and exact new columns/checks/foreign-key parents while the old schema still has 17
      - complete synthetic remote-effect chain remains valid after current store and account tuples advance to already-inserted successor identities; old current-parent FKs reject this update
      - missing/cross-linked version and credential parents plus mutable-current-only effect insertion are rejected
      - cross-account or cross-store transition origins that otherwise leave foreign_key_check empty are rejected by the exact composite parent FKs
      - accepted enrollment creates and exactly recovers one initial version, including a new post-version-insert rollback fault and after-commit response loss
      - restart rejects a missing/mutated/cross-linked initial store version and old developer inventory
