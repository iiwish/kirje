  blocking_findings:
    - any remote-effect FK still targets registered_stores or registered_accounts current tuples
    - a current tuple cannot legally advance after an effect, or an effect can reference a tuple with no immutable version parent
    - credential identity can alias another account/store, a version lacks exact origin, or aborted credential reservation can be reused
    - initial store version is outside enrollment transaction, emits a new event, changes timestamps, duplicates on retry, or is not restart-validated
    - old developer inventory is accepted/migrated/repaired, application ID/user version changes, or a second schema/version/API is introduced
    - schema object SQL, FK check, integrity, query plan, T202A-T202C1 stage behavior, RED, full gate, privacy, or allowed-file scope is incomplete
  acceptance_rule: >-
    The worker never accepts the task. After independent zero-blocking review,
    verified TDD evidence, and fresh required gates, the orchestrator may record
    acceptance under the user's explicit standing project-owner delegation.

