    - SQLite key, nullable-origin, forward-reference, cycle, parent-cardinality, ON UPDATE/DELETE, and raw relationship review
    - enrollment transaction, exact retry, fault, response-loss, event, clock, restart, and stage-fence review
    - immutable-history/current-projection evolution, query-plan, boundedness, corruption, privacy, and pre-release compatibility review
