work_unit:
  title: Immutable registry version parents in canonical Authority SQLite v1
  goal: >-
    Correct the unreleased Authority SQLite v1 relationship graph before any
    account mutation or remote-effect writer exists. Add immutable credential,
    store-version, and account-version parents; redirect remote effects away
    from mutable current projections; and evolve accepted store enrollment to
    insert and exactly recover its initial store version in the same
    transaction. Preserve application ID, user version, public APIs, event
    semantics, and all accepted T202A through T202C1 behavior.
  epic: T101
  stories:
    - US-001
    - US-003
  requirements:
    - FR-003
    - FR-004
    - FR-005
    - FR-006
    - FR-016
    - FR-018
    - NFR-001
    - NFR-002
    - NFR-003
    - NFR-006
    - NFR-007
  priority: P0
  depends_on:
    - T202C1 Accepted at production commit aa53efb
    - T201 Accepted at production commit 89cc706
    - old accepted fence digest 572a73ba5fa83c763188d804ce9767a3c21373410d8b170f6d97b49be0a86454 is the exact RED baseline, not the target digest
    - confirmed immutable registry-version DDL and lifecycle contract in data-model.md and authority-store.md
  blocks:
    - T202C2
    - T202C umbrella acceptance
    - T202D
  parallel: false
  conflicts_with:
    - any concurrent authority schema, enrollment, registry, remote-effect relationship, event, clock, or restart-validator change
    - T202C2 through T202E

governance_amendment:
  trigger: first independent read-only T202C2 packet review
  blocking_counterexample: >-
    remote_effects currently has composite foreign keys to mutable
    registered_stores and registered_accounts current tuples. After an effect
    exists, ON UPDATE RESTRICT prevents the store config pair or account
    generation/credential/binding tuple from advancing. Deferred foreign keys
    cannot repair the missing historical parent at commit.
  decision:
    - correct the single unreleased canonical v1 rather than introduce or migrate to a second schema version
    - retain mutable registered_stores and registered_accounts as current projections
    - add immutable registered_credentials, registered_store_versions, and registered_account_versions parents
    - redirect only remote_effect snapshot FKs to immutable version parents
    - add a current-account composite FK to the immutable credential identity
    - make accepted store enrollment insert the initial store version atomically
    - leave account/credential/version transition writers to T202C2 and T202C3
  scope_reason: >-
    No authority schema has entered main, a remote branch, a release, CLI, MCP,
    runtime, or protocol use. Exact schema classification already rejects any
    noncanonical developer database, so preserving the broken developer shape
    would add risk rather than compatibility.
  required_review: satisfied by T202C1S_A002_PACKET_REVIEW_PASS with zero Critical, High, Medium, or Low finding
  A001_result:
    pass: false
    findings: 1 High, 3 Medium, 1 Low
    resolutions:
      - transition origins use exact transition/account/store or transition/store composite FKs with corresponding UNIQUE parents
      - account-create abort marks the current account removed and never physically deletes registry identity
      - create starts account generation one; account update, credential set, and credential delete advance it exactly once; remove has no after version
      - T202C1S proves ordinary enrollment exact retry only; T202C2 owns the first legal-successor enrollment-retry RED
      - the reviewed normative DDL target digest is frozen before execution
  A002_result:
    token: T202C1S_A002_PACKET_REVIEW_PASS
    findings: 0 Critical, 0 High, 0 Medium, 0 Low
    verification:
      - exact composite parent counterexamples fail with FOREIGN KEY constraint failed
      - DDL parses as 20 tables, 15 explicit indexes, and 3 triggers with empty foreign_key_check
      - deferred account/transition/credential cycle commits and current tuples no longer parent historical effects
      - store-version and keyed parent plans use PK/UNIQUE autoindexes without USE TEMP B-TREE
      - target digest, trailing bytes, YAML, artifact validator, diff check, and implementation baselines match

stage_boundary:
  supported_behavior_delta:
    - enroll_store inserts one initial registered_store_versions row atomically with the accepted grant/store/event/clock graph
    - exact enrollment retry validates and returns the immutable initial enrollment projection in the T202C1 stage
    - T202C2 owns the first production-path RED for exact enrollment retry after a legal current-state successor
    - schema and restart validation recognize the three immutable parent tables
  unchanged_operations:
    - T202A bootstrap and anchor confirmation
    - T202B challenge, proof, receipt, nonce, replay, expiry, and event behavior
    - T202C1 grant use, store enrollment request/projection, stable errors, events, faults, and concurrency
  unsupported_operations:
    - account_create, account_update, account_remove, credential_set, credential_delete, and credential_cleanup
    - send_submit, seen_set, starred_set, move, archive, safe_delete, and ambiguous_close
    - remote-effect registration, claim, invocation, observation, rotation-finalization, recovery-finalization, invalidation, policy, assurance, or audit mutation
  no_interface_delta:
    - no new public store API, command, MCP tool, runtime service, adapter call, migration API, repair API, or output field

