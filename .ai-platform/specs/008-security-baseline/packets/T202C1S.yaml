    normative_ddl: .ai-platform/specs/008-security-baseline/data-model.md#authority-sqlite-v1
    target_digest: 5d01739b89246a5f495a965e57e416eee9fd0b5016995add41c6edee7f3e970d
    byte_rule: exact normative DDL block followed by one additional LF, so schema_v1.sql ends with exactly two LF bytes
