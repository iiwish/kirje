definition_of_done:
  - one canonical Authority SQLite v1 has 20 exact tables, 15 explicit indexes, 3 triggers, unchanged application ID/user version, and a recorded new SHA-256
  - remote effects reference only immutable store/account version parents, while current store/account projections can advance without FK failure and history remains valid
  - credential identity is globally reserved and permanently bound to one account/store/creating transition; every malformed or cross-linked parent graph fails closed
  - accepted store enrollment atomically inserts and exactly recovers one initial receipt-origin store version with no new event, entropy, output, or public API
  - bootstrap, authorization, grant/enrollment, restart, event, fault, concurrency, boundedness, query-plan, no-default, MSRV, full workspace, and privacy gates pass
  - old developer inventory is rejected without migration/repair, worker scope is exact, and independent review has zero Critical, High, or Medium finding

