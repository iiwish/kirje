work_unit:
  title: Exact account-create challenge and crash-safe registry transition
  goal: >-
    Extend immutable challenge issuance only for registry-backed account_create,
    then implement the complete create prepare, config-committed, finalize,
    abort, and recovery-required authority lifecycle over the corrected
    canonical SQLite v1 schema. Reserve account, credential, active display, transition, and
    store-config identities before external config work; block the store across
    the authority/config gap; exactly recover before/after snapshots; and fail
    closed on every unsafe pair without config, keyring, runtime, protocol, or
    network access.
  epic: T101
  stories:
    - US-001
    - US-003
  requirements:
    - FR-003
    - FR-004
    - FR-005
    - FR-006
    - FR-016
    - NFR-001
    - NFR-002
    - NFR-003
    - NFR-006
    - NFR-007
  priority: P0
  depends_on:
    - T202C1S Accepted with immutable credential/store-version/account-version parents and recorded canonical DDL digest
    - T201 Accepted at production commit 89cc706
    - confirmed T202C2 account-create challenge, transition, event, and restart amendments in authority-store.md and data-model.md
  blocks:
    - T202C3
    - T202C umbrella acceptance
    - T202D
  parallel: false
  conflicts_with:
    - any concurrent authority.rs, challenge, grant, registry, transition, event, clock, or restart-validator change
    - T202C3 through T202E

