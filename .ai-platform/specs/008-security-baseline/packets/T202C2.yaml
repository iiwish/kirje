governance_amendment:
  trigger: independent read-only T202C2 preflight against immutable schema v1
  review_result:
    pass: false
    blocking_finding: mutable registered store/account tuples are invalid historical remote-effect parents and make future legal mutations fail ON UPDATE RESTRICT
    prerequisite: T202C1S corrects the unreleased canonical v1 before this packet can be amended
  closed_high_findings:
    - the account/transition circular FK is closed by transaction-local defer_foreign_keys plus an explicit pre-commit foreign_key_check
    - store-level config CAS is serialized by one active transition per store and store blocking across the config/authority gap
    - display, transition-kind, transition, no-time intent, and unsafe-recovery identities have exact domain-separated encodings
    - authorized-unclaimed expiry has an account-create intent independent of raw observed/prepared time and supports exact response-loss recovery
    - recovery stores the actual unsafe pair on the private store row, keeps account blocked, and binds it through a recovery-observation event digest
  closed_medium_findings:
    - codes 7 and 9 through 14 have exact entity/source/related/state/context/receipt/order shapes
    - every durable state and before/after/third observation has a closed method/error/retry/clock result
    - account-create cleanup semantics are stage-fenced and the packet includes schema/hash, authorization, no-default, MSRV, affine-query, and query-plan gates
  required_review: unsatisfied; after T202C1S acceptance an amended packet must receive an independent zero-Critical/High/Medium review

codebase_context:
  local_instructions:
    - AGENTS.md
  relevant_read_only_files:
    - crates/kirje-core/src/account.rs
    - crates/kirje-core/src/authorization.rs
    - crates/kirje-core/src/mail.rs
    - crates/kirje-store/src/authority/schema_v1.sql
    - crates/kirje-store/tests/authority_authorization.rs
    - crates/kirje-store/tests/authority_schema.rs
    - .ai-platform/specs/008-security-baseline/contracts/account-config-v2.md
    - .ai-platform/specs/008-security-baseline/contracts/authority-store.md
    - .ai-platform/specs/008-security-baseline/data-model.md
  existing_patterns:
    - core owns typed UUIDv4 IDs, ConfigCas, AccountSnapshot, AccountMutationManifest, AccountCreate validation, sealed ActionManifest parsing, target/action codes, and SHA-256 values
    - T202B owns immutable challenges/receipts/nonces, exact proof replay, effective authority time, fixed apply lock, deterministic test entropy, fault hooks, event detail, and historical validation
    - T202C1 owns the only canonical grant-use helper, immutable use transcript, authorized-unclaimed expiry order, store enrollment graph, store registry rows, and affine-query validator counters
    - every post-bootstrap mutation opens the fixed existing authority DB without CREATE, classifies it, validates canonical schema/anchor/history inside BEGIN IMMEDIATE, and maps private failures to bounded stable errors
    - corrected schema v1 contains immutable credential/store-version/account-version parents plus an intentional new-account/account-transition/credential FK cycle
    - public projections omit private authority, config, location, credential, binding, and proof material and do not implement generic formatting/serialization traits
  implementation_preferences:
    - reuse and factor T202C1 grant, expiry, event, clock, transcript, error, and validator helpers rather than creating a second replay path
    - parse the sealed core manifest once per bounded operation and derive proposed account context from that typed value
    - represent lifecycle values as closed Rust enums with explicit persistent codes, never enum ordinals or caller strings
    - preflight broad row storage classes once, then stream rows and use only bounded keyed/indexed checks

required_types:
  enums:
    - AccountTransitionKind with all five schema kinds and explicit persistent u8 codes; T202C2 accepts only AccountCreate
    - AccountTransitionState with Prepared, ConfigCommitted, Finalized, Aborted, RecoveryRequired and explicit event-state codes
    - RegisteredAccountState with Proposed, Active, Blocked, Removed
    - RegisteredStoreTransitionState with Active, Blocked, RecoveryRequired
  prepare_request:
    fields:
      - GrantUseRequest
      - transition_id
      - store_id
      - account_id
      - closed transition kind
      - before and after config SHA-256
      - expected and next config generations
      - display-ID SHA-256
      - account generation
      - credential_id
      - binding SHA-256
      - observed_at_unix_ms
    constructor_checks:
      - observed time is nonnegative and representable as UTC milliseconds
      - expected and next generation are positive, SQLite-representable, and exact successor values
      - before and after config digests differ
      - AccountCreate requires account generation exactly one
      - GrantUse target kind/shape remains owned by its accepted constructor
    database_checks:
      - every field equals the immutable challenge/receipt/sealed-manifest context
      - the display digest is recomputed from exact validated after.display_id bytes
  observation_request:
    fields:
      - transition_id
      - exact declared source state
      - actual config generation
      - actual config SHA-256
      - observed_at_unix_ms
    constructor_checks:
      - time and generation are representable
      - source state is closed; each method restricts it as specified below
    forbidden_inputs:
      - no current/stale boolean
      - no event source
      - no account/store/receipt/grant identity duplicate
      - no path, config bytes, keyring callback, credential, or external handle
  projection:
    includes:
      - transition_id
      - account_id
      - closed transition/account/store states
      - config generation
      - account generation
      - prepared UTC timestamp
    omits:
      - store_id
      - credential_id
      - display, binding, config, location, manifest, event, proof, signature, nonce, key, endpoint, SQL, or path material
    trait_fence:
      - request and projection types do not implement Debug, Display, Serialize, Deserialize, JsonSchema, Default, or logging helpers

canonical_identities:
  display_digest:
    domain: "KIRJE-ACCOUNT-DISPLAY-ID-V1\\0"
    tags:
      - "0x0001 exact validated display-ID UTF-8"
    digest: SHA-256 of the authority encode_transcript bytes; uniqueness is scoped by the schema pair store_id plus digest
  transition_kind_codes:
    account_create: 1
    account_update: 2
    account_remove: 3
    credential_set: 4
    credential_delete: 5
  transition:
    domain: "KIRJE-ACCOUNT-TRANSITION-V1\\0"
    tags:
      - "0x0001 transition UUID16"
      - "0x0002 grant UUID16"
      - "0x0003 store UUID16"
      - "0x0004 account UUID16"
      - "0x0005 transition kind u8"
      - "0x0006 before config SHA-256 BLOB32"
      - "0x0007 after config SHA-256 BLOB32"
      - "0x0008 expected generation u64be"
      - "0x0009 next generation u64be"
      - "0x000a prepared-at i64be"
    persistence: only transition_sha256 is stored; exact bytes are recomputed from rows
  no_time_prepare_intent:
    domain: "KIRJE-ACCOUNT-TRANSITION-INTENT-V1\\0"
    tags:
      - "0x0001 grant UUID16"
      - "0x0002 receipt UUID16"
      - "0x0003 action u16be"
      - "0x0004 target-kind u16be"
      - "0x0005 canonical target bytes"
      - "0x0006 manifest SHA-256 BLOB32"
      - "0x0007 transition UUID16"
      - "0x0008 store UUID16"
      - "0x0009 account UUID16"
      - "0x000a transition kind u8"
      - "0x000b before config SHA-256 BLOB32"
      - "0x000c after config SHA-256 BLOB32"
      - "0x000d expected generation u64be"
      - "0x000e next generation u64be"
      - "0x000f display-ID SHA-256 BLOB32"
      - "0x0010 account generation u64be"
      - "0x0011 credential UUID16"
      - "0x0012 binding SHA-256 BLOB32"
    identity: excludes raw observed and prepared time; exact expiry retry is reconstructable from immutable rows plus request
  unsafe_recovery:
    domain: "KIRJE-ACCOUNT-TRANSITION-RECOVERY-V1\\0"
    tags:
      - "0x0001 transition SHA-256 BLOB32"
      - "0x0002 prior transition state u16be"
      - "0x0003 actual config generation u64be"
      - "0x0004 actual config SHA-256 BLOB32"
    identity: event context is SHA-256 of exact bytes; actual pair is private in registered_stores and validator recomputes the digest

account_create_challenge:
  intrinsic_shape:
    - target and context account are the same proposed AccountId
    - context store equals ConfigCas store and context binding equals after binding; policy is absent
    - before absent; after present with generation 1, proposed binding, reentry_required credential, credential_reentry_required reason, empty cleanup IDs
    - mutation cleanup empty; config generation increments once; before/after digests differ
    - no challenge effect
  pending_recovery_order:
    - validate request and sealed manifest bytes, ready authority, and intrinsic manifest
    - compute authorization context and return exact unexpired pending challenge before current registry absence checks
    - expire an old pending challenge and append its exact event before fresh checks
  fresh_context_order:
    - exact store ID/location and active state
    - exact current config generation/digest
    - no prepared/config_committed transition for the store
    - globally absent account, credential, and transition-ID identities
    - no proposed/active/blocked display digest for the store
    - validate requested expiry before entropy and insert
  stable_errors:
    store_location_mismatch: config_store_identity_conflict
    stale_or_absent_or_removed_store_or_config_or_binding: authorization_context_stale
    busy_store: account_update_conflict
    recovery_required_store: owner_recovery_required
    stable_id_collision: account_identity_conflict
    active_display_collision: account_already_exists
  historical_rule:
    - pending, authorized, expired, used, sibling, and stale account-create challenges are validated intrinsically and do not reapply current absence/state checks

prepare_transaction:
  first_use_preconditions:
    - complete canonical schema, anchor, accepted challenge/receipt/grant/store/account/transition/event history is valid inside the write transaction
    - no existing grant use
    - exact current unexpired receipt/challenge/create manifest and no-time prepare intent
    - active store has exact before generation/digest and sealed location
    - no nonterminal transition for the store
    - all proposed identities, the effective-time transition digest, and active display slot remain absent
  atomic_order:
    - insert canonical T202C1 grant use and grant_used event
    - update store active to blocked without changing before config pair
    - enable and verify transaction-local PRAGMA defer_foreign_keys=ON
    - insert proposed registered account with active_transition_id and exact receipt/identity values
    - insert prepared account transition with exact grant/store/account/config values and transition digest
    - insert registered_credentials with the proposed credential/account/store and creating transition
    - run PRAGMA foreign_key_check and require zero rows after the complete cyclic graph exists
    - append store_state_changed then account_transition_prepared
    - update paired authority clock and commit
  row_shapes:
    store:
      - state blocked
      - before config pair retained
      - updated_at equals effective prepare time
    account:
      - state proposed
      - removed_at null
      - active_transition_id exact
      - account generation 1
      - exact receipt, display digest, credential, and binding values
      - created_at equals updated_at equals effective prepare time
    transition:
      - state prepared
      - prepared_at effective prepare time
      - all later timestamps null
  defer_foreign_keys:
    - permitted only after all precondition reads in first prepare and only inside that BEGIN IMMEDIATE
    - must read back enabled
    - must be followed by exact empty foreign_key_check after account, transition, and credential rows
    - rollback or commit resets the connection setting; normal/open validation never defers
  exact_recovery:
    - a present exact grant requires the immutable account/transition reservation and prepared event graph plus any complete legal later lifecycle
    - return the current transition projection after checked clock even when it legally advanced; append no event and mutate no lifecycle timestamp
    - changed bounded prepare identity after grant use returns grant_already_used
    - missing or changed persisted atomic graph for an exact grant is owner_recovery_required
  expiry:
    - compare exact receipt/challenge/intent before current occupancy
    - effective time after receipt expiry changes only challenge authorized to expired, paired clock, and one authorized-to-expired event with intent digest
    - exact response-loss/restart/concurrent retry returns authorization_expired and no duplicate event
    - changed intent returns authorization_context_stale; changed raw observed time alone is not identity
  conflict_precedence_after_expiry:
    - store config/location/state
    - active store transition
    - global account/credential/transition identities
    - active display slot
  no_external_effects:
    - no entropy after challenge issuance
    - no callback, config read/write, keyring operation, credential probe, adapter, runtime, protocol, or network call

observation_classifier:
  before: exact expected_generation plus before_config_sha256
  after: exact next_generation plus after_config_sha256
  third: every other pair

lifecycle_matrix:
  monotonic_phase_recovery:
    - before applying a fresh pair classifier, each method checks whether its exact phase event already committed
    - an exact completed phase validates its immutable request/event identity and every legal successor event/state, then returns the current transition projection without replaying that phase
    - mark_config_committed exact retry may therefore return ConfigCommitted, Finalized, or RecoveryRequired after another process legally advanced it; prepare exact retry may return every legal successor
    - finalize, abort, and recovery exact retries return their terminal projection; later tasks must preserve this monotonic rule for their own legal successors
    - changed phase identity or an illegal/missing successor graph is conflict or corruption according to the closed precedence; observed time may update only the paired clock
  unsafe_precedence:
    - after history and terminal-exact lookup, Prepared plus third enters common recovery from any observation method
    - after history and terminal-exact lookup, ConfigCommitted plus before or third enters common recovery from any observation method
    - safe pairs apply method-specific expected-state rules only after this classifier
  mark_config_committed:
    expected_request_state: Prepared
    from_prepared_before:
      result: unchanged Prepared exact retry point
      writes: paired clock only
    from_prepared_after:
      result: ConfigCommitted
      writes:
        - transition state/config_committed_at
        - store config pair before to after while state remains blocked
        - immutable after registered_store_versions row with this transition origin
        - immutable account-generation-one registered_account_versions row with this transition origin and reserved credential
        - one account_config_committed event
        - paired clock
    from_prepared_third:
      result: RecoveryRequired through common recovery transaction
    from_config_committed_or_legal_successor_after:
      result: exact response-loss recovery returning the current legal successor projection
      writes: paired clock only
    other_durable_state_or_pair:
      result: account_update_conflict unless the common unsafe-recovery rule applies
  finalize_account_transition:
    expected_request_state: ConfigCommitted
    from_config_committed_after:
      result: Finalized
      writes:
        - account proposed to active, clear active transition, account updated_at
        - transition finalized/finalized_at
        - store blocked to active retaining after pair, store updated_at
        - finalized event then store-unblocked event
        - paired clock
    from_finalized_after:
      result: exact response-loss recovery
      writes: paired clock only
    from_config_committed_before_or_third:
      result: RecoveryRequired through common recovery transaction
    other_durable_state_or_pair:
      result: account_update_conflict
  abort_transition:
    expected_request_state: Prepared
    from_prepared_before:
      result: Aborted
      writes:
        - account proposed to removed, clear active transition, set removed_at/updated_at
        - transition aborted/resolved_at
        - store blocked to active retaining before pair, store updated_at
        - aborted event then store-unblocked event
        - paired clock
    from_aborted_before:
      result: exact response-loss recovery
      writes: paired clock only
    from_prepared_after:
      result: account_update_conflict with no write
    from_prepared_third:
      result: RecoveryRequired through common recovery transaction
    other_durable_state_or_pair:
      result: account_update_conflict
  mark_transition_recovery_required:
    expected_request_state:
      - Prepared
      - ConfigCommitted
    accepted_pairs:
      - third from Prepared
      - before or third from ConfigCommitted
    first_result:
      - transition recovery_required/resolved_at
      - account blocked and active transition retained
      - store recovery_required with exact actual observed pair
      - store-recovery event then transition-recovery event, both with unsafe-recovery digest
      - paired clock
    exact_recovery:
      - same declared prior state and same actual store pair return unchanged; paired clock only
    rejected_pairs:
      - before or after from Prepared
      - after from ConfigCommitted
      - any changed terminal pair
    rejected_result: account_update_conflict with no write
  global_rules:
    - each first state change uses store-derived effective authority time and exact UTC conversion
    - all events for one transition step are adjacent, share effective time, and precede paired clock commit as packet order specifies
    - exact recovery never refreshes prepared/config_committed/finalized/resolved/created/updated/removed timestamps
    - raw observed time is never exact-retry identity
    - recovery_required is terminal in T202C2 and cannot be cleared
    - recovery_required plus the exact stored actual pair/recovery digest returns the recovery projection from any observation method; every changed terminal pair conflicts

event_contract:
  maps:
    entity_kind: "4 store, 5 account, 6 transition, 8 challenge, 9 receipt, 10 grant"
    event_code: "5 challenge_expired, 7 grant_used, 9 store_state_changed, 10 account_transition_prepared, 11 account_config_committed, 12 account_transition_finalized, 13 account_transition_aborted, 14 account_transition_recovery_required"
    source: "1 authority_store, 4 runtime, 5 crash_recovery, 6 owner_reconciliation"
    state: "0401 store_active, 0402 store_blocked, 0404 store_recovery_required, 0501 account_proposed, 0502 account_active, 0503 account_blocked, 0504 account_removed, 0601 transition_prepared, 0602 transition_config_committed, 0603 transition_finalized, 0604 transition_aborted, 0605 transition_recovery_required"
  prepare_order:
    - grant_used is the accepted T202C1 shape with use digest
    - store_state_changed: entity store, source runtime, related transition, active to blocked, transition digest, receipt
    - account_transition_prepared: entity transition, source runtime, related account, none to prepared, transition digest, receipt
  config_committed:
    - entity transition, source runtime, related account, prepared to config_committed, transition digest, receipt
  finalize_order:
    - transition finalized: entity transition, source runtime, related account, config_committed to finalized, transition digest, receipt
    - store state changed: entity store, source runtime, related transition, blocked to active, transition digest, receipt
  abort_order:
    - transition aborted: entity transition, source owner_reconciliation, related account, prepared to aborted, transition digest, receipt
    - store state changed: entity store, source owner_reconciliation, related transition, blocked to active, transition digest, receipt
  recovery_order:
    - store state changed: entity store, source crash_recovery, related transition, blocked to recovery_required, recovery digest, receipt
    - transition recovery: entity transition, source crash_recovery, related account, exact prior state to recovery_required, recovery digest, receipt
  replay:
    - no exact prepare/lifecycle/expiry recovery appends an event
    - missing, duplicate, swapped, interleaved, wrong-source, wrong-state, wrong-related, wrong-context, wrong-receipt, or timestamp-drift event is corruption
  privacy:
    - event detail has no display/binding/config/location digest or material, credential identity, manifest, proof, signature, nonce, key, endpoint, path, secret, mailbox content, or provider response
    - unsafe actual config is represented only by its domain-separated recovery digest in event detail

restart_validator:
  stage_allowlist:
    - accepted T202A, T202B, T202C1, and T202C1S rows/events
    - intrinsic account_create challenges
    - account_create grant/account/transition rows and codes 9 through 14 exactly as packeted
    - no other account-transition kind or later-stage row/event
  row_preflight:
    - one broad storage-class/length/range/enum/nullability query per account and transition table
    - SQL read failures map to StoreRead only at the exact injected read boundary; malformed rows map to OwnerRecoveryRequired
  store_chain:
    - treat registered_stores config/state/updated_at as current mutable registry projection, not immutable enrollment result
    - exact enroll_store retry loads and validates the immutable initial store version and original enrollment graph while validating the current transition chain
    - stream registered stores deterministically
    - stream registered_store_versions for that store by its store_id/config_generation composite primary-key order; require the receipt-origin initial pair and exact transition-origin successor versions
    - stream the store's entity-kind-4 events through authority_events_entity_sequence; parse each bounded state-change detail to obtain the transition identity and keyed-load its transition/account/events
    - prepared leaves chain before and must be last with store blocked
    - config_committed advances to after and must be last with store blocked
    - finalized advances to after and permits a later transition
    - aborted leaves pair before and permits a later transition
    - recovery_required is last and requires store recovery state, exact stored actual pair, prior-state classifier, and recomputed recovery digest
    - final derived pair and state equal registered_stores exactly
  account_chain:
    - every registered account has exactly one account_create transition, create receipt/grant, and matching proposed registry values
    - every proposed credential has one immutable registered_credentials row tied to the create transition
    - every config-committed/finalized/recovery-after-commit create has one exact immutable account version; prepared/aborted-before-commit has none
    - finalized maps to active/no-transition; aborted to removed/no-transition; prepared or config_committed to proposed/active-transition; recovery to blocked/active-transition
    - exact timestamp and removed_at rules hold
    - account and credential identities are never reusable; display slot is unique only for proposed/active/blocked
  event_chain:
    - every row transition has exactly its packet-owned event sequence and every code 9 through 14 event has one exact row transition
    - sequence is contiguous and sqlite_sequence equals count equals max
  complexity:
    - O(1) additional Rust history memory; no Vec, HashMap, HashSet, BTreeMap, BTreeSet, collect, or unbounded history retained by production validation
    - one bounded transition/account/manifest/event at a time
    - affine validation query-count growth over at least 128 finalized creates plus terminal prepared/config_committed/aborted/recovery variants
    - no repeated unindexed full-table scan; EXPLAIN QUERY PLAN proves store-version primary-key order and primary/unique/entity-event lookup usage with no USE TEMP B-TREE
  corruption:
    - fail the complete open as owner_recovery_required for row/transcript/digest/FK/event/timestamp/config-chain/state-shape drift
    - never silently repair, delete, unblock, finalize, abort, reissue, or normalize history

fault_contract:
  challenge:
    - preserve all accepted T202B/C1 challenge fault boundaries for account_create
  prepare_precommit:
    - after grant insert/event
    - after store block
    - after defer enabled
    - after account insert
    - after transition insert
    - after foreign-key check
    - after store block event
    - after prepared event
    - after clock
    - before commit
  prepare_postcommit:
    - response loss returns exact prepared graph on retry
  expiry:
    - after expired state
    - after clock
    - after expiry event
    - after commit response loss
  config_committed:
    - after store pair update
    - after transition update
    - after event
    - after clock
    - before and after commit
  finalize_abort_recovery:
    - after each registry row update
    - after each event
    - after clock
    - before and after commit
  fault_expectation:
    - every precommit fault leaves the exact prior durable graph and clock
    - every postcommit fault leaves one complete recoverable graph and no duplicate event on retry
    - test faults exercise the production classifier and cannot bypass production result mapping

tdd_plan:
  red:
    command: cargo test -p kirje-store --test authority_registry --all-features --locked
    required_new_failures:
      - account_create is rejected by the current T202B action fence
      - canonical display, transition, intent, and recovery byte goldens are absent
      - fresh/reused/concurrent challenge account registry context is unimplemented
      - prepare request/projection/types and lifecycle methods are absent
      - cyclic FK prepare, store-wide reservation, global identity, partial display, expiry, and fault matrices fail
      - lifecycle before/after/third and response-loss matrices fail
      - event graph and restart validator reject all C2 rows
      - 128-history affine counter/query-plan proof fails
      - trait/privacy/no-external-call stage fences fail
    proof_rule: capture exact failing test names and confirm failures are missing C2 behavior, never fixture/parser/setup mistakes
  green:
    - add closed private/public types and exact constructors without changing core or schema
    - extend challenge intrinsic/fresh checks only for AccountCreate
    - factor one canonical grant/expiry substrate for enrollment and prepare
    - implement prepare with transaction-local cyclic-FK closure
    - implement one shared exact transition loader/classifier/projection and four lifecycle APIs
    - extend event insertion/validation and restart streams for exact C2 graph
    - add minimum fault hooks and deterministic synthetic account-create fixtures
  refactor:
    - run only after focused green
    - remove real duplication in grant, expiry, event, row, and classifier helpers without changing accepted T202C1 ordering/errors
    - keep bounded functions and explicit persistent maps; do not introduce an abstraction that hides transaction order
  broaden:
    - run every validation command below fresh

test_matrix:
  canonical_bytes:
    - display digest golden and one-byte/case mutation
    - all five transition-kind codes although only create executes
    - transition transcript/digest golden and each-field mutation
    - no-time intent golden, raw observed-time nonidentity, every bounded-field mutation
    - unsafe recovery digest golden and transition/prior-state/generation/digest mutations
  challenge:
    - exact fresh, pending reuse, restart reuse, expired replacement, concurrent same context, entropy exhaustion and rollback
    - stale/absent/removed/blocked/recovery store; location, config generation/digest, binding, target, account context drift
    - account, credential, transition ID/digest, active display conflicts with exact stable errors and zero writes/entropy
    - removed display reuse allowed but historical IDs denied
    - zero challenge effects and later-stage action fences
  prepare:
    - exact success and request projection privacy
    - global identity and store-wide active transition races
    - account proposed/store blocked before any external boundary
    - FK-deferral readback, final foreign_key_check, rollback at every boundary
    - exact retry/restart/response loss; changed grant and changed prepare identity
    - authorized expiry exact/changed retry and occupancy non-probing order
  lifecycle:
    - complete durable-state by before/after/third matrix for all four APIs
    - config_committed, finalize, abort, recovery row/state/time/event atomicity
    - exact terminal retry with changed observed time; changed pair/source-state conflict
    - no recovery clearing; no finalize/abort from unsafe state
    - precommit rollback and postcommit exact recovery at every hook
  restart:
    - every legal prepared/config_committed/finalized/aborted/recovery shape
    - multiple sequential creates, abort then display reuse, one nonterminal last rule
    - exact original enroll_store retry after each current store state returns its immutable initial projection and never rewrites current state
    - row/FK/transcript/manifest/event/config-chain/timestamp corruptions
    - injected StoreRead remains StoreRead and malformed storage maps recovery
    - 128 or more complete histories, affine exact query-counter formula, O(1) source scan, indexed query plans
  privacy_and_scope:
    - request/projection trait negative compile/source checks
    - projection and all errors omit forbidden values
    - event detail digest/bytes scan
    - production source contains no config/keyring/runtime/protocol/network/credential callback or generic grant-use API
    - fixture/source/history secret scan

validation_loop:
  retry_budget: 3 implementation attempts before packet/spec re-evaluation
  focused_commands:
    - cargo test -p kirje-store --test authority_registry --all-features --locked
    - cargo test -p kirje-store --test authority_authorization --all-features --locked
    - cargo test -p kirje-store --test authority_schema --all-features --locked
    - cargo test -p kirje-store --all-features --locked
    - cargo test -p kirje-store --no-default-features --locked
    - cargo clippy -p kirje-store --all-targets --all-features --locked -- -D warnings
  full_commands:
    - cargo fmt --all --check
    - cargo test --workspace --all-features --locked
    - cargo +1.88.0 test -p kirje-store --all-features --locked
    - cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
    - cargo build --workspace --all-features --locked
    - cargo deny check licenses
    - cargo deny check bans
    - cargo deny check sources
    - cargo deny check advisories
    - python /Users/iiwish/.codex/skills/ai-delivery-governor/scripts/validate_delivery_artifacts.py --root /Users/iiwish/self/kirje
    - git diff --check
    - git status --short
  expected_signals:
    - all commands exit zero except cargo deny advisories may report only the already accepted yanked chacha20 0.10.1 chain with no dependency drift
    - focused RED is captured before production implementation and focused/full GREEN is fresh after final diff
    - authority_registry reports every C2 matrix pass; predecessor authorization/schema/store/workspace counts do not regress
    - after amendment, schema hash equals the exact accepted T202C1S evidence digest and changed files remain allowed
    - source/privacy/secret scans report zero prohibited production API, trait, output, fixture, or evidence value
  failure_handling:
    - first relevant failure is fixed test-first inside allowed files and rerun focused
    - second failure is classified as implementation, packet ambiguity, dependency, or environment
    - packet/spec ambiguity, schema pressure, validation downgrade, or scope expansion stops implementation and returns to orchestrator
    - tests, assertions, checks, or validation commands are never removed/weakened to manufacture green

evidence_contract:
  orchestrator_owned_path: .ai-platform/evidence/T202C2
  required_files:
    - summary.md
    - diff.patch
    - test-results.md
    - attempts/T202C2-A001.md
  worker_return:
    - attempt ID and status
    - exact changed files
    - RED command, failing test names, and expected failure reasons
    - implementation summary mapped to packet sections
    - GREEN and full validation commands with exit codes and concise counts
    - canonical digest/hash outputs without sensitive bytes
    - fault, concurrency, expiry, lifecycle, event, restart, affine-query, query-plan, privacy, trait, and secret-scan result summaries
    - residual risks and any unrun command
  orchestrator_integration:
    - inspect changed-files scope and full diff
    - independently rerun focused and full gates from final tree
    - generate exact production diff from packet baseline to reviewed production commit
    - run independent spec/security/code-quality review with zero Critical/High/Medium required
    - write evidence only after outputs are verified; worker never edits evidence

review_contract:
  spec_compliance:
    - corrected canonical T202C1S schema and stage boundaries preserved
    - exact challenge, request, transcript, state, error, clock, event, and validator contracts implemented
    - one store-level transition reservation and complete cyclic-FK transaction proven
  security:
    - expiry before occupancy, exact grant replay order, no authority restoration, no external call, no secret exposure, and fail-closed unsafe config proven
    - request/projection/event/error privacy and negative trait surface proven
  engineering_quality:
    - no quadratic keyed validation, unbounded collection, duplicated action policy, brittle SQL mapping, panic on durable input, or hidden transaction ordering
    - predecessor T202B/T202C1 behavior remains exact
  qa_acceptance:
    - fresh create, exact retry, abort/reuse, config-commit/finalize, response loss, concurrency, and recovery all behave from a local operator perspective without remote effects
  pass_rule:
    - independent reviewer reports zero Critical, High, and Medium finding
    - Low findings are fixed or explicitly accepted with bounded rationale before orchestrator acceptance

stop_conditions:
  - T202C1S is not Accepted or its canonical schema digest is not pinned into an amended packet validation command
  - packet review is missing or has any unresolved Critical, High, or Medium finding
  - predecessor commit/evidence/schema hash is absent or worktree has conflicting changes
  - RED cannot be produced for missing C2 behavior
  - required behavior needs any forbidden file, schema/index/dependency/core change, config/keyring/runtime/network access, or validation downgrade
  - defer_foreign_keys cannot be limited to and verified inside one first-prepare transaction
  - affine/O(1) restart validation cannot be proven on immutable v1 indexes
  - stable error/event/retry semantics remain ambiguous
  - any secret, real mailbox value, proof/private key, or user credential appears in source, fixture, output, or evidence
  - full final gates or independent review do not pass

handoff:
  issue: null
  pull_request: created only at the T202 or approved security-slice boundary
  reviewers:
    - independent security/spec reviewer
    - independent code-quality/QA reviewer
  finish_options:
    - orchestrator integrates verified evidence and marks T202C2 Accepted under standing project-owner delegation
    - otherwise create a scoped retry attempt or return packet/spec blocker
