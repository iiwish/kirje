codebase_context:
  local_instructions:
    - AGENTS.md
  relevant_files:
    - Cargo.toml
    - crates/kirje-core/Cargo.toml
    - crates/kirje-core/src/lib.rs
    - crates/kirje-core/src/mail.rs
    - crates/kirje-core/src/operation.rs
    - crates/kirje-core/src/send.rs
    - crates/kirje-core/tests/send_contract.rs
  existing_patterns:
    - core types derive serde and schemars contracts and return MailError with stable retryability
    - digest_json exists for legacy payload digests but must not encode the authorization transcript
    - account validation currently lives on MailAccountConfig and display ID is currently its id field
    - send and operation contracts already define bounded content/count constants and immutable operation records
    - the workspace forbids unsafe code and uses Rust 1.88 with edition 2024
  interfaces_or_contracts:
    - .ai-platform/specs/008-security-baseline/contracts/authorization.md
    - .ai-platform/specs/008-security-baseline/contracts/account-config-v2.md
    - .ai-platform/specs/008-security-baseline/contracts/bounded-input.md
  required_design:
    - owner realm is a distinct 32-byte value; store/account/credential/grant/effect use independent UUIDv4 identities
    - persistent identity types have no Default and reject non-canonical UUID text rather than normalizing it
    - core exposes no generator for new store/account/credential/grant/effect security identities; their OS-random generation belongs to later runtime/store tasks
    - account binding is SHA-256 of KIRJE-ACCOUNT-BINDING-V1 tagged bytes, never JSON or TOML
    - core purely encodes bounded PlatformLocationMaterial into KIRJE-CONFIG-LOCATION-V1; filesystem acquisition remains T203
    - authorization is KIRJE-AUTHORIZATION-V1 with strict ascending u16 tags and u32 lengths
    - challenge ID is SHA-256 of exact signing payload
    - action manifest is KIRJE-MANIFEST-V1; every sensitive action has an explicit policy entry, every supported action has one sealed encoder, and policy/assurance actions are explicit fail-closed unsupported entries
    - manifest payloads are sealed typed structs using the confirmed common/action/nested tag tables; arbitrary public ManifestField construction is forbidden
    - action policies expose closed ManifestSupport; unsupported policy/assurance actions have no payload variant or encoder and return unsupported_capability
    - Ed25519 verification calls VerifyingKey::verify_strict on exact persisted payload bytes
    - production code has no signing-key generation, private-key parsing, hazmat, legacy compatibility, batch, serde-key, or PEM path
    - public status/receipt projections contain digests and bounded metadata only
    - stored and public credential states are separate enums; StoreUnavailable is public-only and cannot enter signed/config snapshots
    - untrusted display disposition is separate from complete typed capability decisions
    - shared mail and authorization request types use bounded newtypes/manual deserialization; T208 preflights raw MCP bytes before rmcp DOM allocation
    - core exposes parse_bounded_json generic over the sealed BoundedJsonInput trait; callers cannot select a looser InputShape than the type owns
    - T201 inputs are SendRequest, DraftInput including MessageContent, MailboxOperationRequest, MessageSearch, MailboxSyncRequest, LocalMessageSearch, AttachmentRead, MessageRead, and AuthorizationProof plus their nested address/attachment/reference types
    - T201 owns only typed parser/shape contracts; T203 owns bounded byte acquisition, T204 strict config TOML, T207 CLI adaptation, and T208 raw MCP preflight
  forbidden_changes:
    - filesystem, SQLite, keyring, CLI, MCP, terminal, or network behavior
    - new remote mailbox effects or authentication protocols
    - owner private-key storage or production signing
    - JSON/TOML serializer bytes as signature authority
    - permissive signature verification
    - credentials, real addresses, endpoints, UIDs, mailbox content, signatures, or raw provider strings in fixtures/output
    - editing governance artifacts or task status

