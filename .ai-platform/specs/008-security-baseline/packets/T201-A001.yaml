    - cryptographic and canonical-byte review
    - bug and code-quality review
    - QA acceptance of golden, mutation, malformed, and public-output cases
  blocking_findings:
    - permissive signature acceptance
    - serializer-dependent signing bytes
    - incomplete sensitive action map
    - unstable or redirectable identity fields
    - unbounded parser or public private-material exposure
    - scope drift beyond allowed files
  acceptance_rule: >-
    The orchestrator may mark T201 Accepted only after evidence and all review
    passes are complete under the user's explicit delegated project-owner
    authority. The worker cannot mark acceptance.

