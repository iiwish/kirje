stop_conditions:
  - governance input or packet conflicts with repository instructions
  - missing dependency or stale packet
  - allowed production file has unexplained concurrent changes
  - RED failure is unrelated to the intended missing contract
  - implementation requires filesystem, store, runtime, CLI, MCP, or protocol behavior
  - implementation requires private-key handling or a weaker verification mode
  - transcript/action coverage is ambiguous and cannot be resolved from the confirmed contract
  - a validation downgrade or allowed-file expansion would be required
  - credentials, owner private material, real mailbox identifiers, content, signatures, or raw provider values appear

