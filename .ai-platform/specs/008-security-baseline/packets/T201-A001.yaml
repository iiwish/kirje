tdd_plan:
  required: true
  exception: null
  red:
    steps:
      - add account binding golden and mutation tests
      - add Unix/Windows config-location transcript goldens without filesystem I/O
      - add action/transcript parser and strict signature tests
      - replace stale arbitrary ManifestField/sequential-code goldens with the complete explicit action policy table and sealed typed payload goldens
      - add exhaustive action/error/bounded projection snapshot tests
      - add direct typed depth/string/list/Base64/decoded-total N/N+1 tests
      - run the targeted tests before production implementation
    command: >-
      cargo test -p kirje-core --test account_security_contract
      --test authorization_contract --test bounded_security_contract
      --test error_contract --test input_security_contract --all-features --locked
    expected_failure: >-
      Tests fail for missing stable account/authorization/bounded contracts or
      an assertion specific to the v0.3 representation; unrelated compile or
      environment failures are not valid RED evidence.
  green:
    command: >-
      cargo test -p kirje-core --test account_security_contract
      --test authorization_contract --test bounded_security_contract
      --test error_contract --test input_security_contract --all-features --locked
    expected_signal: all new security contract tests pass
  refactor:
    command: cargo test -p kirje-core --all-features --locked
    expected_signal: all existing and new core tests remain green

validation_loop:
  commands:
    - cargo fmt --all --check
    - cargo test -p kirje-core --all-features --locked
    - cargo clippy -p kirje-core --all-targets --all-features --locked -- -D warnings
    - cargo +1.88 check -p kirje-core --all-features --locked
  retry_budget: 2
  failure_policy:
    first_failure: fix only a T201 contract or implementation defect within allowed files and rerun the narrowest failing command
    second_failure: classify scope, spec, dependency, MSRV, or environment blocker and stop if the packet must change
    beyond_budget: return blocked attempt evidence without weakening tests, constants, transcript bytes, or strict verification
  no_downgrade:
    - do not delete or relax a failing security assertion
    - do not switch from byte golden to serializer-dependent equality
    - do not replace verify_strict with permissive verification
    - do not skip Rust 1.88 validation because the host default compiler is newer

definition_of_done:
  - core compiles without filesystem, SQLite, keyring, terminal, CLI, MCP, or network dependencies
  - account binding bytes and digest have golden fixtures plus every covered field mutation
  - manifest and authorization transcripts are deterministic, strict, bounded, and independently parsable
  - strict Ed25519 vectors and tamper/replay-shape negatives pass
  - every SensitiveAction variant has one explicit authorization/manifest policy; supported actions have sealed encoders, unsupported policy/assurance and unrecognized actions fail closed
  - operation authorization projection and stable errors are versioned without creating store/runtime behavior
  - public bounded/untrusted/receipt types cannot expose proof, signature, nonce, locator, private key, credential, or raw provider content
  - shared request parsing enforces document/depth/string/list/Base64 and decoded-total bounds before large structures are built
  - existing core tests and Clippy/Rust 1.88 checks pass

