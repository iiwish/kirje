work_unit:
  title: Challenges, proofs, and immutable receipts
  goal: >-
    Add the minimum read-only core authorization projection and proof codec, then
    implement fail-closed authority challenge creation and detached-proof
    verification over the canonical Authority SQLite v1 schema. T202B supports
    store_enroll, owner_rotate, recovery_rotate, and owner_recover challenge
    issuance only. It persists pending challenges, immutable receipts, nonce
    consumption, and exact causal events; provides bounded public projections;
    and validates every B row and event on restart. It does not register remote
    effects, mutate stores, stage/finalize trust, or accept any T202C-T202E row.
  epic: T101
  story:
    - US-003
  requirements:
    - FR-013
    - FR-014
    - FR-015
    - FR-018
    - NFR-001
    - NFR-002
    - NFR-003
    - NFR-006
    - NFR-007
  priority: P0
  depends_on:
    - T202A Accepted at commit f292132
    - T201 Accepted at commit 89cc706
    - canonical Authority SQLite V1 DDL SHA-256 572a73ba5fa83c763188d804ce9767a3c21373410d8b170f6d97b49be0a86454
    - confirmed 008 contracts including the T202B stage boundary and fixed event map
  blocks:
    - T202C
    - T202 umbrella acceptance
  parallel: false
  conflicts_with:
    - any concurrent core authorization projection, proof, challenge, receipt, nonce, authority validator, or event change
    - T202C through T202E

