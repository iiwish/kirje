governance_amendment:
  trigger: T202B-A002 independent code review
  blocking_findings:
    - same-context authorized predecessor terminal events were not proven to precede successor creation
    - the expired-predecessor correlated query performed a history-quadratic scan because historical context_sha256 had no usable index
  decision:
    - persist each challenge's exact challenge_created authority_events.sequence as created_event_sequence
    - add authorization_challenges_context_created_sequence on context_sha256, created_event_sequence, challenge_id
    - link the sequence after event append and before commit in the same transaction; committed NULL is corruption
    - stream the lifecycle index with one previous row per context and use authority_events_entity_sequence for bounded terminal lookups
    - require every authorized or expired predecessor terminal sequence to be lower than its same-context successor created sequence, including equal effective timestamps
  unchanged_boundaries:
    - application_id 0x4B49524A and user_version 1
    - 17 tables, 3 triggers, all table relations, trust-root semantics, and no migration API
    - no T202C-T202E operational row or API
  pre_release_identity_proof:
    - at the 2026-08-30 A003 governance freeze, f292132 was contained only by the local codex/v1-roadmap-governance branch; main and origin/main were 30bd322 and no remote branch or release tag contained f292132
    - at that freeze, runtime, CLI, MCP, and protocol crates contained no AuthorityHome, AuthorityStore, prepare_bootstrap, or confirm_anchor integration
    - the T202A-only inventory can contain bootstrap trust rows only and is not a supported database version
    - any manually created developer database with that inventory fails closed and requires paired developer database/anchor removal before re-bootstrap; production performs no migration, repair, or deletion
  required_review: independent packet feasibility and security review with no unresolved Critical, High, or Medium finding

