validation_loop:
  commands:
    - cargo fmt --all --check
    - cargo test -p kirje-core --test authorization_contract --all-features --locked
    - cargo test -p kirje-store --test authority_authorization --all-features --locked
    - cargo test -p kirje-store --test authority_schema --all-features --locked
    - cargo test -p kirje-core -p kirje-store --all-features --locked
    - cargo test -p kirje-store --no-default-features --locked
    - cargo clippy -p kirje-core -p kirje-store --all-targets --all-features --locked -- -D warnings
    - cargo +1.88 check -p kirje-core -p kirje-store --all-features --locked
    - sh -c 'test "$(shasum -a 256 crates/kirje-store/src/authority/schema_v1.sql | cut -d " " -f1)" = "572a73ba5fa83c763188d804ce9767a3c21373410d8b170f6d97b49be0a86454"'
  retry_budget: 2
  failure_policy:
    first_failure: fix only a T202B contract or implementation defect within allowed files and rerun the narrowest failing command
    second_failure: classify scope, spec, dependency, MSRV, concurrency, or environment blocker and stop if the packet must change
    beyond_budget: return blocked attempt output without weakening proof, replay, clock, event, validator, entropy, crash, privacy, or schema guarantees
  no_downgrade:
    - do not delete, ignore, serialize around, or relax a failing security assertion
    - do not add caller overrides or store-local parsers to make persistence easier
    - do not replace OS randomness with time, process ID, hashing, deterministic production state, or a fallback PRNG
    - do not load oversized persisted values before checking SQL type and length
    - do not silently repair malformed rows, event gaps, sequence state, or partial receipts
    - do not skip Rust 1.88, no-default-features, amended authority_schema, or canonical DDL checks

definition_of_done:
  - core owns a sealed borrowed authorization snapshot and serializer-independent proof codec; store owns no duplicate manifest/payload/proof parser or action policy
  - stage support is exactly store enrollment plus three trust actions; constructible deferred actions fail in store with zero entropy/write and policy/assurance fail at the core manifest boundary
  - new challenge uses exactly 48 random bytes, exact pending-context uniqueness, effective-time expiry, restart-safe idempotency, and one exact created event
  - first valid proof uses exactly 16 random bytes and atomically commits one immutable receipt, one nonce use, authorized state, clock, and one exact event
  - exact replay after restart and expiry returns immutable historical identity, may advance only the paired authority meta clock high-water, never appends an event, and cannot regress receipt state; changed replay fails; T202E retains post-rotation/invalidation ownership
  - expired pending proof durably commits expiry/event/clock before returning authorization_expired; already-expired restart/concurrent/response-loss retry returns the same error with no new event/state and cannot be revived by tolerated rollback
  - restart-open streams and causally validates schema-bounded B rows/proofs/receipts/nonces/events with O(1) additional memory while retaining exact initial trust root and rejecting every later-table row and any invalidated state
  - explicit owner challenge export contains only the declared bounded signing artifact; ordinary receipt/status/error/log projections omit private material and expose no SQL, path, key bytes, signature, proof, nonce, manifest, or event detail
  - deterministic fault points and barrier-based concurrent challenge/proof tests prove all-or-nothing mutation, exact response-loss recovery, and one durable winner with deterministic entropy accounting
  - schema_v1.sql equals canonical SHA-256 572a73ba5fa83c763188d804ce9767a3c21373410d8b170f6d97b49be0a86454 with 17 tables, 15 declared indexes, 3 triggers, unchanged application ID/user version, and accepted T202A bootstrap semantics green
  - targeted, predecessor, package-wide, no-default-feature, Clippy, format, and Rust 1.88 gates pass

evidence_contract:
  owner: delivery_orchestrator
  worker_output_only: true
  summary: .ai-platform/evidence/T202B/summary.md
  diff: .ai-platform/evidence/T202B/diff.patch
  test_results: .ai-platform/evidence/T202B/test-results.md
  attempt: .ai-platform/evidence/T202B/attempts/T202B-A003.md
  required:
    - exact changed-file scope and diff summary
    - retained A001/A002 RED command/exit references plus separate A003 schema and lifecycle RED commands, exit signals, and contract-relevant failures
    - GREEN, refactor, and every validation command result
    - canonical DDL digest, exact additive lifecycle schema diff, inventory/rollback proof, and no-Cargo/application-version change proof
    - core projection, proof sealing/byte-golden/mutation, and parser-ownership review
    - stage-support, action-specific manifest/current-state, signer-role, and zero-write rejection matrix
    - challenge context, pending uniqueness, entropy, expiry/recreate, restart, crash, and concurrency matrix
    - proof/receipt/nonce, exact/changed replay, paired-meta clock-only high-water, effective-time, committed-expiry/retry/response-loss, corruption, restart, crash, and concurrency matrix
    - event numeric/detail/sequence/causal graph and C-E zero-row validator matrix
    - streaming O(1) validator, bounded-load/allocation, explicit challenge-export, ordinary-output, error/log, secret, path, and private-material scans
    - residual risks and exact T202C/T202D/T202E follow-up ownership

review_contract:
  required_passes:
    - spec compliance against FR-013 through FR-015, FR-018, and mapped NFRs
    - cryptographic transcript, proof verification, signer-role, replay, nonce, and entropy review
    - SQLite transaction, crash, concurrency, bounded-load, event, and restart-validator review
    - API ownership, stable errors, privacy, and output review
    - bug and code-quality review
    - QA acceptance of the stage-support, proof/replay/time, event/causal, crash, concurrency, and schema-regression matrices
  blocking_findings:
    - duplicate store parser/policy/target/proof codec or mutable/public proof/signature fields
    - caller-selected role/key/epoch/bundle/effect/target/expected context or duplicate context not sealed by the manifest
    - any action outside the four-stage support matrix can persist a challenge, or any constructible deferred rejection consumes entropy/writes, or policy/assurance bypasses core rejection
    - incorrect signer role, non-strict signature verification, JSON-hashed proof, transcript drift, weak key acceptance, or permissive Base64
    - replay depends on current trust before exact receipt lookup, changed replay returns authority, or exact replay/already-expired recovery mutates anything except the paired monotonic authority_meta last_observed_at/updated_at high-water
    - tolerated rollback revives expired authority, expired proof rolls back its durable expiry, unchecked time arithmetic, or entropy before deterministic validation
    - partial receipt/nonce/challenge/event commit, more than one concurrency winner, or deterministic entropy accounting drift
    - event numeric/detail/sequence/causal mismatch, unbounded persisted-value load, silent repair, or acceptance of any C-E row
    - canonical DDL or lifecycle linkage drift, schema inventory outside the declared additive column/index, Cargo graph, accepted predecessor behavior, production home, or test-support boundary drift
    - private material in ordinary output, path, SQL, real mailbox/account/credential/authority/provider data exposure, or challenge-export material emitted outside its explicit owner-facing artifact
    - scope drift beyond allowed files or missing valid RED evidence
  acceptance_rule: >-
    The worker never accepts the task. After independent spec, security,
    engineering, and QA passes plus fresh required gates, the orchestrator may
    record evidence-based acceptance under the user's explicit standing
    project-owner delegation.

handoff:
  external_issue: null
  pull_request: null
  finish_options:
    - accept T202B and packetize T202C
    - create a bounded review-fix attempt within the same allowed files
    - stop on a governance, dependency, environment, or security blocker

stop_conditions:
  - current branch does not contain f292132, f3a495a, and the independently reviewed A003 governance freeze
  - T202A bootstrap semantics or evidence drift beyond the exact declared lifecycle column/index and authority_schema expectation amendment
  - packet, task, contracts, analysis, event map, or stage boundary is missing, stale, or internally inconsistent
  - any Critical, High, or Medium packet review finding remains unresolved
  - any A003 baseline file hash differs before lifecycle/schema RED begins, or any file changes concurrently after RED begins
  - A003 schema or lifecycle RED is not contract-relevant, or A003 production/schema code changes before its corresponding RED
  - implementation requires a Cargo, schema change beyond the declared column/index, further governance, evidence, runtime, CLI, MCP, protocol, skill, or documentation change
  - worker cannot prove bounded persisted-value loading, fail-closed causal validation, exact entropy counts, crash atomicity, or concurrency winner behavior
  - any secret, real account, credential, endpoint, UID, mailbox content, private signing seed, or real authority key/signature/proof/nonce enters source, fixture, log, output, or commit
  - any synthetic proof/signature/nonce vector appears outside clearly marked test/fixture scope, or any proof/signature/nonce/manifest/signing bytes appear in ordinary output rather than the one explicit owner-facing challenge artifact
