required_core_contract:
  authorization_context:
    - rename owner_key_id to signer_key_id; canonical tag 0x000b bytes do not change
    - signer is selected only by SensitiveAction::policy().required_role
    - owner_rotate and recovery_rotate use the current owner; owner_recover uses the current recovery key
  payload_projection:
    - AuthorizationPayload stores canonical target bytes and closed TargetDisplay once
    - snapshot returns AuthorizationPayloadSnapshot with private fields and borrowed accessors
    - snapshot exposes owner realm, action, target kind, borrowed target bytes/display, store/account IDs, manifest/binding/policy/bundle digests, signer key, epoch, grant, borrowed nonce, issued/expires time, optional effect, and borrowed canonical bytes
    - AuthorizationEffectSnapshot exposes effect ID, ordinal zero, and EffectKind through private fields and read-only accessors
    - TargetDisplay has no public constructor and exposes only a borrowed closed string
    - TargetKind and EffectKind expose public stable code accessors
    - ActionManifest exposes a borrowed payload accessor; store code must inspect that exact sealed payload rather than parse or reconstruct it
    - canonical payload bytes and nonce accessors borrow rather than clone
  proof_codec:
    - AuthorizationProof has validated construction/deserialization, private fields, read-only accessors, and no signature-bearing Debug
    - proof JSON remains deny_unknown_fields, canonical Base64url without padding, and bounded by the existing 4 KiB caller boundary
    - core owns KIRJE-AUTHORIZATION-PROOF-V1 transcript construction and proof_sha256
    - transcript tags 1..4 are challenge BLOB32, key BLOB32, signing digest BLOB32, and signature BLOB64
    - canonical proof bytes and decoded signature are available through non-logging read-only methods required by the store
    - core can strictly parse its canonical proof transcript back into the sealed proof object for restart validation
    - canonical proof bytes are serializer-independent and never hash JSON
  public_projection:
    - the explicit owner-facing challenge export exactly follows kirje.authorization.v1 fields in authorization.md and includes bounded Base64url manifest/signing bytes plus non-authoritative review
    - receipt output reuses AuthorizationReceiptProjection and in B derives only Unclaimed or Expired
    - challenge export is the sole intentional disclosure of signing bytes and manifest; its encoded transcript necessarily covers realm, grant, and nonce for an external owner signer
    - ordinary receipt/status/error/log output omits realm, public key bytes, signature, proof, nonce, manifest/signing bytes, private event detail, private location, and raw SQL or path data

required_store_api:
  create_challenge:
    request_fields:
      - one sealed ActionManifest
      - observed_at_unix_ms
      - requested expires_at_unix_ms
    forbidden_request_fields:
      - expected store/account/policy snapshot duplicated outside the manifest
      - caller-selected signer role, key, epoch, trust bundle, target, effect, grant, nonce, realm, or authority location
    deterministic_checks_before_entropy:
      - validate request bounds and raw rollback/issued-at skew arithmetic
      - load and validate the exact ready initial realm, journal, active epoch, trust bundle, and both active role keys
      - select signer from action policy
      - parse/revalidate the sealed manifest through core and compare its borrowed canonical bytes/digest
      - classify constructible deferred actions; policy/assurance are rejected before this API by core
      - expire the matching pending context using effective authority time
      - return an identical still-pending challenge for the same context
      - validate supported action-specific current state
    supported_action_checks:
      store_enroll:
        - payload is exactly ManifestPayload::StoreEnroll
        - expected_store_state is Unregistered
        - registered_stores contains no row for the manifest store ID
        - no store is inserted or enrolled by challenge creation
      owner_rotate:
        - payload role and permission are owner
        - old key ID/public key, old epoch, and old bundle agree exactly with current rows
        - new epoch is checked old epoch plus one; new key ID is recomputed from role/public key
        - new owner differs from both active keys and new bundle is recomputed from current realm/journal, successor epoch, proposed owner, and current recovery key
      recovery_rotate:
        - payload role and permission are recovery
        - old key ID/public key, old epoch, and old bundle agree exactly with current rows
        - new epoch is checked old epoch plus one; new key ID is recomputed from role/public key
        - new recovery differs from both active keys and new bundle is recomputed from current realm/journal, successor epoch, current owner, and proposed recovery key
      owner_recover:
        - journal, old epoch, old bundle, checked successor, invalidation All, and both proposed key IDs/public keys/bundle agree exactly
        - proposed owner and recovery keys are valid, distinct from each other, and distinct from active keys
        - new bundle is recomputed from current realm/journal, successor epoch, and both proposed keys
      all_trust_actions:
        - no key, epoch, anchor, or transition row changes and no meta change beyond the shared authority clock pair
    entropy_contract:
      - a new committed challenge consumes exactly 48 bytes after all deterministic checks: UUIDv4 grant 16 then nonce 32
      - pending reuse, deferred action, stale manifest, expiry classification before replacement, concurrent loser, and every failed deterministic check consume zero entropy
      - remote effect IDs are planner-owned and never generated here
    persistence:
      - issue time is effective_time and requested expiry must satisfy the existing positive maximum 900000 ms lifetime from issue time
      - AuthorizationPayload is built once from exact manifest/current state/random grant+nonce and persisted from the core snapshot
      - context_sha256 is the exact KIRJE-AUTHORIZATION-CONTEXT-V1 digest defined by authority-store.md
      - insert one pending authorization_challenges row, update high-water, and append one exact created event atomically
      - pending-context unique race is reclassified under the transaction and the loser returns the winner unchanged
      - no challenge_effects row is inserted in B
      - still-pending exact reuse may commit only the paired authority_meta last_observed_at and updated_at high-water, then returns the original challenge without an event
  verify_proof:
    request_fields:
      - one bounded AuthorizationProof
      - observed_at_unix_ms
    transaction_order:
      - deterministic request bounds and raw rollback checks
      - load challenge and size/type preflight before BLOB materialization
      - if a receipt exists, branch to exact replay before current signer/epoch/bundle and expiry checks
      - exact canonical proof replay returns the same immutable receipt with freshly derived state and no entropy or receipt/challenge/nonce/event timestamp change; it may update only the paired authority_meta last_observed_at and updated_at high-water
      - changed canonical proof for an existing receipt returns authorization_replayed with zero entropy/write
      - an already-expired no-receipt challenge returns the same authorization_expired after rollback validation, with no entropy, challenge/event change, or new event; it may update only the paired authority_meta clock high-water
      - without a receipt, require pending state, exact current signer/epoch/bundle/anchor, exact persisted manifest/payload/digests, unused nonce, and effective_time validity
      - verify_strict against exact persisted signing payload and current role public key
      - only then consume exactly 16 entropy bytes for one UUIDv4 receipt
    first_valid_proof:
      - insert one immutable authorization_receipts row and one nonce_uses row
      - update challenge pending to authorized and authority high-water
      - append one exact authorized event and commit atomically
      - receipt canonical bytes/digest use KIRJE-AUTHORIZATION-RECEIPT-V1 tags 1..11 exactly
    expired_proof:
      - when effective_time is greater than expires_at, update pending to expired, update high-water, append exact expired event, commit, then return authorization_expired outside the transaction
      - expiration consumes zero entropy and never verifies or inserts a receipt/nonce use
      - restart, concurrent loser, and commit-before-error-response recovery over an already-expired challenge return the same error, append no event, preserve the challenge, and may advance only the authority meta clock pair
    invalid_or_corrupt:
      - malformed input and every wrong challenge lookup write nothing and consume no entropy
      - for a still-pending first proof, wrong key/digest/role/signature/manifest/payload/epoch/bundle/anchor/time writes nothing and consumes no entropy
      - any invalidated challenge row is corruption in B and returns owner_recovery_required before proof handling; T202E activates authorization_invalidated
      - authorized marker or nonce use without the exact matching receipt is owner_recovery_required
      - any digest, transcript, relation, or state mismatch is owner_recovery_required on read/restart
  transaction_protocol:
    - acquire the fixed T202A apply lock before mutation
    - open the existing database without CREATE and run nonmutating identity/version/inventory preflight
    - enable and verify foreign_keys, trusted_schema OFF, WAL, synchronous FULL, and busy_timeout 5000 only after classifying KIRJ v1
    - start a fresh BEGIN IMMEDIATE and repeat classification plus full row/event validation inside it
    - perform all mutation, clock update, event append, and commit in that one transaction
    - injected failure before commit leaves no partial challenge, receipt, nonce, state, clock, or event mutation
    - deterministic fault hooks exist only under the non-default test-support feature and expose no production constructor or runtime switch

effective_time_contract:
  rollback:
    - reject raw observed_at more than 30000 ms below last_observed_at
    - raw observed time is used only for rollback and issued-at skew rejection
  effective_time:
    - compute max(last_observed_at, observed_at) after rollback acceptance
    - use it for issue, expiry, verified_at, receipt state, event occurred_at, and persisted high-water
    - every accepted clock write sets authority_meta.last_observed_at and authority_meta.updated_at to the same effective high-water
    - inclusive validity is effective_time less than or equal to expires_at
    - high-water past expiry can never be rolled back to revive authority
  arithmetic:
    - every subtraction, addition, successor, expiry, and timestamp conversion is checked

event_contract:
  fixed_numeric_map:
    entity_kind: "1 realm, 2 key, 3 trust_epoch, 4 store, 5 account, 6 transition, 7 cleanup, 8 challenge, 9 receipt, 10 grant, 11 effect, 12 invocation, 13 observation"
    event_code: "1 bootstrap_prepared, 2 bootstrap_confirmed, 3 challenge_created, 4 challenge_authorized, 5 challenge_expired, 6 challenge_invalidated, 7 grant_used, 8 store_enrolled, 9 store_state_changed, 10 account_transition_prepared, 11 account_config_committed, 12 account_transition_finalized, 13 account_transition_aborted, 14 account_transition_recovery_required, 15 cleanup_ready, 16 cleanup_claimed, 17 cleanup_deleted, 18 effect_claimed, 19 invocation_started, 20 effect_observed, 21 rotation_staged, 22 rotation_finalized, 23 recovery_staged, 24 recovery_finalized, 25 key_retired, 26 epoch_retired"
    source: "1 authority_store, 2 bootstrap, 3 proof_verifier, 4 runtime, 5 crash_recovery, 6 owner_reconciliation"
  bootstrap_prefix:
    - sequence 1 and 2 retain the exact accepted T202A prepare/confirm rows and detail transcripts
  challenge_created:
    - entity kind 8, code 3, source 1, entity challenge ID
    - related kind 10 and related grant ID
    - prior state 0, next state 0x0801
    - context is challenge context_sha256; receipt field absent; occurred_at equals issued_at
  challenge_authorized:
    - entity kind 8, code 4, source 3, entity challenge ID
    - related kind 9 and related receipt ID; receipt field is the same receipt ID
    - prior state 0x0801, next state 0x0802
    - context is receipt_sha256; occurred_at equals verified_at
  challenge_expired:
    - entity kind 8, code 5, source 1, entity challenge ID
    - no related entity and no receipt
    - prior state 0x0801, next state 0x0803
    - context is challenge context_sha256
    - occurred_at is greater than expires_at and no greater than authority high-water
  sequence_rules:
    - sequence is globally contiguous with no gap
    - sqlite_sequence for authority_events equals COUNT(*) and MAX(sequence)
    - every challenge has exactly one created event and at most one exact terminal event matching durable state
    - pending reuse, exact replay, and already-expired recovery append no event
    - event detail uses the accepted canonical event transcript/digest and is reparsed/recomputed on open

restart_validator_contract:
  retained_t202a_invariants:
    - exact ready bootstrap realm/journal/meta/anchor match
    - exactly two active authority keys and one active epoch 1 with exact role masks and trust-bundle digest
    - application ID, user version, 17 tables, 3 triggers, trust relations, and bootstrap semantics are unchanged; the exact declared T202B lifecycle column/index amendment is canonical
  admitted_t202b_rows:
    - bounded authorization_challenges
    - bounded authorization_receipts
    - bounded nonce_uses
    - authority_events with exact bootstrap prefix and B causal suffix
    - every authorization_challenges row has an exact positive created_event_sequence linked to its challenge_created event
  rows_that_remain_zero:
    - registered_stores
    - registered_accounts
    - challenge_effects
    - grant_uses
    - account_transitions
    - credential_cleanup
    - remote_effects
    - effect_claims
    - effect_invocations
    - effect_observations
  loading_rules:
    - select typeof and length first; reject wrong class, negative, oversized, or impossible values before loading a BLOB/text value
    - there is no historical-row cardinality cap; validate one consistent snapshot in deterministic row order with O(1) additional memory beyond one schema-bounded row/transcript
    - never collect all challenges, receipts, nonces, or events into a history-proportional Vec/map; use streaming scans and indexed causal lookups
    - reparse each manifest and authorization payload with core and compare canonical bytes, every snapshot field, and every digest
    - reparse each canonical proof with core and recompute proof digest; recompute receipt transcript/digest
    - strictly reverify every persisted receipt proof against its exact signer key and persisted signing payload
    - validate challenge state, context, signer role, target/effect shape, receipt/nonce graph, and event graph bidirectionally
    - stream authorization_challenges_context_created_sequence in context/created order, retain only the previous challenge in one context, and prove every predecessor terminal sequence is lower than successor creation
    - query terminal events only through authority_events_entity_sequence; EXPLAIN QUERY PLAN must show no correlated challenge/event table scan
    - do not add a store-local parser for manifest, authorization payload, proof, action policy, target display, or their tag tables

execution_constraints:
  branch_or_worktree: codex/v1-roadmap-governance in the current workspace
  allowed_files:
    - crates/kirje-core/src/authorization.rs
    - crates/kirje-core/tests/authorization_contract.rs
    - crates/kirje-store/src/lib.rs
    - crates/kirje-store/src/authority.rs
    - crates/kirje-store/src/authority/schema_v1.sql
    - crates/kirje-store/tests/authority_schema.rs
    - crates/kirje-store/tests/authority_authorization.rs
    - crates/kirje-store/tests/fixtures/authority/authorization/**
  test_targets:
    - crates/kirje-core/tests/authorization_contract.rs
    - crates/kirje-store/tests/authority_schema.rs
    - crates/kirje-store/tests/authority_authorization.rs
    - crates/kirje-store/tests/fixtures/authority/authorization/**
  ownership_notes:
    - governance, packet, evidence, schema fixtures, Cargo files, lockfile, runtime, CLI, MCP, protocol, skills, and docs are orchestrator-owned or outside scope
    - schema_v1.sql and authority_schema.rs are allowed only for the declared lifecycle column/index, canonical hash/inventory, transactional rollback, and corruption/query-plan tests
    - worker must not edit governance/evidence, create a commit, accept the task, or delegate further
    - accept the current A001/A002 core/store implementation as the hash-pinned A003 baseline and preserve its recorded RED evidence
    - add only A003 schema inventory/linkage/query-plan tests and demonstrate contract-relevant RED before A003 production/schema edits
    - preserve accepted T201/T202A and all user work
    - stop if any allowed production file changes concurrently after RED begins
  dependency_constraints:
    - no Cargo.toml, Cargo.lock, feature, or dependency change
    - use existing ed25519-dalek, base64, chrono, serde, schemars, rusqlite, uuid, getrandom, fs4, and test-support facilities only
    - do not add an ORM, migration framework, canonical JSON package, async runtime, signer, keyring, network client, or unsafe platform binding
    - schema fixtures remain read-only; schema_v1.sql may receive only created_event_sequence and authorization_challenges_context_created_sequence
    - tests may commit clearly synthetic, deterministic, non-user public-key/signature/proof/nonce/transcript vectors; no private signing seed or real authority material is permitted
  forbidden_changes:
    - any file outside execution_constraints.allowed_files
    - any DDL change beyond the declared created_event_sequence column and authorization_challenges_context_created_sequence index; any migration API, application ID, user version, table, trigger, or Cargo graph change
    - any runtime, CLI, MCP, protocol adapter, Agent Skill, product documentation, release, CI, credential, mailbox, provider, or network change
    - registration, apply/use/claim/invoke/observe, store/account transition, cleanup, rotation/recovery staging/finalization, invalidation, or audit APIs
    - caller-controlled production path, entropy, key role, trust context, target, effect, or expected snapshot
    - secrets or any real account address, endpoint, UID, mailbox content, authority key/signature/proof/nonce, credential, or provider value in fixtures, logs, output, or commits
    - synthetic test vectors outside test/fixture scope, or proof/signature/nonce/private transcript material in ordinary receipt/status/error/log output; explicit owner challenge export is the declared exception
    - serializer-dependent durable bytes, permissive UUID/Base64/time parsing, randomness fallback, silent repair, unbounded allocation, or unsafe Kirje code

