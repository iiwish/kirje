tdd_plan:
  required: true
  exception: null
  red:
    preparation:
      - verify baseline hashes and a clean/explainable worktree
      - add authority_registry.rs fixtures/helpers only inside allowed scope
    targets:
      - missing typed request/projection/enroll_store API and exact grant transcript golden
      - store-derived effective used_at under raw rollback, first use, exact retry with later raw observation, changed six-field/intent retry, authorized-unclaimed expiry, exact expired retry, proof replay after expiry, and rollback-tolerance matrix
      - receipt projection priority: Unclaimed before use, Used after enrollment, Used after later expiry, and Expired only for an expired receipt with no durable use
      - request/manifest/material mismatch and both-direction store/location/config/receipt uniqueness matrix
      - every declared pre/post-commit fault, response-loss recovery, exact concurrency, conflicting concurrency, stale-handle, and zero-entropy matrix
      - same-context authorized sibling and different-context pending sibling survive another receipt's enrollment; restart/proof replay succeeds and loser apply is deterministic
      - authorize A then create successor B then expire A, including equal effective timestamps; replacement-terminal/final-state event order, swaps, omissions, and duplicates
      - 128-or-more complete legal enrollment histories plus EXPLAIN QUERY PLAN for PK/UNIQUE streams and authority_events_entity_sequence with no temp sort/correlated scan
      - event detail/order/cardinality and restart corruption/oversize/orphan/cross-link/stage-fence/current-config matrix
      - request and projection negative trait/API privacy review plus bounded output/error scan
    command: cargo test -p kirje-store --test authority_registry --all-features --locked
    expected_failure: >-
      The new target fails only because the T202C1 API, grant transcript,
      enrollment transaction, event shapes, or incremental restart validator is
      absent. Existing-test, syntax, dependency, schema, toolchain, or
      environment failures are not valid RED evidence.
  green:
    command: cargo test -p kirje-store --test authority_registry --all-features --locked
    expected_signal: all T202C1 first/retry/expiry/uniqueness/fault/concurrency/event/restart/privacy targets pass
  refactor:
    command: cargo test -p kirje-store --all-features --locked
    expected_signal: T202A/T202B and T202C1 remain green without duplicate core policy/parser or schema drift

validation_loop:
  commands:
    - cargo fmt --all --check
    - cargo test -p kirje-store --test authority_registry --all-features --locked
    - cargo test -p kirje-store --test authority_authorization --all-features --locked
    - cargo test -p kirje-store --test authority_schema --all-features --locked
    - cargo test -p kirje-store --all-features --locked
    - cargo test -p kirje-store --no-default-features --locked
    - cargo clippy -p kirje-store --all-targets --all-features --locked -- -D warnings
    - cargo +1.88 check -p kirje-store --all-features --locked
    - cargo test --workspace --all-features --locked
    - cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
    - cargo build --workspace --all-features --locked
    - cargo deny check licenses bans sources
    - sh -c 'test "$(shasum -a 256 crates/kirje-store/src/authority/schema_v1.sql | cut -d " " -f1)" = "572a73ba5fa83c763188d804ce9767a3c21373410d8b170f6d97b49be0a86454"'
    - python3 /Users/iiwish/.codex/skills/ai-delivery-governor/scripts/validate_delivery_artifacts.py --root /Users/iiwish/self/kirje --feature-id 008-security-baseline
  retry_budget: 2
  failure_policy:
    first_failure: fix only a T202C1 contract or implementation defect within allowed files and rerun the narrowest failing command
    second_failure: classify scope, spec, dependency, MSRV, concurrency, or environment blocker and stop if the packet must change
    beyond_budget: return blocked attempt output without weakening receipt, expiry, exact-replay, transaction, event, restart, privacy, or schema guarantees
  no_downgrade:
    - do not delete, ignore, serialize around, or relax a failing security assertion
    - do not add caller authority overrides or duplicate core manifest/action/target parsing
    - do not make grant use independently callable or perform config/keyring/network work
    - do not silently repair malformed rows, event gaps, cross-links, or partial state
    - do not skip Rust 1.88, no-default-features, accepted authority tests, or canonical DDL checks
  known_external_advisory:
    command: cargo deny check advisories
    expected_signal: only the pre-existing yanked chacha20 0.10.1 chain through io-imap; any additional advisory or dependency drift blocks acceptance

definition_of_done:
  - typed nonlogging requests bind exact grant, receipt, target, manifest, store, location material/digest, and config context while raw observed time remains clock input only; request and projection expose none of the prohibited traits
  - first use derives durable time from effective authority time and requires an unexpired immutable receipt plus exact current context; exact durable use recovery precedes fresh context, changed retry returns grant_already_used, and receipt state remains Used after later expiry
  - authorized-unclaimed expiry commits exact enrollment-intent-bound final state, paired clock, and one causal event before returning authorization_expired; exact retry and proof replay are historical and nonrefreshing
  - one transaction and fixed lock commit exact grant/use event/store/enrollment event/clock state; pre-commit faults roll back and post-commit response loss is exactly recoverable
  - store ID and location digest are immutable one-to-one identities; manifest/material/config/receipt mismatches fail with the declared stable code and no partial state
  - restart validation is intrinsic for historical sibling challenges, distinguishes replacement terminals from later final-state expiry, streams 128-or-more complete histories with indexed plans and O(1) memory, proves exact grant/store/challenge/receipt/event causality, and rejects later-stage or malformed graphs without repair
  - normal projections/errors/logs expose no location, config, grant/receipt, authorization, event-detail, SQL, path, or real mailbox/account material
  - T202A/T202B, no-default-features, format, package/workspace test/Clippy/build, Rust 1.88, cargo-deny license/ban/source, artifact, and canonical schema gates pass with no Cargo/core/schema drift; advisory output is unchanged and separately recorded

