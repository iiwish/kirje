required_store_api:
  input_ownership:
    - define a typed GrantUseRequest carrying only grant_id, receipt_id, action, target_kind, canonical target bytes, and manifest_sha256; it contains no caller time
    - define a typed EnrollStoreRequest carrying one GrantUseRequest, store_id, PlatformLocationMaterial, location_sha256, config_generation, config_sha256, and observed_at_unix_ms
    - request construction validates target length/shape, nonnegative UTC-millisecond times, positive generation, bounded canonical location bytes, and location digest before database access
    - the location digest must equal SHA-256 of PlatformLocationMaterial.canonical_bytes and the sealed manifest ConfigCas location digest
    - request store ID, location digest, generation, config digest, and unregistered expectation must equal the exact StoreEnrollManifest that produced the immutable challenge manifest digest
    - outer observed time is a raw clock sample only; the store derives durable use/store/event time from checked effective authority time on first success and never persists raw observed time
    - config generation is representable in SQLite's signed positive 1..=i64::MAX range; wider core u64 values fail before a write
    - request types do not implement Debug, Display, Serialize, JsonSchema, or logging helpers
  projection:
    - return a closed enrolled-store projection containing only store_id, state active, config_generation, created_at, and updated_at
    - projection omits location material and digest, config digest, grant and receipt IDs, manifest/signing/proof/signature/nonce/public-key/realm bytes, event detail, SQL, and path
    - projection does not expose an accessor that recovers any omitted value
    - projection does not implement Debug, Display, Serialize, JsonSchema, or logging helpers
  operation:
    - enroll_store consumes the request under the fixed apply lock and one fresh BEGIN IMMEDIATE transaction
    - exact committed recovery returns the same store projection and no fresh authority object
    - store enrollment consumes no entropy and performs no external callback

grant_use_contract:
  error_precedence:
    - pure request bounds, typed UUID/action/target/observed-time/generation, canonical location length, and material/digest validation run before database mutation
    - transaction schema, anchor, accepted-history, event, or atomic-graph corruption returns owner_recovery_required before replay/business errors
    - a present grant row is next: changed six-field identity returns grant_already_used; exact grant plus missing/mismatched store or event graph is corruption; exact graph then passes the checked clock and recovers
    - with no grant, exact receipt/challenge and enrollment-intent identity is next; mismatch returns authorization_context_stale with no write
    - immutable expiry is evaluated and durably recorded before fresh current-authority or store/location occupancy checks, preventing expired authority from probing registry aliases
    - fresh authority mismatch returns authorization_context_stale; only a current valid first use can return config_store_identity_conflict for a store/location alias
    - two distinct valid receipts racing the same store/location are not exact retries; the loser returns config_store_identity_conflict with no loser grant/event and never replaces enrolled_receipt_id
  enrollment_intent:
    domain: "KIRJE-STORE-ENROLLMENT-INTENT-V1\\0"
    tags:
      - "0x0001 grant UUID16"
      - "0x0002 receipt UUID16"
      - "0x0003 action u16be"
      - "0x0004 target-kind u16be"
      - "0x0005 canonical target bytes"
      - "0x0006 manifest SHA-256 BLOB32"
      - "0x0007 store UUID16"
      - "0x0008 location SHA-256 BLOB32"
      - "0x0009 config generation u64be"
      - "0x000a config SHA-256 BLOB32"
    identity: SHA-256 of the exact transcript; canonical material is represented by its recomputed location digest and raw observed time is absent
    recovery: immutable challenge, receipt, sealed manifest, and a bounded request can recompute the exact digest even when expiry committed no grant/store row
  canonical_transcript:
    domain: "KIRJE-GRANT-USE-V1\\0"
    tags:
      - "0x0001 grant UUID16"
      - "0x0002 receipt UUID16"
      - "0x0003 action u16be"
      - "0x0004 target-kind u16be"
      - "0x0005 canonical target bytes"
      - "0x0006 manifest SHA-256 BLOB32"
      - "0x0007 use-time i64be"
    digest: use_sha256 is SHA-256 of the exact transcript; use_receipt stores those exact bytes
    parser_rule: recompute or strictly parse every persisted row without serializer-dependent bytes or a duplicate core action/target policy table
  first_use_checks:
    - exact receipt_id/grant_id relationship and exact challenge action, target kind/bytes, manifest digest, receipt expiry, challenge state, and no existing grant use
    - exact ready anchor/journal, active owner key and permission, trust epoch and bundle, challenge key/epoch/bundle, and authority clock
    - exact sealed StoreEnrollManifest, enrollment-intent digest, and request registry context
    - derive durable used_at from checked effective authority time; require receipt.verified_at <= used_at <= receipt.expires_at for success
    - checks are performed in the same transaction before grant/store rows and without entropy
  exact_recovery:
    - look up grant_id before fresh expiry/current-context validation
    - exact match of the six-field grant identity, enrollment intent, stored use transcript, and store graph returns the same enrolled store after later expiry; T202E owns proof that the order remains valid after a finalized invalidation
    - exact recovery appends no event, changes no identity row, cannot refresh expiry/use time/receipt/store timestamps, and may advance only authority_meta.last_observed_at and updated_at under the checked clock rule
    - any changed field for an existing grant returns grant_already_used with retryable false and no write
    - receipt projection state is Used before expiry whenever this exact durable grant exists; exact proof replay after enrollment returns Used even after expiry and never refreshes authority
  first_use_expiry:
    - effective_time greater than immutable receipt expires_at changes authorized unclaimed challenge to expired in the same transaction
    - update only challenge state, paired authority clock, and one exact authorized-to-expired challenge event whose context is enrollment-intent SHA-256; insert no grant or store row
    - commit before returning authorization_expired
    - exact restart/concurrent/response-loss retry recomputes the intent from immutable rows plus the request, returns the same error with no second event, and may advance only the paired authority clock
    - a changed intent after committed expiry returns authorization_context_stale and writes nothing; a changed raw observed time alone is not identity
    - exact proof replay after this transition still returns the immutable receipt projection in Expired state
    - tolerated clock rollback never extends expiry or regresses Expired to Unclaimed

store_enrollment_contract:
  uniqueness:
    - store_id is globally one-to-one with location_sha256 and both identities are immutable
    - an existing store ID with different location or an existing location with different store ID returns config_store_identity_conflict
    - an existing exact store registration must also match the canonical location material bytes, config generation/digest, and enrolled receipt or fail closed
    - request/sealed-manifest or material/digest disagreement returns authorization_context_stale before mutation
    - grant replay mismatch takes precedence as grant_already_used once that grant row exists
  row_shape:
    - state is active, removed_at is NULL, created_at equals updated_at equals store-derived effective authority time
    - enrolled_receipt_id is the exact immutable receipt consumed by the grant use
    - location_material is the exact canonical PlatformLocationMaterial bytes, length 1..4096, and hashes to location_sha256
    - config generation/digest equal the exact sealed ConfigCas
  atomicity:
    - grant row, grant event, store row, store event, paired clock update, and commit are one transaction
    - any error/fault before commit rolls back all T202C1 rows/events/clock changes
    - a post-commit response fault leaves a fully recoverable exact enrollment

event_contract:
  fixed_maps:
    entity_kind: "4 store, 8 challenge, 9 receipt, 10 grant"
    event_code: "5 challenge_expired, 7 grant_used, 8 store_enrolled"
    source: "1 authority_store, 4 runtime"
    state: "0401 store_active, 0802 challenge_authorized, 0803 challenge_expired, 0901 grant_unclaimed, 0902 grant_used"
  authorized_unclaimed_expiry:
    - entity kind 8, code 5, source 1, entity challenge BLOB32
    - related kind 9 and receipt UUID16; prior 0x0802; next 0x0803
    - context enrollment-intent SHA-256; receipt field same receipt UUID; occurred_at effective authority time
  grant_used:
    - entity kind 10, code 7, source 1, entity grant UUID16
    - related kind 9 and receipt UUID16; prior 0x0901; next 0x0902
    - context use_sha256; receipt field same receipt UUID; occurred_at store-derived effective used_at
  store_enrolled:
    - immediately follows grant_used with no interleaved event in the transaction
    - entity kind 4, code 8, source 4, entity store UUID16
    - related kind 10 and grant UUID16; prior 0x0000; next 0x0401
    - context use_sha256; receipt field same receipt UUID; occurred_at the same store-derived effective used_at
  replay:
    - exact committed enrollment recovery appends neither event
    - exact no-use expiry recovery appends no second expiry event
  privacy:
    - detail contains no location material/digest, config digest, manifest, proof, signature, nonce, public key, credential, mailbox content, endpoint, provider response, or path

restart_validator:
  intrinsic_history:
    - stream and preflight every grant_uses and registered_stores row in deterministic indexed or primary-key order with O(1) additional memory beyond one bounded row/transcript
    - verify SQL storage class/length/range/enum, strict transcript reparse/recompute, canonical material digest, composite FKs, exact receipt/challenge context, and immutable timestamps
    - historical challenge validation is purely intrinsic and never checks current store/location presence for pending, authorized, expired, used, same-context sibling, or different-context sibling rows
    - fresh create_challenge issuance and no-grant first use check both store ID and sealed location digest absence; a conflict returns config_store_identity_conflict without entropy or write
    - in the T202C1 stage only, empty transition/account tables imply current store config equals the initial enrollment manifest; factor this check so T202C2 can replace it with exact transition-chain validation without rewriting enrollment history
  causal_graph:
    - a successful store row has exactly one exact grant use and one enrollment receipt; its challenge is authorized/historically used and immutable store/location/enrollment context matches while the T202C1 current config equals the initial manifest
    - a grant use has exactly one grant_used event; an enrolled store has exactly one immediately following store_enrolled event; details and digests recompute exactly
    - an expired challenge with a receipt and no grant has exact created, authorized, and authorized-to-expired events in causal sequence
    - same-context replacement ordering uses authorization as the terminal when a receipt exists and pending-to-expired otherwise; later authorized-to-expired final state may follow an already-created legal successor but must follow authorization
    - event sequence remains contiguous and sqlite_sequence equals COUNT equals MAX
  complexity:
    - a 128-or-more complete legal enrollment-history fixture opens and validates successfully after restart
    - EXPLAIN QUERY PLAN proves grant/store streams use primary or declared unique indexes and per-entity event lookup uses authority_events_entity_sequence with no temporary sort or correlated full-table scan
    - implementation retains no history-proportional Vec, map, or set; code review and bounded allocator/RSS evidence are recorded
  stage_fence:
    - registered_accounts, challenge_effects, account_transitions, credential_cleanup, remote_effects, effect_claims, effect_invocations, and effect_observations remain exactly empty
    - trust keys/epochs remain the accepted two-active-key/one-active-epoch root and invalidated/rotated history remains T202E-owned
  corruption:
    - malformed, oversized, cross-linked, duplicate-event, orphan-event, wrong-order, wrong-source/state/context/receipt, digest-mismatch, or impossible challenge/grant/store graph returns owner_recovery_required without repair
    - preflight SQL type/length checks occur before loading bounded blobs into Rust

fault_and_concurrency:
  deterministic_fault_points:
    - after grant row insert
    - after grant event append
    - after store row insert
    - after store event append
    - after paired clock update
    - before commit
    - after commit
    - after authorized-to-expired state update
    - after expiry clock update
    - after authorized-to-expired event append
  required_proofs:
    - every pre-commit fault leaves no partial grant/store/event/clock mutation
    - after-commit response loss exact retry returns the same projection with no new event
    - concurrent exact requests have one durable first writer and one exact recovery result
    - concurrent store-ID or location contenders have one winner and one stable identity-conflict loser
    - concurrent distinct receipts over the otherwise same store/location/config have one winner; the loser is config_store_identity_conflict and does not consume its grant
    - authorized and pending same/different-context sibling challenges remain valid historical rows after one sibling enrolls; restart/proof replay succeeds and every unconsumed loser apply resolves by current expiry/context/identity rules
    - a stale pre-opened AuthorityStore handle cannot bypass the in-transaction ready snapshot, uniqueness, expiry, or exact-retry checks
    - enrollment consumes zero deterministic entropy on success, retry, failure, crash, and concurrency paths

test_fixture_contract:
  - repository tests contain only clearly marked deterministic synthetic public keys, detached signatures, proofs, nonces, IDs, location values, and bounded fixture data; no signing seed or signing API enters Kirje source, Cargo manifests, fixtures, evidence, or commits
  - when new signatures are required for the 128-or-more legal-history fixture, the worker may use a disposable out-of-repository process with the public RFC8032 synthetic vector solely to precompute detached signatures; the seed and signer source are never copied into the repository or evidence and the disposable files are removed after fixture verification
  - the committed fixture is bounded, contains no real material, has an evidence-recorded SHA-256, and is independently reverified by AuthorityStore verify_strict while the test builds the exact challenge transcript
  - fixture generation is not a Kirje product, test-support API, dependency, command, signer surface, or exception to the no-private-key product contract

