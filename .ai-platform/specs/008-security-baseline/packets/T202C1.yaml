    - create a bounded review-fix attempt within the same allowed files
    - stop on a governance, dependency, environment, or security blocker

stop_conditions:
  - current branch does not contain production commit 43f0788 and evidence commit 9241fe4
  - T202B accepted behavior, packet/evidence, canonical schema, fixed event map, or T202C1 contract amendment is missing, stale, or internally inconsistent
  - any Critical, High, or Medium packet review finding remains unresolved
