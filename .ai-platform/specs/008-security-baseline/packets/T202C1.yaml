  worker_output_only: true
  summary: .ai-platform/evidence/T202C1/summary.md
  diff: .ai-platform/evidence/T202C1/diff.patch
  test_results: .ai-platform/evidence/T202C1/test-results.md
  attempt: .ai-platform/evidence/T202C1/attempts/T202C1-A001.md
  required:
    - exact changed-file scope, baseline hashes, and diff summary
    - RED command/exit and contract-relevant failure before production edits
    - GREEN, refactor, and every validation command result
    - full workspace test/Clippy/build, cargo-deny license/ban/source, known advisory inventory, and artifact-validator result
    - grant transcript byte golden, strict row reparse/recompute, request-shape, and exact/changed replay evidence
    - enrollment-intent byte golden plus expiry, effective-time/raw-rollback, committed error, exact/changed intent retry, proof replay, and clock-only high-water matrix
    - store/location/config/receipt uniqueness, mismatch precedence, fault, response-loss, concurrency, stale-handle, and zero-entropy matrices
    - sibling-history and replacement-terminal/final-state event numeric/detail/digest/order/cardinality plus restart causal/corruption/stage-fence/current-config matrix
    - 128-or-more complete history, EXPLAIN indexed plan, O(1) streaming, SQL preflight/bounded-load, request/projection trait/API, ordinary-output, error/log, path/SQL, private-material, and secret scans
    - canonical DDL digest, no schema/Cargo/core change proof, residual risks, and exact T202C2/T202D follow-up ownership

review_contract:
  required_passes:
    - spec compliance against FR-003, FR-016, FR-018, mapped NFRs, and the T202C1 contract amendment
    - authorization/grant transcript, expiry, replay-order, authority-context, and stable-error review
    - SQLite transaction, uniqueness, crash, concurrency, event, causal restart, bounded-load, and corruption review
    - API ownership, nonlogging private inputs, projection/privacy, and stage-fence review
    - bug and code-quality review
    - QA acceptance of first/retry/expiry/alias/fault/concurrency/restart matrices
  blocking_findings:
    - independently callable grant use, caller authority boolean/override, duplicate core action/manifest/target parser, or entropy/external side effect
    - caller-supplied durable use time, raw observed time persisted as identity/event time, fresh expiry/current-context checks before exact durable grant recovery, authority refresh on retry, changed retry not returning grant_already_used, or expired authority revived
    - request does not bind exact sealed manifest/material/store/config context or location material does not recompute its digest
    - store/location alias, changed enrollment replacement, partial transaction, multiple concurrency winners, stale-handle bypass, or nondeterministic error precedence
    - incorrect enrollment-intent or event code/source/state/detail/receipt/context/order/cardinality, authorized-to-expired treated as the replacement terminal, or event graph not causally linked to exact rows
    - current registry presence invalidates an intrinsic historical sibling, successful enrollment invalidates its own challenge, restart validation lacks the 128-row indexed proof or is proportional-memory/unbounded, or later-stage rows become accepted
    - schema/Cargo/core/predecessor drift, missing valid RED, or scope outside allowed files
    - private location/config/authorization/event/path/SQL/real mailbox/account/provider material in ordinary API/output/log/error/fixture/commit
  acceptance_rule: >-
    The worker never accepts the task. After independent spec, security,
    engineering, and QA passes plus fresh required gates, the orchestrator may
    record evidence-based acceptance under the user's explicit standing
    project-owner delegation.

handoff:
  external_issue: null
  pull_request: null
  finish_options:
