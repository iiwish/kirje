  - RED is not contract-relevant, or production code changes before RED
  - implementation requires any file, dependency, schema, core API, action issuance, or operation outside allowed scope
  - worker cannot prove exact durable recovery-before-current-context order, committed expiry error, one-to-one store/location identity, transaction atomicity, event causality, bounded restart validation, or zero entropy
  - any secret, real account, credential, endpoint, UID, mailbox content, private signing seed/artifact, real proof/signature/nonce, or real platform location enters repository source, fixture, evidence, log, output, or commit; clearly marked bounded synthetic public/signature/proof/nonce/location test vectors and the disposable out-of-repository precomputation in test_fixture_contract are the only exceptions
