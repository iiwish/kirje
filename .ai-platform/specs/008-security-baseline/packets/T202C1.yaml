work_unit:
  title: Grant use and exact config-store enrollment
  goal: >-
    Implement one canonical grant-use substrate and owner-authorized store
    enrollment transaction over the unchanged Authority SQLite v1 schema. The
    transaction consumes an existing T202B store_enroll receipt, validates the
    sealed manifest and exact current authority context, binds one StoreId to
    one bounded private platform location and exact config generation/digest,
    appends immutable grant/store events, and supports exact crash/restart
    recovery. It expands the restart validator only for T202C1 rows and events.
  epic: T101
  story:
    - US-003
  requirements:
    - FR-003
    - FR-016
    - FR-018
    - NFR-001
    - NFR-002
    - NFR-003
    - NFR-006
    - NFR-007
  priority: P0
  depends_on:
    - T202B Accepted at production commit 43f0788
    - T201 Accepted at commit 89cc706
    - canonical Authority SQLite v1 DDL SHA-256 572a73ba5fa83c763188d804ce9767a3c21373410d8b170f6d97b49be0a86454
    - confirmed T202C1 lifecycle and event amendments in authority-store.md and data-model.md
  blocks:
    - T202C2
    - T202C umbrella acceptance
    - T202D
  parallel: false
  conflicts_with:
    - any concurrent authority.rs, grant-use, store-registry, authority-event, clock, or restart-validator change
    - T202C2 through T202E

stage_boundary:
  supported_new_operation:
    - enroll_store using an existing immutable store_enroll receipt
  challenge_issuance_delta:
    - supported actions remain exactly T202B's store_enroll, owner_rotate, recovery_rotate, and owner_recover
    - store_enroll fresh issuance additionally rejects an existing target store ID or existing sealed location digest with config_store_identity_conflict; historical validation never applies this current-state check
    - no account, credential, cleanup, send, mailbox, or ambiguous_close challenge becomes supported in T202C1
    - no challenge_effects row is inserted
  forbidden_stage_operations:
    - no registered account, account transition, credential cleanup, remote effect, effect claim, invocation, observation, rotation, recovery, invalidation, or audit API
    - no config file, credential/keyring, runtime, protocol, CLI, MCP, or network access
    - no grant-use operation that is independently callable without one packet-owned mutation path
    - no schema, application ID, user version, index, table, trigger, or migration change

governance_amendment:
  trigger: first independent T202C1 packet feasibility and security review
  resolved_findings:
    - historical store-enroll challenges incorrectly depended on current store absence and would reject legal authorized/pending siblings after one enrollment
    - authorized-to-expired final state was incorrectly conflated with the earlier replacement terminal used for same-context successor ordering
    - caller used_at conflicted with effective authority time and made no-grant expiry response-loss identity unprovable
    - O(1) restart validation lacked a high-cardinality legal-history and EXPLAIN QUERY PLAN RED
  decision:
    - historical challenge validation is intrinsic only; store/location absence is fresh issuance or first-use context
    - authorization closes the pending replacement interval; later authorized-to-expired is a separate final-state event
    - GrantUseRequest has no time; store derives durable used_at and every success timestamp from effective authority time
    - KIRJE-STORE-ENROLLMENT-INTENT-V1 binds the time-independent exact no-grant request and is the authorized-to-expired event context
    - add 128-or-more complete legal enrollment history plus indexed-query-plan RED and bounded-memory code review
  required_review: satisfied by T202C1_A002_PACKET_REVIEW_PASS with zero Critical, High, Medium, or Low finding

