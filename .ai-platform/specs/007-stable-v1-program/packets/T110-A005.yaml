work_unit:
  title: Complete the credential-delete authority transition
  attempt: T202C3-A005
  goal: >-
    Implement the exact credential_delete prepare, config-commit, finalize,
    abort, unsafe-observation recovery, retry, expiry, restart, and immutable
    version lifecycle. Bind the credential-targeted grant to the complete signed
    bound-to-missing account mutation and active-locator digest without deleting
    credential history or adding keyring, cleanup, runtime, CLI, MCP, protocol,
    network, or external-effect capability.
  parent: T110 Complete Authority Lifecycles
  security_task: T202C3 Account Credential And Cleanup Lifecycles
  depends_on:
    - T109 Accepted
    - T202C2 Accepted at production commit 94f3495
    - T202C3-A004 Accepted at production commit 1c6d7cb
  blocks:
    - cleanup challenge attempt
    - cleanup claim/delete attempt
  parallel: false
  conflicts_with:
    - all concurrent authority registry, transition, credential, event, or restart validation work

codebase_context:
  branch: codex/v1-roadmap-governance
  baseline_head: d7cbeb2
  existing_patterns:
    - A001 admits an exact effect-free credential_delete challenge targeted at the current credential identity and signed with the current authorized binding.
    - A004 supplies the credential-targeted account/store block, immutable-version, terminal retry, predecessor restoration, expiry, and restart skeleton.
    - Immutable credential rows reserve identity and origin permanently; a delete transition changes only the current and versioned account readiness projection.
  invariants:
    - prepare rechecks the complete signed before and after account snapshots plus exact active store CAS.
    - before binding is authorized and credential is bound; after binding remains authorized, credential is missing, and state reason is absent.
    - account ID, display ID, credential identity, binding material, endpoints, and cleanup IDs remain exact; account and config generations each advance once.
    - grant target kind is credential and target bytes equal the signed before credential ID; the transition still owns the signed account ID and store.
    - active_locator_sha256 remains only in the immutable signed manifest; authority stores no credential bytes or locator material and performs no keyring deletion.
    - prepare blocks account plus store, changes only the current account generation/receipt projection, inserts no credential or cleanup identity, and records one credential_delete transition.
    - config commit inserts one store version and one account version with the existing permanently reserved credential identity.
    - finalize activates the authorized/missing after projection; abort restores the exact bound predecessor tuple and receipt; unsafe observation remains blocked recovery.
    - every historical credential, account, grant, receipt, transition, and version identity remains immutable.
  forbidden_changes:
    - Authority SQLite schema, application ID, user version, or Cargo graph
    - core canonical transcript bytes, manifest types, or action policy table
    - cleanup challenge/claim/delete, credential-row deletion, account removal/purge, or remote-effect behavior
    - config, runtime, keyring, local I/O, protocol, CLI, MCP, network, or external calls

execution_constraints:
  allowed_files:
    - crates/kirje-store/src/authority.rs
    - crates/kirje-store/tests/authority_registry.rs
    - crates/kirje-store/tests/fixtures/authority/registry/account_credential_cleanup/**
    - .ai-platform/evidence/T202C3/**
    - .ai-platform/specs/007-stable-v1-program/**
    - .ai-platform/specs/008-security-baseline/tasks.md
  write_rules:
    - Add one bounded full-lifecycle credential-delete integration test before production changes.
    - Record the focused RED command and exact unsupported transition rejection.
    - Synthetic public signatures may be committed; private keys, seeds, proofs, nonces, credential bytes, locator material, and real account data may not.
    - Do not mark T202C3 or T110 Accepted in this attempt.
    - Do not broaden into cleanup challenge/claim/delete, keyring work, or another transition kind.
  ownership:
    worktree: /Users/iiwish/self/kirje
    branch: codex/v1-roadmap-governance
    executor: primary Codex agent because the user requested direct serial continuation

tdd_plan:
  red:
    - Build and finalize a synthetic create-set chain whose current credential is authorized and bound.
    - Authorize one exact credential_delete challenge and prove prepare reaches the unsupported transition gate.
    - Assert the failed prepare writes no grant, transition, credential, cleanup, version, event, or clock row.
  green:
    - Reparse the credential mutation and compare its credential target plus complete account transition request.
    - Implement credential-delete prepare, commit, finalize, abort, recovery, replay, expiry, restart, and immutable account/store version behavior.
    - Extend registry history only for the delete transition without deleting the existing credential identity or accepting cleanup execution.
  refactor:
    - Share credential mutation snapshot and existing-credential validation only where set/delete target and lifecycle rules remain explicit.

validation_loop:
  focused_red_green:
    - cargo test -p kirje-store --test authority_registry credential_delete_transition_lifecycle_is_exact --all-features --locked
  changed_crate:
    - cargo test -p kirje-store --test authority_registry --all-features --locked
    - cargo test -p kirje-store --all-features --locked
    - cargo test -p kirje-store --no-default-features --locked
    - cargo clippy -p kirje-store --all-targets --all-features --locked -- -D warnings
    - cargo fmt --all --check
  integrity:
    - git diff --check
    - shasum -a 256 crates/kirje-store/src/authority/schema_v1.sql Cargo.lock
    - python3 /Users/iiwish/.codex/skills/ai-delivery-governor/scripts/validate_delivery_artifacts.py --root /Users/iiwish/self/kirje --feature-id 007-stable-v1-program
  expected_signal:
    - exact delete completes prepared, config_committed, and finalized with account/store active and current credential state missing
    - prepare adds no credential or cleanup identity; config commit adds store and account versions using the existing credential identity
    - exact pre-config abort restores the bound predecessor receipt and tuple
    - unsafe observations enter recovery_required and exact retries remain transition-scoped
    - expiry and valid create-set-delete history restart exactly
    - schema and dependency hashes remain unchanged
  failure_handling:
    - First relevant failure: fix only inside packet-authorized production/test files.
    - Second same-cause contract failure: stop and record the blocker rather than weakening assertions.
    - Never delete credential history, store credential bytes or locator material, invent a cleanup row, or call config/keyring/runtime code.

