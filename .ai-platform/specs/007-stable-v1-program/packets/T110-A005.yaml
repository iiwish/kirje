review_contract:
  pass_1_spec_compliance:
    - exact credential target and signed bound-to-missing account/CAS/active-locator binding
    - existing credential identity retained with one new account version and no cleanup row
    - after state is authorized/missing with no state reason
  pass_2_engineering:
    - transaction atomicity, predecessor receipt restoration, retry identity, event order, successor history, error precedence, and restart corruption checks
    - no credential bytes, locator material, historical-row deletion, keyring API, or external call surface
  pass_3_qa:
    - success, abort, unsafe recovery, expiry, restart, target mismatch, fault, and create-set-delete predecessor paths
  acceptance:
    - no unresolved Critical or High finding
    - every validation command passes
    - attempt commit remains independently reviewable without accepting T202C3 or T110

handoff:
  expected_state_after_execution: T110 Running and T202C3 Running
  evidence_state: T202C3-A005 complete and reviewed; cleanup attempts remain
  commit_policy:
    - commit this packet before production execution
    - commit production after RED/GREEN and changed-crate validation
    - commit evidence and status after review
    - do not push, merge, tag, or publish without a later finish decision
  next_attempt: cleanup challenge and transition packet after explicit A005 acceptance

stop_conditions:
  - A required change touches schema, core, runtime, keyring, local I/O, protocol, CLI, MCP, network, or dependency files.
  - Exact predecessor account state or receipt cannot be recovered from accepted immutable versions and grant history.
  - Credential history would need to be deleted or credential bytes/locator material would need to enter authority storage, output, events, or logs.
  - RED cannot discriminate the unsupported transition gate from fixture or proof failure.
  - A Critical or High review finding cannot be fixed inside the allowed production/test files.
