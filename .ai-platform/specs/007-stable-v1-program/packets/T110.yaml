codebase_context:
  branch: codex/v1-roadmap-governance
  baseline_head: 6983e9b
  existing_patterns:
    - ActionManifest already seals and reparses typed account and credential payloads.
    - create_challenge validates intrinsic shape before pending reuse and fresh registry state before entropy.
    - account-create uses one active store CAS, no active transition, and exact identity occupancy checks.
    - control actions persist no challenge_effects row.
  invariants:
    - account update/remove binds the exact active account ID, display digest, generation, credential, binding, and current store CAS.
    - credential set/delete binds the exact active account plus target credential and current or proposed binding defined by the sealed manifest.
    - fresh issuance requires active store and account, exact current config/account tuple, and no prepared or config-committed store transition.
    - pending-context recovery precedes fresh-state checks and returns the exact unexpired challenge unchanged.
    - unsupported credential_cleanup and all remote effect/claim/invocation behavior remain closed in this attempt.
    - no challenge_effects, grant_uses, account_transitions, credential_cleanup, or remote rows are written.
  forbidden_changes:
    - Authority SQLite schema, application ID, user version, or Cargo graph
    - core canonical transcript bytes, public manifest types, or action policy table
    - account transition execution or cleanup lifecycle APIs
    - remote effect, claim, invocation, observation, owner rotation, recovery, or audit behavior
    - config, runtime, keyring, protocol, CLI, MCP, or network code

