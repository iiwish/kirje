    - Record the focused RED command and exact unsupported or stale result.
    - Do not generate signatures or private key material for challenge-only tests.
    - Do not mark T202C3 or T110 Accepted in this attempt.
    - Do not broaden allowed files without a new packet review.
  ownership:
    worktree: /Users/iiwish/self/kirje
    branch: codex/v1-roadmap-governance
    executor: primary Codex agent because the user asked this task to continue directly

tdd_plan:
  red:
    - Build one finalized synthetic account using accepted T202C2 helpers.
    - Prove exact account_update, account_remove, credential_set, and credential_delete manifests are currently rejected without inserting any row.
    - Prove a stale current account tuple and a busy store fail before entropy and persistence.
  green:
    - Extend the closed issuance allowlist only for the four attempt actions.
    - Add intrinsic and fresh registry comparisons shared by those exact typed payloads.
    - Retain exact pending reuse and zero-effect control behavior.
  refactor:
    - Share current store/account snapshot checks only when it removes real duplication and keeps error precedence explicit.

validation_loop:
  focused_red_green:
    - cargo test -p kirje-store --test authority_registry remaining_account_and_credential_challenges_are_exact --all-features --locked
  changed_crate:
    - cargo test -p kirje-store --test authority_registry --all-features --locked
    - cargo test -p kirje-store --all-features --locked
    - cargo clippy -p kirje-store --all-targets --all-features --locked -- -D warnings
    - cargo fmt --all --check
  integrity:
    - git diff --check
    - shasum -a 256 crates/kirje-store/src/authority/schema_v1.sql Cargo.lock
    - python3 /Users/iiwish/.codex/skills/ai-delivery-governor/scripts/validate_delivery_artifacts.py --root /Users/iiwish/self/kirje --feature-id 007-stable-v1-program
  expected_signal:
    - four exact challenge actions issue and reuse one challenge each with no effect or lifecycle rows
    - stale or busy context consumes no entropy and changes no database row or paired clock
    - all accepted predecessor authority tests remain green
    - schema and dependency hashes remain unchanged
  failure_handling:
    - First relevant failure: fix only within the allowed production/test files.
    - Second same-cause failure: stop and record a scope or contract blocker.
    - Never weaken an assertion, bypass restart validation, or serialize a concurrency test to force green.

evidence_contract:
  attempt_path: .ai-platform/evidence/T202C3/attempts/T202C3-A001.md
  summary_path: .ai-platform/evidence/T202C3/summary.md
  test_results_path: .ai-platform/evidence/T202C3/test-results.md
  required:
    - exact RED and GREEN commands with exit state
    - changed files and hashes
    - four-action and stale/busy matrix
    - row and entropy non-effect checks
    - schema and dependency hash proof
    - spec, engineering, and privacy review
    - explicit residual scope for later T202C3 attempts
  prohibited:
    - credentials, addresses, endpoints, private keys, signatures, proofs, nonces, mailbox content, or real provider data

review_contract:
  pass_1_spec_compliance:
    - action/target/common-context binding follows the authorization contract
    - exact active store/account comparison follows the authority and account contracts
    - transition, cleanup, and remote capability remain absent
  pass_2_engineering:
    - pending reuse order, transaction atomicity, error precedence, row boundedness, and restart behavior
    - no secret, signing, keyring, protocol, network, CLI, or MCP surface
  pass_3_qa:
    - four action success paths plus stale and busy negatives
    - accepted account-create and enrollment regressions
  acceptance:
    - no unresolved Critical or High finding
    - all validation commands pass
    - attempt commit is reviewable but does not by itself accept T202C3 or T110

handoff:
  expected_state_after_execution: T110 Running and T202C3 Running
  commit_policy:
    - commit the packet before production execution
    - commit production tests after RED/GREEN and changed-crate validation
    - commit evidence and status after review
    - do not push, merge, tag, or publish without a later finish decision
  next_attempt: T202C3 transition execution after A001 review

stop_conditions:
  - A required change touches schema, core transcript bytes, runtime, keyring, protocol, CLI, MCP, or network code.
  - Exact current registry comparison cannot be derived from the sealed manifest and accepted T202C2 rows.
  - RED cannot discriminate the missing challenge capability from fixture or signature failure.
  - Real credential, account, mailbox, authority, endpoint, or provider data would be required.
  - A Critical or High review finding cannot be fixed inside the allowed production/test files.
