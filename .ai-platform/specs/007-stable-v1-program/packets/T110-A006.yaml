stop_conditions:
  - H-A006-001 remains unresolved or its resolution would change confirmed security semantics without user approval.
  - A required change touches schema, core transcripts, cleanup claim/delete, grant use, runtime, keyring, config, local I/O, protocol, CLI, MCP, network, or dependency files.
  - Private locator material would enter a public projection, output, event, fixture, evidence, Debug, serialization, clone, or byte-export surface.
  - RED cannot distinguish unsupported cleanup issuance from fixture, proof, or predecessor-history failure.
  - A Critical or High finding cannot be fixed inside the amended allowed production/test files.
