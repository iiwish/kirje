      - event 16 source runtime, related grant, use_sha256 context, same receipt/time, adjacent after event 7
      - exact claimed recovery changes only the paired authority clock after lock reacquisition
  T202C3_A008:
    status: non_executable
    owns:
      - concrete low-level keyring delete function returning `Result<(), MailError>` and the sole production call in the combined store method
      - combined consuming delete boundary with no caller mark_deleted; authority open/read/validation paths make zero keyring calls
      - deleted/no-entry Ok(()) indistinguishability, backend-failure claimed state, crash recovery, and terminal no-recall retry
      - exact private module credential_cleanup_delete_adapter and combined method AuthorityStore::apply_credential_cleanup_delete; only this method may mention DeleteOnlyLocator or call kirje_credential::delete_only exactly once
      - dedicated AST test parsing every kirje-store production Rust file and rejecting low-level imports, aliases, wildcards, re-exports, macro/function-pointer/indirect bindings, constructor/type/API references, and calls outside the exact adapter method
      - Cargo metadata/tree direct-dependency allowlist, runtime compile-fail no-dependency fixture, and store no-re-export check
      - if necessary, one scoped kirje-store test-only Rust parser dev dependency plus its reviewed Cargo.lock change and proof it is absent from the production dependency tree
      - event 17 source runtime, same grant/use/receipt, exactly once after event 16
  integration_owner: >-
    T204 owns migration/removal of legacy runtime SecretStore paths, runtime/CLI
    wiring only to the high-level store cleanup API, and end-to-end integration.
    Runtime must not directly depend on, import, receive, or re-export
    kirje-credential or locator material.

