work_unit:
  title: Issue an exact effect-free credential-cleanup challenge
  attempt: T202C3-A006-F008
  parent: T110 Complete Authority Lifecycles
  security_task: T202C3 Account Credential And Cleanup Lifecycles
  goal: >-
    Harden CredentialCleanupReservation construction and account-transition
    prepare so only the canonical private locator transcript for the signed
    realm and historical-before origin can be inserted, then implement exact
    effect-free credential_cleanup challenge issuance, replacement, concurrency,
    restart, and pending reuse from one transition-bound ready tombstone. Add no
    transition state-machine change, grant use, claim, delete permit, deletion backend,
    keyring, runtime, or external-effect capability.
