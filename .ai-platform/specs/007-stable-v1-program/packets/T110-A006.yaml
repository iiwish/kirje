    - The eventual executor is one bounded worker and may not delegate or edit outside the amended packet.
    - Synthetic public signatures may be committed; private keys, seeds, proofs, nonces, credentials, locator material, and real account/provider data may not.
    - Do not mark T202C3, T110, or A006 Accepted; a passed unattended attempt may be only review_complete.
  ownership:
