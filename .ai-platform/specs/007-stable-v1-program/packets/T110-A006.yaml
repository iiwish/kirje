  integration_required:
    - status review_complete and exact P11/A11/C11 references
    - real RED nonzero and GREEN zero for the exact focused command
    - every focused and complete command with exit code and bounded result
    - exact candidate scope/mode/unchanged-file command summaries
    - cargo deny recorded only as known_t111_blocker
    - three implementation review paths and sanitized evidence

review_contract:
  blocking_dimensions: [product_security, F006_contract, exact_scope, definition_of_done, validation_sufficiency]
  packet_pass_rule:
    - Critical or High findings in a blocking dimension block dispatch.
    - Medium findings in a blocking dimension block dispatch.
    - Local-admin tamper resistance, governance format preference, and other non-product governance hardening are out of scope and receive explicit nonblocking disposition.
    - All three packet reviewers must pass before the orchestrator records A11 and dispatches one worker.
  implementation_pass_rule:
    - The same substantive blocking dimensions apply and all reviews bind the same C11.
  acceptance_rule:
    - review_complete requires real TDD, all complete gates, exact scope evidence, sanitized evidence, and three passing implementation reviews.
    - Delegated acceptance never claims user personal review of unseen work.

handoff:
  current_state: F011 packet preparation only; all production, test, and fixture permissions are closed
  next_state: three independent reviews bind P11, then the orchestrator may create A11 and dispatch one worker under delegated authority
  after_authorization: one exact-scope C11 candidate, three implementation reviews, then I11 review_complete or a new named fix attempt
  later_tasks: A007/A008 remain non-executable and T202C3/T110 remain unaccepted
  commit_policy:
    - local commits only; ordinary branch history remains linear where practical
    - no push, merge, tag, publish, GitHub Release, live provider, mailbox, credential, or external destructive operation

stop_conditions:
  - Any unresolved finding in a substantive blocking dimension.
  - Production work requested before A11 is recorded after three packet-review passes.
  - Schema, dependency, core transcript/type, runtime, keyring, protocol, CLI, MCP, network, or external-effect change is required.
  - Unexpected Git environment/repository state, dirty/conflicting worktree, or repository identity mismatch.
  - Any locator material, secret, credential, private origin value, or real provider data would enter committed evidence.
