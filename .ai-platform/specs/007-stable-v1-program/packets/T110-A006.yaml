codebase_context:
  branch: codex/v1-roadmap-governance
  baseline_head: 982ec1d18639ad52c8058deba1dc69df57b1161b
  returned_candidate: 2241a946c399ba9c61e67e808a85f777c0d2b402
  implementation_rule: >-
    Existing storage and parsing mechanics do not override the F006 security
    contract. Delivery governance evidence is review and traceability material,
    not a product security credential, lock service, or defense against a local
    repository administrator who can rewrite commits or refs.
  trusted_local_execution_boundary:
    trusted: [current user and Delivery Orchestrator, Git binary, repository identity]
    assumptions:
      - no malicious GIT_DIR or other unexpected GIT_* environment override
      - no replace refs, grafts, shallow history, ref deletion, or commit rewrite
      - no dirty or conflicting worktree at dispatch, candidate, review, or integration checks
    operational_stop: >-
      Unexpected Git environment, replace/graft/shallow state, dirty/conflicting
      worktree, or repository identity mismatch stops the operation for human
      inspection. Governance does not claim resistance to an administrator who
      can rewrite the local repository.
    product_security_basis: >-
      Kirje product security depends on the F006 substantive contract,
      implementation, discriminating tests, complete validation, and independent
      review, never on a governance token, ref, or script.

contract_snapshot:
  unchanged_owner: T202C3-A006
  challenge_phase_order:
    - pure manifest preflight, including transition_id presence
    - apply lock and transaction
    - request-independent global integrity validation
    - checked effective time without request-directed pending access
    - closed public store/account pair classification
    - private cleanup/origin/locator/tombstone validation
    - request-directed pending lookup and exact reuse or expired replacement
    - successor creation and commit
  public_pair_precedence:
    - absent store, absent account, or pair mismatch returns credential_cleanup_invalid
    - matched recovery store returns owner_recovery_required
    - matched blocked store or blocked/proposed account returns account_update_conflict
    - unrelated matched blocked and unrelated matched recovery pairs return those same public projections without target distinction
    - active store plus active or removed account proceeds to private validation
    - finalized-origin account persisted as proposed is step-2 owner_recovery_required corruption
  private_invalid_cells:
    - wrong origin
    - wrong locator kind
    - wrong locator digest
    - wrong tombstone
    - wrong lifecycle
    - missing or duplicate descriptor
  locator_contract:
    domain: KIRJE-DELETE-ONLY-LOCATOR-V1 followed by NUL
    fields: [locator_kind u8, service canonical UTF-8, username canonical UTF-8]
    active_v2: exact v2 service and lowercase digest username from immutable historical origin
    legacy_v1: exact legacy service and validated historical display ID from origin-before
    digest: SHA-256 of the complete canonical transcript
  tombstone_contract:
    domain: KIRJE-CREDENTIAL-CLEANUP-TOMBSTONE-V1 followed by NUL
    source: immutable finalized origin transition, manifest, before snapshot, historical account/credential/binding, locator digest, and prepared_at
    exclusions: [raw locator, mutable lifecycle, claim state, deleted state]
  replacement_contract:
    - blocked/recovery public classification performs no request-directed pending lookup or interaction
    - active eligible OldChallengeExpiredState and OldChallengeExpiredEvent fault hooks roll back all tentative predecessor, event, clock, successor, entropy, and cleanup work
    - different-context invalid target has zero predecessor interaction
    - persisted target corruption is step-2 owner_recovery_required
  effect_contract:
    - first issuance, reuse, response loss, replacement, faults, restart, concurrent winner, and every loser have zero external calls
    - each path proves zero delta in challenge_effects, remote_effects, effect_claims, effect_invocations, effect_observations, and grant_uses as applicable
    - exact pending reuse and concurrent losers may advance only the paired authority clock high-water
  privacy_contract:
    - real or private locator material is prohibited in every committed file
    - synthetic non-real locator bytes may occur only in authority_registry.rs
    - evidence contains only synthetic vector IDs, digests, counts, and results

execution_constraints:
  production_permission: none_pending_f012_authorization_dispatch
  test_permission: none_pending_f012_authorization_dispatch
  fixture_permission: none_pending_f012_authorization_dispatch
