    - cleanup claim/delete, permit, janitor, runtime, config, keyring, protocol, CLI, MCP, network, or remote-effect behavior
    - transition, account, credential, or cleanup semantics outside challenge issuance
  write_rules:
    - No production or test edit may begin until independent packet review changes both permissions.
    - After review, write a discriminating focused RED before production changes.
    - A worker edits only future_allowed_files and does not delegate.
    - Synthetic public signatures may be committed; private keys, seeds, proofs, nonces, locator material, and real account data may not.
    - Do not mark A007, A008, T202C3, or T110 Ready or Accepted from this packet.

tdd_plan:
  red:
    - Prove the first exact ready cleanup challenge reaches the unsupported action gate with zero rows/events/clock/entropy beyond the pre-existing origin graph.
    - Add canonical locator and tombstone byte/digest goldens and every one-field mutation negative.
    - Add active/removal history, later update/remove/recreation, blocked/recovery, NULL-transition, wrong-origin, duplicate-descriptor, state, restart, corruption, and privacy negatives.
  green:
    - Parse and rederive the private locator and tombstone from immutable origin history with bounded streaming validation.
    - Admit only exact ready challenge issuance and pending reuse with zero authorization effect.
    - Extend restart validation for the A006 challenge graph without admitting claim/delete rows or events 16/17.
  refactor:
    - Share canonical TLV helpers only when the private locator/tombstone bounds and action-specific validation stay explicit.

