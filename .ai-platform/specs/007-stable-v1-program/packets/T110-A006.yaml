review_contract:
  pass_1_spec_compliance:
    - exact transcripts, historical-before origin, transition-bound legacy, ready eligibility, and no core/schema change
  pass_2_engineering:
    - strict bounds, streaming restart derivation, error precedence, pending reuse, zero-effect transaction, and privacy/capability closure
  pass_3_qa:
    - golden/mutation, active/removed/later-history, blocked/recovery, NULL transition, corruption, restart, response loss, and zero-external-call coverage
  packet_pass_condition:
    - no unresolved Critical, High, or Medium finding
    - independent reviewer explicitly authorizes production and test execution in a governance follow-up
  production_acceptance:
    - TDD, every validation command, sanitized evidence, and all three reviews pass
    - orchestrator may then record delegated acceptance without claiming user personal review

handoff:
  current_state: contract approved; packet ready_for_review; production and test permission none
  after_packet_review: A006 Ready only if an independent review explicitly changes both permissions
  after_execution: A006 review_complete or delegated Accepted from evidence; A007 may then be packetized just in time
  commit_policy:
    - local commits only
    - no push, merge, tag, publish, GitHub Release, live provider, mailbox, credential, or external destructive operation

stop_conditions:
  - Independent packet review finds any unresolved Critical, High, or Medium issue.
  - Production or test work is requested while permission remains none.
  - A required change touches schema, core transcripts/types, dependencies, runtime, keyring, protocol, CLI, MCP, network, or external calls.
  - Locator material or private origin values would enter output, events, logs, fixtures, evidence, Debug, serialization, cloning, or byte export.
  - A second same-cause contract or validation failure occurs.
