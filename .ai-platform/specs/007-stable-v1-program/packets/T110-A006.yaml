    branch: codex/v1-roadmap-governance
    executor: unassigned while packet is blocked

tdd_plan:
  red_after_contract_resolution:
    - Finalize one synthetic account-update or account-remove history with exactly one Ready cleanup tombstone.
    - Submit its exact credential_cleanup manifest and prove challenge creation reaches the unsupported registry-action gate.
    - Assert zero entropy, cleanup, grant-use, effect, transition, or unrelated event writes on rejection.
  green_after_contract_resolution:
    - Rederive the confirmed tombstone digest and compare every signed cleanup field with the immutable row and transition/account/store origin.
    - Admit the exact Ready challenge with pending reuse, expiry, response-loss, and restart behavior.
    - Reject every wrong state/context/digest/transition combination before entropy or persistence.
  refactor:
    - Reuse challenge and registry-context helpers only where cleanup-specific tombstone and privacy checks remain explicit.

validation_loop:
  focused_red_green:
    - cargo test -p kirje-store --test authority_registry credential_cleanup_challenge_is_exact --all-features --locked
  changed_crate:
    - cargo test -p kirje-store --test authority_registry --all-features --locked
    - cargo test -p kirje-store --all-features --locked
    - cargo test -p kirje-store --no-default-features --locked
    - cargo clippy -p kirje-store --all-targets --all-features --locked -- -D warnings
    - cargo fmt --all --check
  integrity:
    - git diff --check
    - shasum -a 256 crates/kirje-store/src/authority/schema_v1.sql Cargo.lock
    - python3 /Users/iiwish/.codex/skills/ai-delivery-governor/scripts/validate_delivery_artifacts.py --root /Users/iiwish/self/kirje --feature-id 007-stable-v1-program
  expected_signal:
    - exact Ready cleanup challenge, pending reuse, expiry, restart, corruption, and privacy matrices pass
    - cleanup row, grant-use count, schema, dependencies, and account/transition state remain unchanged by challenge issuance
    - no keyring, runtime, network, claim/delete, schema, dependency, or core transcript change
  failure_handling:
    - Any execution before H-A006-001 is resolved is a packet violation.
    - First relevant implementation failure is fixed only inside amended packet scope.
    - Second same-cause failure stops the attempt and records the blocker.

