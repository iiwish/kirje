contract_snapshot:
  locator:
    domain: KIRJE-DELETE-ONLY-LOCATOR-V1 followed by NUL
    fields:
      - 0x0001 locator_kind u8
      - 0x0002 service UTF-8, 1..128 bytes and characters
      - 0x0003 username UTF-8, 1..1024 bytes and characters
    total_bound: 1..4096 bytes
    active_v2: exact v2 service and lowercase digest username from realm/store/account/historical credential/historical binding
    legacy_v1: exact legacy service plus origin-before historical display ID
    digest: SHA-256 of the complete canonical transcript
  tombstone:
    domain: KIRJE-CREDENTIAL-CLEANUP-TOMBSTONE-V1 followed by NUL
    ordered_fields:
      - 0x0001 realm_id BLOB32
      - 0x0002 cleanup_id UUID16
      - 0x0003 transition_id UUID16
      - 0x0004 transition_sha256 BLOB32
      - 0x0005 origin_manifest_sha256 BLOB32
      - 0x0006 store_id UUID16
      - 0x0007 account_id UUID16
      - 0x0008 historical_account_generation u64be
      - 0x0009 historical_credential_id UUID16
      - 0x000a historical_binding_sha256 BLOB32
      - 0x000b locator_kind u8
      - 0x000c locator_sha256 BLOB32
      - 0x000d created_at i64be
      - 0x000e origin_expected_state u8, exact 0x01 provisional
    exclusions:
      - raw locator material
      - mutable cleanup state, claim grant, and deleted time
    derivation: >-
      Rederive from realm meta, cleanup row, finalized origin transition and
      transition digest, origin grant/challenge manifest and its exactly-one
      provisional descriptor, plus the immutable origin-before account/version.
  eligibility:
    - Cleanup manifest transition_id is present and equals the row/origin transition; None is authorization_malformed from pure preflight.
    - Persisted NULL transition is owner_recovery_required corruption; schema and core transcript bytes do not change.
    - Origin is finalized account_update or account_remove and created_at equals prepared_at.
    - Store is active and historical account registry projection is active or removed.
    - Blocked store/account returns account_update_conflict; recovery store returns owner_recovery_required.
    - Manifest expected state is ready and common binding is origin-before historical binding.
    - Later account update/remove/recreation does not rebind the origin.
    - >-
      Closed precedence step 2 remains authoritative for persisted schema,
      anchor, history, transcript, or event corruption, including a persisted
      NULL transition, and returns owner_recovery_required without a private
      target distinction.
    - >-
      ActionManifest is caller-supplied and unproved at challenge creation.
      Common store/account IDs are untrusted typed request values, not a signed
      subject. Complete global step-2 validation is request-independent and may
      already stream every private cleanup/origin/locator/tombstone graph. After
      the request-independent global validation pass, no request-directed pending/
      private lookup or request-dependent private branch may occur before the closed
      public pair classification.
    - >-
      For an existing matched pair, recovery_required store returns
      owner_recovery_required; blocked store or blocked account returns
      account_update_conflict before private target validity. A finalized-origin
      account persisted as proposed is step-2 corruption; an unrelated matched
      proposed pair returns account_update_conflict. Active store plus active or
      removed account alone proceeds to private step-7 validation.
  reservation_prepare:
    - A pure authority.rs cleanup-manifest preflight runs before apply lock, file, database, or entropy work and rejects transition_id=None as authorization_malformed with zero I/O, mutation, or entropy; no core change is allowed.
    - CredentialCleanupReservation::new parses one complete bounded canonical locator transcript, checks caller kind, and derives its digest.
    - Before row insertion, prepare rederives exact kind/service/username/digest from authority realm and signed historical-before origin.
    - Malformed constructor input is invalid_input; canonical wrong-origin prepare is authorization_context_stale with zero mutation.
    - No prepare, commit, finalize, abort, recovery, account, store, event, or clock state-machine rule changes.
  challenge:
    - Issuance and exact pending reuse create zero grant uses, cleanup mutations, effects, invocations, keyring calls, or external calls.
    - Exact pending reuse consumes no entropy, returns the same challenge, appends no event, changes no lifecycle/event timestamp, and may advance only the paired authority clock.
    - Valid expired-pending replacement records one predecessor event 5 before one successor event 3 and creates exactly one fresh grant UUID and nonce.
    - Same-context expired pending plus later matched blocked/recovery returns the public result with zero pending-row lookup-dependent interaction; predecessor state/event and both clocks remain unchanged, with zero entropy/successor/grant/nonce/cleanup.
    - Active eligible pair plus valid target uses OldChallengeExpiredState and OldChallengeExpiredEvent faults to prove complete transaction rollback and zero entropy/successor/cleanup; a different-context invalid target has zero predecessor interaction and persisted corruption is precedence-step-2 owner_recovery_required.
    - Public projection, errors, logs, events, fixtures, and evidence omit locator material and private fields.
    - Cleanup challenge issuance strictly orders pure request/manifest preflight, lock/transaction, request-independent global validation, checked effective time/time shape without pending access, closed public-pair classification, private target validation, pending lookup, exact reuse or expired replacement, and successor creation/commit. No pending/private request-directed lookup precedes public classification and no pending expiry is durable before eligibility; ordinary claim/delete proof-expiry order remains unchanged.

f005_contract:
  manifest_preflight:
    - >-
      authority.rs performs one pure cleanup-manifest preflight before apply
      lock, file access, database access, or entropy. CredentialCleanup with
      transition_id=None returns AuthorizationMalformed with zero I/O, mutation,
      or entropy. The core type and transcript remain unchanged.
  public_projection_precedence:
    - >-
      Run complete global schema, anchor, history, transcript, and event
      validation as one request-independent pass. It may already stream every
      private cleanup, origin, locator, and tombstone graph. Persisted corruption
      remains precedence step 2 and returns owner_recovery_required.
    - >-
      Treat common store/account IDs only as bounded untrusted typed request
      data. After the request-independent global validation pass, no request-
      directed pending/private lookup or request-dependent private branch may occur
      before the closed public pair classification. Call-order and source proof
      must establish this boundary.
    - >-
      The complete public-pair matrix is: absent store, absent account, and pair
      mismatch return credential_cleanup_invalid; matched recovery store returns
      owner_recovery_required; matched blocked store or blocked account returns
      account_update_conflict; an unrelated matched proposed pair returns
      account_update_conflict; an unrelated matched blocked/recovery pair returns
      that same public result. Each reachable public row is
      crossed independently with wrong origin, locator kind, locator digest,
      tombstone, lifecycle, and descriptor without request-directed pending/
      private lookup or private distinction. Active store plus active account and
      active store plus removed account proceed; each crossed private-invalid
      cell then returns credential_cleanup_invalid.
    - >-
      The same-context reachable later-state matrix is active/removed origin
      account, blocked account/store, or recovery-required store only. Persisting that same origin account as
      proposed is global step-2 corruption and owner_recovery_required. Proposed
      is a public projection cell only for an unrelated but matched pair.
    - >-
      The first RED enumerates every public row above and independently crosses
      all six private-invalid cells, without collapsing them into a generic
      sample. Every pre-private case proves no pending-row lookup-dependent
      interaction, target-validity distinction, durable mutation, or entropy.
  locator_and_legacy:
    - >-
      Every legacy negative invokes the legacy_v1 caller kind, so a rejection
      cannot pass by accidentally selecting active_v2. The matrix covers the
      domain, exact kind, exact services, lowercase username shape, digest,
      unrecognized/duplicate/out-of-order tags, trailing bytes, declared-length
      mismatch, malformed or noncanonical UTF-8, and embedded NUL.
    - >-
      Generic service, username, and total-length gates use one private numeric
      length-classification helper in authority.rs. Its #[cfg(test)] unit tests
      pass numeric lengths and expected classes only: service byte/character
      0, 1, 128, 129; username byte/character 0, 1, 1024, 1025; and total 0, 1,
      4096, 4097 plus the greatest constructible canonical total. No public/
      test-support API is added and no locator transcript/test-vector bytes are
      added to authority.rs. Closed-form byte tests remain only in
      authority_registry.rs.
    - >-
      One transition-bound legacy_v1 flow succeeds through reservation,
      prepare, finalize, and exact cleanup challenge issuance from the
      historical origin-before display ID.
    - >-
      authority_registry.rs retains canonical locator and exact 14-tag tombstone
      byte/digest goldens, every one-field closed-form mutation, malformed
      active_v2/legacy_v1 constructor cases, and canonical wrong-origin prepare
      with zero durable mutation and entropy.
  replacement_reuse_and_races:
    - >-
      A same-context expired pending row followed by a later matched blocked or
      recovery public state returns the public result before any request-directed
      pending/private lookup. There is zero pending-row lookup-dependent
      interaction: predecessor state/event and both clock fields remain exactly
      unchanged, and entropy/successor/grant/nonce/cleanup deltas are zero.
    - >-
      For an active eligible public pair and valid private target, deterministic
      fault injection after OldChallengeExpiredState and after
      OldChallengeExpiredEvent proves rollback of the entire transaction,
      including predecessor lifecycle/event/clock work, with zero entropy,
      successor, grant, nonce, or cleanup delta. Different-context invalid target
      has zero predecessor interaction; persisted target/history corruption
      remains request-independent precedence step 2 owner_recovery_required.
    - >-
      The full cleanup challenge issuance sequence is pure request/manifest
      preflight including transition presence; apply-lock/transaction acquisition;
      complete request-independent step-2 validation; checked effective time and
      time shape without pending access; public pair classification; private
      cleanup/origin/locator/tombstone validation; pending lookup; exact reuse or
      expired replacement; and successor creation/commit. Pending expiry cannot
      become durable before public eligibility. Ordinary cleanup claim/delete
      proof-expiry ordering remains separate and unchanged.
    - >-
      Valid expired replacement proves fresh grant and nonce, exactly one
      predecessor event 5 followed by exactly one successor event 3, unchanged
      cleanup, and no grant use or effect row.
    - >-
      Exact pending reuse, restart reuse, and every concurrent loser compare
      the complete immutable challenge projection byte-for-byte, consume no
      entropy, append no event, change no lifecycle/event timestamp, and may
      change only authority_meta.last_observed_at and authority_meta.updated_at
      as the paired clock high-water. Exactly one concurrent winner owns the
      new grant, nonce, and event.
    - >-
      Cleanup-specific response loss replays the exact committed request after
      reopen and returns the same immutable challenge with the same clock-only
      allowance and no second lifecycle interval.
  history_and_restart:
    - >-
      Finalized later account update, finalized later account remove, and
      same-display account recreation each prove that historical origin-before
      account, generation, credential, binding, and legacy display ownership do
      not rebind.
    - >-
      Reopen must fail owner_recovery_required for duplicate or missing cleanup
      descriptor, nonfinal or wrong-kind origin, historical account/generation/
      credential/binding tuple drift, created_at/prepared_at drift, and
      impossible ready-state transition, digest, claim, or deleted fields.
  effects_and_privacy:
    - >-
      First issuance, exact reuse, response-loss replay, valid expired
      replacement, both OldChallengeExpiredState and OldChallengeExpiredEvent
      failures, restart reuse, the concurrent winner, and every concurrent loser
      each prove zero row delta in challenge_effects, remote_effects,
      effect_claims, effect_invocations, effect_observations, and grant_uses,
      plus zero external calls and unchanged cleanup. Grant-use assertions are
      prestate-to-poststate deltas because immutable origin-transition grant uses
      may already exist; they never assert an absolute empty table.
    - >-
      Static/source inspection proves A006 adds no keyring, credential backend,
      delete permit, delete-only call, runtime, network, or other external
      capability. Errors, events, fixtures, diagnostics, Debug/serialization,
      evidence, and public projections are scanned for locator service,
      username, transcript bytes, origin private fields, credentials, and raw
      target material.

