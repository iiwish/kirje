    - cleanup claim/delete, permit, deletion backend, runtime, config, keyring, protocol, CLI, MCP, network, or remote-effect behavior
    - transition state-machine behavior outside locator input hardening before cleanup insertion
  write_rules:
    - No production, test, or fixture edit begins from P12.
    - After three substantive packet-review passes, the orchestrator may create one A12 authorization/dispatch record under delegated authority without another user checkpoint.
    - A12 dispatches one worker for attempt T202C3-A006-F012-IMPLEMENTATION and the worker edits only future_allowed_files.
    - A failed candidate or blocking implementation review ends that dispatch; create a new named implementation-fix attempt and record rather than reusing A12.
    - Evidence and authorization records remain orchestrator-owned; A007/A008, T202C3, and T110 remain closed.

tdd_plan:
  ordering: >-
    After A12 dispatch, add discriminating tests first. Run the exact focused
    command at RED and again at GREEN. RED must be nonzero because a newly added
    test exposes the defect; GREEN must be zero after the minimum production fix.
  focused_red_command: cargo test -p kirje-store --test authority_registry credential_cleanup_challenge_is_exact --all-features --locked
  focused_green_command: cargo test -p kirje-store --test authority_registry credential_cleanup_challenge_is_exact --all-features --locked
  red_obligations:
    - transition_id absence returns authorization_malformed before lock, file, database, entropy, or mutation
    - independently cross every public-pair row with all six private-invalid cells and prove exact closed precedence plus zero mutation/entropy
    - prove complete phase order, legacy/bounds/mutation matrices, blocked/recovery zero-pending interaction, and active-pair fault rollback
    - prove immutable projection, clock-only reuse/losers, response loss, concurrency, replacement, restart, entropy, and event cardinality
    - prove later update/remove/recreation does not rebind and every descriptor/origin/tuple/timestamp/ready-state corruption fails closed
    - prove six effect-table deltas, zero external calls, zero keyring capability, and privacy invariants
  green_obligations:
    - canonical locator reservation and historical-before rederivation precede cleanup insertion
    - tombstone rederivation uses immutable origin history and bounded validation
    - only exact ready issuance and exact pending reuse succeed without authorization effects
    - restart validation covers the A006 challenge graph without claim/delete rows or events 16/17

validation_loop:
  focused:
    - cargo test -p kirje-store --test authority_registry credential_cleanup_challenge_is_exact --all-features --locked
  complete:
    - cargo test -p kirje-store --test authority_registry --all-features --locked
    - cargo test -p kirje-store --all-features --locked
    - cargo test -p kirje-store --no-default-features --locked
    - cargo test -p kirje-core --all-features --locked
    - cargo test --workspace --all-features --locked
    - cargo clippy -p kirje-store --all-targets --all-features --locked -- -D warnings
    - cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
    - cargo fmt --all --check
    - cargo build --workspace --all-features --locked
  known_baseline_blocker:
    - cargo deny remains the T111-owned yanked chacha20/io-imap baseline blocker and is not reported as passing
  phase_scope_checks:
    oid_rule: Replace every symbolic P12, A12, C12, and I12 identifier with its actual 40-hex commit ID, and every symbolic path list with its declared exact paths, before execution and evidence recording.
    clean:
      - git -c status.showUntrackedFiles=all status --porcelain=v2 --untracked-files=all
    ancestry:
      - git rev-parse A12^ equals P12
      - git rev-parse C12^ equals A12
      - git rev-parse I12^ equals C12
    packet_to_authorization:
      commands:
        - git diff --name-status --no-renames P12 A12
        - git diff --raw --no-renames P12 A12
        - git diff --quiet P12 A12 -- crates Cargo.toml Cargo.lock
      expected: exactly four A paths from evidence_contract.packet_review_paths plus authorization_path; raw modes 000000 to 100644; no existing or product file changes
    authorization_to_candidate:
      commands:
        - git diff --name-status --no-renames A12 C12
        - git diff --raw --no-renames A12 C12
        - git diff --check A12 C12
        - git diff --quiet A12 C12 -- Cargo.toml Cargo.lock crates/kirje-store/Cargo.toml crates/kirje-store/src/authority/schema_v1.sql .ai-platform
      expected: exactly M authority.rs and M authority_registry.rs with old/new 100644, plus optional cleanup fixtures that are M old/new 100644 or A 000000-to-100644; nonempty; no D, R, C, T, or other path
    candidate_to_integration:
      commands:
        - git diff --name-status --no-renames C12 I12
        - git diff --raw --no-renames C12 I12
        - git diff --quiet C12 I12 -- crates Cargo.toml Cargo.lock
      expected: exactly four A paths from evidence_contract.implementation_review_paths plus integration_path; raw modes 000000 to 100644; no existing or product file changes
    cumulative:
      commands:
        - git diff --name-status --no-renames P12 I12
        - git diff --raw --no-renames P12 I12
      expected: exact union of the four A12 evidence paths, allowed A12-to-C12 product paths, and four I12 evidence paths; no other status, path, or mode
    blob_modes:
      - git ls-tree A12 -- A12_EVIDENCE_PATHS
      - git ls-tree C12 -- C12_CHANGED_PATHS
      - git ls-tree I12 -- I12_EVIDENCE_PATHS
      - every listed object is exactly mode 100644 and type blob
    artifact_validation:
      - python3 /Users/iiwish/.codex/skills/ai-delivery-governor/scripts/validate_delivery_artifacts.py --root /Users/iiwish/self/kirje --feature-id 007-stable-v1-program
      - python3 /Users/iiwish/.codex/skills/ai-delivery-governor/scripts/validate_delivery_artifacts.py --root /Users/iiwish/self/kirje --feature-id 008-security-baseline
      - git diff --check
    stop_rule: Any unexpected staged/path/status/mode/delete/rename/copy/typechange or failed command stops the phase before proceeding.
  evidence_rule: record every command after real 40-hex substitution, exit code, result, and bounded sanitized summary; record cargo deny only as the known T111 blocker

procedural_trace:
  model: trusted_local_linear_delivery_record
  preparation_P12:
    - P12 is this immutable reviewed packet commit with permissions closed.
    - Three independent packet reviews bind the exact P12 commit and tree.
  authorization_dispatch_A12:
    - A12 is P12's direct child and its diff adds exactly the three packet-review YAML files plus authorization YAML, all regular 100644; it changes nothing else.
    - A12 is a standalone record of delegated authorization and one-worker dispatch, not a security capability, and does not expand P12 scope.
  candidate_C12:
    - C12 is A12's direct child and the single dispatched worker candidate.
    - Its nonempty diff is exactly M authority.rs, M authority_registry.rs, and optional A or M cleanup fixture files, all regular 100644, with no governance, Cargo, dependency, or schema change.
  integration_I12:
    - I12 is C12's direct child and its diff adds exactly three implementation-review YAML files plus integration YAML, all regular 100644; it changes nothing else.
    - Three independent implementation reviews bind the same C12 commit and tree; I12 records TDD, every validation, scope evidence, review paths, and review_complete.
    - The cumulative P12-to-I12 path set is exactly A12 evidence, C12 allowed product paths, and I12 evidence.
  limitations:
    - Linear local history is an operating convention, not a cryptographic or malicious-admin replay defense.
    - Historical validators, tokens, refs, and self-tests are inert evidence and have no product-security meaning.

