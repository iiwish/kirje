    - crates/kirje-store/tests/authority_registry.rs
    - crates/kirje-store/tests/fixtures/authority/registry/account_credential_cleanup/**
  forbidden_changes:
    - authority schema, application ID, user version, Cargo graph, or core transcript bytes/types
    - cleanup claim/delete, permit, janitor, runtime, config, keyring, protocol, CLI, MCP, network, or remote-effect behavior
    - transition state-machine behavior outside locator input hardening before cleanup insertion
  write_rules:
    - No production or test edit may begin until independent packet review changes both permissions.
    - After review, write a discriminating focused RED before production changes.
    - A worker edits only future_allowed_files and does not delegate.
    - A worker writes only production/test/fixture paths above; evidence, SSOT, packet, and status files remain orchestrator-owned.
    - Deterministic synthetic non-real locator transcript bytes may appear only in authority_registry.rs for canonical byte goldens.
    - Signature fixtures may contain deterministic synthetic public signatures only and never locator transcripts; evidence/output/logs contain only vector IDs, digests, counts, and pass/fail results.
    - Real/private locator bytes remain prohibited in every committed file; private keys, seeds, real proofs/nonces, credentials, and real account data are also prohibited.
    - Do not mark A007, A008, T202C3, or T110 Ready or Accepted from this packet.

