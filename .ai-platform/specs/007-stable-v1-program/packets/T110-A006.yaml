contract_snapshot:
  locator:
    domain: KIRJE-DELETE-ONLY-LOCATOR-V1 followed by NUL
    fields:
      - 0x0001 locator_kind u8
      - 0x0002 service UTF-8, 1..128 bytes and characters
      - 0x0003 username UTF-8, 1..1024 bytes and characters
    total_bound: 1..4096 bytes
    active_v2: exact v2 service and lowercase digest username from realm/store/account/historical credential/historical binding
    legacy_v1: exact legacy service plus origin-before historical display ID
    digest: SHA-256 of the complete canonical transcript
  tombstone:
    domain: KIRJE-CREDENTIAL-CLEANUP-TOMBSTONE-V1 followed by NUL
    ordered_fields:
      - 0x0001 realm_id BLOB32
      - 0x0002 cleanup_id UUID16
      - 0x0003 transition_id UUID16
      - 0x0004 transition_sha256 BLOB32
      - 0x0005 origin_manifest_sha256 BLOB32
      - 0x0006 store_id UUID16
      - 0x0007 account_id UUID16
      - 0x0008 historical_account_generation u64be
      - 0x0009 historical_credential_id UUID16
      - 0x000a historical_binding_sha256 BLOB32
      - 0x000b locator_kind u8
      - 0x000c locator_sha256 BLOB32
      - 0x000d created_at i64be
      - 0x000e origin_expected_state u8, exact 0x01 provisional
    exclusions:
      - raw locator material
      - mutable cleanup state, claim grant, and deleted time
    derivation: >-
      Rederive from realm meta, cleanup row, finalized origin transition and
      transition digest, origin grant/challenge manifest and its exactly-one
      provisional descriptor, plus the immutable origin-before account/version.
  eligibility:
    - Cleanup manifest transition_id is present and equals the row/origin transition; None is rejected.
    - Persisted NULL transition is owner_recovery_required corruption; schema and core transcript bytes do not change.
    - Origin is finalized account_update or account_remove and created_at equals prepared_at.
    - Store is active and historical account registry projection is active or removed.
    - Blocked store/account returns account_update_conflict; recovery store returns owner_recovery_required.
    - Manifest expected state is ready and common binding is origin-before historical binding.
    - Later account update/remove/recreation does not rebind the origin.
    - >-
      Closed precedence step 2 remains authoritative for persisted schema,
      anchor, history, transcript, or event corruption, including a persisted
      NULL transition, and returns owner_recovery_required without a private
      target distinction.
    - >-
      For otherwise structurally valid state, mutable blocked/recovery
      eligibility is classified from the request's signed common subject plus
      current public authority projections before origin, locator, or tombstone
      target-validity distinctions. Blocked store/account therefore returns
      account_update_conflict and recovery store returns
      owner_recovery_required even when the submitted private target is wrong.
  reservation_prepare:
    - CredentialCleanupReservation::new parses one complete bounded canonical locator transcript, checks caller kind, and derives its digest.
    - Before row insertion, prepare rederives exact kind/service/username/digest from authority realm and signed historical-before origin.
    - Malformed constructor input is invalid_input; canonical wrong-origin prepare is authorization_context_stale with zero mutation.
    - No prepare, commit, finalize, abort, recovery, account, store, event, or clock state-machine rule changes.
  challenge:
    - Issuance and exact pending reuse create zero grant uses, cleanup mutations, effects, invocations, keyring calls, or external calls.
    - Exact pending reuse consumes no entropy, returns the same challenge, appends no event, changes no lifecycle/event timestamp, and may advance only the paired authority clock.
    - Valid expired-pending replacement records one predecessor event 5 before one successor event 3 and creates exactly one fresh grant UUID and nonce.
    - Invalid-target replacement rolls back expiry, successor, events, clock, and entropy; concurrent exact issuance has one creator and clock-only losers.
    - Public projection, errors, logs, events, fixtures, and evidence omit locator material and private fields.

fix_contract:
  precedence_first_red:
    - >-
      Before any production edit, one focused RED combines blocked store,
      blocked account, and recovery store cases with independently invalid
      origin, locator, and tombstone targets. It proves precedence step 6 over
      step 7: account_update_conflict for blocked store/account and
      owner_recovery_required for recovery store, with zero durable mutation
      and zero entropy consumption.
    - >-
      A paired persisted-corruption control proves precedence step 2 still
      wins and returns owner_recovery_required; mutable eligibility
      classification must neither trust nor disclose private target validity.
  locator_and_legacy:
    - >-
      Every legacy negative invokes the legacy_v1 caller kind, so a rejection
      cannot pass by accidentally selecting active_v2. The matrix covers the
      domain, exact kind, exact services, lowercase username shape, digest,
      unrecognized/duplicate/out-of-order tags, trailing bytes, declared-length
      mismatch, malformed or noncanonical UTF-8, and embedded NUL.
    - >-
      Boundary cases cover service byte and character lengths 0, 1, 128, and
      129; username byte and character lengths 0, 1, 1024, and 1025; the exact
      greatest constructible canonical transcript; and raw complete-transcript
      total-bound gates at 0, 1, 4096, and 4097 bytes. Canonical locator and
      exact 14-tag tombstone byte/digest goldens each have closed-form one-field
      mutations; the locator matrix changes only kind, service, username, or
      digest, and the tombstone matrix changes only one tag value. Every
      negative proves the expected closed error with zero mutation and entropy.
    - >-
      One transition-bound legacy_v1 flow succeeds through reservation,
      prepare, finalize, and exact cleanup challenge issuance from the
      historical origin-before display ID.
  replacement_reuse_and_races:
    - >-
      Invalid-target expired-pending replacement snapshots and proves rollback
      of predecessor challenge state and terminal event, successor row, grant
      UUID, nonce, authority_meta.last_observed_at, authority_meta.updated_at,
      entropy count, and cleanup projection.
    - >-
      Valid expired replacement proves fresh grant and nonce, exactly one
      predecessor event 5 followed by exactly one successor event 3, unchanged
      cleanup, and no grant use or effect row.
    - >-
      Exact pending reuse, restart reuse, and every concurrent loser compare
      the complete immutable challenge projection byte-for-byte, consume no
      entropy, append no event, change no lifecycle/event timestamp, and may
      change only authority_meta.last_observed_at and authority_meta.updated_at
      as the paired clock high-water. Exactly one concurrent winner owns the
      new grant, nonce, and event.
    - >-
      Cleanup-specific response loss replays the exact committed request after
      reopen and returns the same immutable challenge with the same clock-only
      allowance and no second lifecycle interval.
  history_and_restart:
    - >-
      Finalized later account update, finalized later account remove, and
      same-display account recreation each prove that historical origin-before
      account, generation, credential, binding, and legacy display ownership do
      not rebind.
    - >-
      Reopen must fail owner_recovery_required for duplicate or missing cleanup
      descriptor, nonfinal or wrong-kind origin, historical account/generation/
      credential/binding tuple drift, created_at/prepared_at drift, and
      impossible ready-state transition, digest, claim, or deleted fields.
  effects_and_privacy:
    - >-
      First issuance, exact reuse, response-loss replay, failed replacement,
      and concurrent losers prove zero delta in grant_uses, challenge_effects,
      remote_effects, effect_claims, effect_invocations, and
      effect_observations, plus zero cleanup mutation and zero external-call
      count.
    - >-
      Static/source inspection proves A006 adds no keyring, credential backend,
      delete permit, delete-only call, runtime, network, or other external
      capability. Errors, events, fixtures, diagnostics, Debug/serialization,
      evidence, and public projections are scanned for locator service,
      username, transcript bytes, origin private fields, credentials, and raw
      target material.

