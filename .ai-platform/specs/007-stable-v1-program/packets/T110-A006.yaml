  implementation_review_exact_keys: [schema_version, review_kind, status, candidate_commit, candidate_tree, findings, residual_risk]
  implementation_review_required_status: PASS
  integration_path: .ai-platform/evidence/T202C3/attempts/T202C3-A006-F011-integration.yaml
