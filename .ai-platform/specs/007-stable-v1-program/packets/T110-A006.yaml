    - crates/kirje-store/tests/authority_registry.rs
    - crates/kirje-store/tests/fixtures/authority/registry/account_credential_cleanup/**
  forbidden_changes:
    - authority schema, application ID, user version, Cargo graph, Cargo.lock, or core transcript bytes/types
    - cleanup claim/delete, permit, deletion backend, runtime, config, keyring, protocol, CLI, MCP, network, or remote-effect behavior
    - transition state-machine behavior outside locator input hardening before cleanup insertion
  write_rules:
    - No production, test, or fixture edit begins from P11.
    - After three substantive packet-review passes, the orchestrator may create one A11 authorization/dispatch record under delegated authority without another user checkpoint.
    - A11 dispatches one worker for attempt T202C3-A006-F011-IMPLEMENTATION and the worker edits only future_allowed_files.
    - A failed candidate or blocking implementation review ends that dispatch; create a new named implementation-fix attempt and record rather than reusing A11.
    - Evidence and authorization records remain orchestrator-owned; A007/A008, T202C3, and T110 remain closed.

tdd_plan:
  ordering: >-
    After A11 dispatch, add discriminating tests first. Run the exact focused
    command at RED and again at GREEN. RED must be nonzero because a newly added
    test exposes the defect; GREEN must be zero after the minimum production fix.
  focused_red_command: cargo test -p kirje-store --test authority_registry credential_cleanup_challenge_is_exact --all-features --locked
  focused_green_command: cargo test -p kirje-store --test authority_registry credential_cleanup_challenge_is_exact --all-features --locked
  red_obligations:
    - transition_id absence returns authorization_malformed before lock, file, database, entropy, or mutation
    - independently cross every public-pair row with all six private-invalid cells and prove exact closed precedence plus zero mutation/entropy
    - prove complete phase order, legacy/bounds/mutation matrices, blocked/recovery zero-pending interaction, and active-pair fault rollback
    - prove immutable projection, clock-only reuse/losers, response loss, concurrency, replacement, restart, entropy, and event cardinality
    - prove later update/remove/recreation does not rebind and every descriptor/origin/tuple/timestamp/ready-state corruption fails closed
    - prove six effect-table deltas, zero external calls, zero keyring capability, and privacy invariants
  green_obligations:
    - canonical locator reservation and historical-before rederivation precede cleanup insertion
    - tombstone rederivation uses immutable origin history and bounded validation
    - only exact ready issuance and exact pending reuse succeed without authorization effects
    - restart validation covers the A006 challenge graph without claim/delete rows or events 16/17

validation_loop:
  focused:
    - cargo test -p kirje-store --test authority_registry credential_cleanup_challenge_is_exact --all-features --locked
  complete:
    - cargo test -p kirje-store --test authority_registry --all-features --locked
    - cargo test -p kirje-store --all-features --locked
    - cargo test -p kirje-store --no-default-features --locked
    - cargo test -p kirje-core --all-features --locked
    - cargo test --workspace --all-features --locked
    - cargo clippy -p kirje-store --all-targets --all-features --locked -- -D warnings
    - cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
    - cargo fmt --all --check
    - cargo build --workspace --all-features --locked
  known_baseline_blocker:
    - cargo deny remains the T111-owned yanked chacha20/io-imap baseline blocker and is not reported as passing
  candidate_scope_checks:
    - git -c status.showUntrackedFiles=all status --porcelain=v2 --untracked-files=all
    - git diff --name-status A11..C11 contains authority.rs and authority_registry.rs, optional cleanup fixtures, and no other path
    - git diff --summary A11..C11 and git ls-tree prove every candidate blob is regular and non-executable
    - Cargo.lock, authority schema, dependency manifests, and .ai-platform are unchanged from A11
  evidence_rule: record every command, exit code, and bounded result summary; record cargo deny only as the known T111 blocker

procedural_trace:
  model: trusted_local_linear_delivery_record
  preparation_P11:
    - P11 is this immutable reviewed packet commit with permissions closed.
    - Three independent packet reviews bind the exact P11 commit and tree.
  authorization_dispatch_A11:
    - A11 is a later standalone record of delegated authorization and one-worker dispatch, not a security capability.
    - A11 records only the exact schema below and does not expand P11 scope.
  candidate_C11:
    - C11 is the single dispatched worker candidate based on A11.
    - The orchestrator runs the clean-worktree, exact-diff, mode, and unchanged-file commands above and records their bounded output.
  integration_I11:
    - Three independent implementation reviews bind the same C11 commit and tree.
    - I11 records TDD, every validation, scope evidence, review paths, and review_complete.
  limitations:
    - Linear local history is an operating convention, not a cryptographic or malicious-admin replay defense.
    - Historical validators, tokens, refs, and self-tests are inert evidence and have no product-security meaning.

