known_boundaries:
  - CredentialCleanupManifest is owner-authorized, targets CleanupId, and has no authorization effect.
  - Cleanup locator material is private and delete-only; it never enters public output, events, fixtures, evidence, or logs.
  - A006 is limited to challenge-contract resolution and eventual effect-free issuance; it does not consume a grant or mutate cleanup state.
  - A007 and A008 are reserved labels for later claim and delete-completion decisions only; neither is Ready or packetized here.
  - No cleanup behavior may be implemented from this blocked packet.

blocking_findings:
  a006_minimum_challenge_contract:
    - id: H-A006-001
      severity: High
      finding: >-
        Signed tombstone_sha256 has no normative domain, transcript, ordered
        fields, bounds, or derivation from the durable cleanup row. It must not
        be assumed equal to locator_sha256.
    - id: H-A006-002
      severity: High
      finding: >-
        Challenge account and binding selection is undefined. The contract must
        choose historical-before versus current binding, define removed-account
        behavior, and define whether blocked or recovery-required stores can
        issue cleanup challenges.
    - id: H-A006-003
      severity: High
      finding: >-
        CredentialCleanupManifest permits transition_id=None for legacy cleanup,
        but no confirmed owner/store/account/binding relationship or durable
        tombstone origin defines that case.
  later_a007_claim_contract:
    - id: H-A007-001
      severity: High
      finding: >-
        Cleanup claim identity, first-use transaction, exact/changed retry,
        expiry precedence, response-loss recovery, and concurrent-winner
        semantics are undefined.
    - id: H-A007-002
      severity: High
      finding: >-
        Opaque DeleteOnlyLocator ownership is undefined, including whether only
        the first claim winner receives it, what exact recovery can receive, and
        the required non-Clone/non-Debug/non-Serialize/no-byte-export boundary.
    - id: H-A007-003
      severity: High
      finding: >-
        cleanup_claimed event 16 lacks exact source, related entity, context
        digest, receipt, ordering, timestamp, response-loss, and cardinality
        rules.
  later_a008_delete_contract:
    - id: H-A008-001
      severity: High
      finding: >-
        Delete completion lacks a crash protocol, caller capability, missing-key
        outcome rule, exact terminal retry identity, changed retry result, and
        recovery behavior.
    - id: H-A008-002
      severity: High
      finding: >-
        cleanup_deleted event 17 lacks exact source, related entity, context
        digest, receipt, ordering after event 16, timestamp, response-loss, and
        cardinality rules.

required_governance_resolutions:
  - Confirm H-A006-001 through H-A006-003 before replacing this blocker with an independently reviewed A006 execution packet.
  - Resolve H-A007-001 through H-A007-003 in a separate A007 packet before any claim implementation.
  - Resolve H-A008-001 and H-A008-002 in a separate A008 packet before any delete-completion implementation.
  - Each resolution must amend the confirmed security contract; no value may be inferred from schema shape, existing code, or this packet.

