  focused_red_green:
    - cargo test -p kirje-store --test authority_registry credential_cleanup_challenge_is_exact --all-features --locked
  complete:
    - cargo test -p kirje-store --test authority_registry --all-features --locked
    - cargo test -p kirje-store --all-features --locked
    - cargo test -p kirje-store --no-default-features --locked
    - cargo test -p kirje-core --all-features --locked
    - cargo clippy -p kirje-store --all-targets --all-features --locked -- -D warnings
    - cargo fmt --all --check
    - cargo build --workspace --all-features --locked
  integrity:
    - git diff --check
    - >-
      ruby -e 'require %q{yaml}; rx=/T202C3_A006_F00[1-4].*(PASS|APPROVED)|(PASS|APPROVED).*T202C3_A006_F00[1-4]/i;
      packet=%q{.ai-platform/specs/007-stable-v1-program/packets/T110-A006.yaml}; doc=YAML.safe_load_file(packet,aliases:true);
      vals=[]; walk=->(v){case v; when Hash; v.each_value{|x|walk[x]}; when Array; v.each{|x|walk[x]}; when String; vals<<v; end}; walk[doc[%q{governance_inputs}]];
      active=vals.select{|p|File.file?(p)}+[packet,%q{.ai-platform/evidence/T202C3/attempts/T202C3-A006.md},%q{.ai-platform/evidence/T202C3/summary.md},%q{.ai-platform/evidence/T202C3/test-results.md}];
      abort(%q{active stale authority}) if active.any?{|p|File.read(p).match?(rx)};
      abort(%q{unexpected token allowlist}) unless doc[%q{governance_inputs}][%q{approval_gates}][%q{historical_f001_f004_authority_token_allowlist}]==[];
      failed=(1..4).map{|n|%Q{.ai-platform/evidence/T202C3/attempts/T202C3-A006-F00#{n}-packet-review.md}};
      abort(%q{historical allowlist}) unless failed.all?{|p|s=File.read(p); s.match?(/FAIL/i) && s.match?(/authorization[^\n]*(none|no)|no (pass token|execution authorization)/i) && !s.match?(rx)};
      p=%q{.ai-platform/evidence/T202C3/attempts/T202C3-A006-F005-packet-review.md};
      s=File.read(p); abort(%q{placeholder pass}) unless s.include?(%q{PENDING_THREE_INDEPENDENT_REVIEWS}) && s.match?(/Review token:\s*none/i) && !s.match?(/Review token:\s*(?!none)\S/i) && !s.match?(rx)'
    - shasum -a 256 crates/kirje-store/src/authority/schema_v1.sql Cargo.lock
    - python3 /Users/iiwish/.codex/skills/ai-delivery-governor/scripts/validate_delivery_artifacts.py --root /Users/iiwish/self/kirje --feature-id 007-stable-v1-program
    - python3 /Users/iiwish/.codex/skills/ai-delivery-governor/scripts/validate_delivery_artifacts.py --root /Users/iiwish/self/kirje --feature-id 008-security-baseline

