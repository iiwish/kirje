    - lstat rejects symlinks and non-regular files; realpath must remain inside the repository; device/inode identity must be unique; every file is read completely
    - pre-review and post-authorization require exactly 24 active inputs; post-integration independently requires exactly 25 including the structured attempt evidence
  strict_parsing:
    - strict YAML plus exact-key/shape checks reject duplicate, unrecognized, shadow, or override fields in execution_constraints, execution_gate, authority_review_binding, review records, evidence_contract, integration evidence, and every path declaration
    - one visible status and exactly one each visible execution authorization, packet-review token, and governance follow-up must agree with the one structured aggregate authority block; exactly three known review rows are allowed
    - case-insensitive semantic token scans cover complete active, historical, initial-PASS, premature-attempt, and stage contents and detect underscore, decoration, cross-line, and multiline spellings
    - current tokens are legal only in their exact parsed scalar/table fields and documented cardinalities; decoys, duplicate placement, stale predecessors, and stage-outside-authority placements fail
