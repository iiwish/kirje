  candidate_change_exact_keys: [status, path, old_mode, new_mode]
  candidate_change_source: exact ordered A12-to-C12 raw/name-status diff; mandatory M authority.rs and M authority_registry.rs old/new 100644 plus optional M old/new 100644 or A 000000-to-100644 cleanup fixtures
  red_observed:
