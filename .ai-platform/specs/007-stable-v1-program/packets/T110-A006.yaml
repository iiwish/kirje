    - Reject malformed active-v2/legacy-v1 constructor transcripts and canonical wrong-origin prepare before cleanup insertion with zero durable mutation.
    - Add active/removal history, later update/remove/recreation, blocked/recovery, NULL-transition, wrong-origin, duplicate-descriptor, state, restart, corruption, and privacy negatives.
    - Add exact pending-reuse clock-only, expired-pending replacement, concurrent exact issuance, restart, entropy/event cardinality, and invalid-target rollback matrices.
