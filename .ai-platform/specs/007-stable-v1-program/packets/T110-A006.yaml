work_unit:
  title: Admit exact credential-cleanup challenge issuance
  attempt: T202C3-A006
  goal: >-
    Admit exact, effect-free owner-authorized credential_cleanup challenge
    issuance for one immutable Ready cleanup tombstone created by an accepted
    account update or remove transition. Bind the signed cleanup target to its
    exact store, account, current binding, locator kind, locator digest,
    tombstone digest, transition origin, and Ready state without consuming a
    grant or changing the cleanup row. Claim/delete remain a later attempt.
  parent: T110 Complete Authority Lifecycles
  security_task: T202C3 Account Credential And Cleanup Lifecycles
  depends_on:
    - T109 Accepted
    - T202C2 Accepted at production commit 94f3495
    - T202C3-A005 Accepted at production commit 316dae0
  blocks:
    - cleanup claim/delete packet
    - T202C3 completion
  parallel: false
  conflicts_with:
    - all concurrent authority cleanup, challenge, event, registry, or restart validation work

blocking_findings:
  - id: H-A006-001
    severity: High
    finding: >-
      CredentialCleanupManifest contains signed tombstone_sha256, but the
      confirmed contracts define no canonical tombstone domain, transcript, or
      derivation. The authority row persists private locator_material and
      locator_sha256 only; tombstone_sha256 must not be assumed equal to
      locator_sha256.
    required_resolution: >-
      The user must confirm a contract amendment defining the exact domain
      prefix, ordered tagged fields, bounds, and digest comparison that bind the
      signed tombstone_sha256 to the immutable authority cleanup row.

codebase_context:
  branch: codex/v1-roadmap-governance
  baseline_head: aba4ce5
  existing_patterns:
    - A001 admits exact effect-free account and credential challenges with pending reuse, restart validation, and zero action effects.
    - A002 and A003 create transition-bound private cleanup rows and finalize them from provisional to ready.
    - Core has a sealed CredentialCleanupManifest targeted by CleanupId with locator kind and digests, optional transition ID, and expected Ready state.
    - T202C1 provides exact pending challenge, expiry, replay, event, effective-time, and zero-effect patterns.
  invariants:
    - only a Ready cleanup row with exact signed target, store, account, current binding, locator kind/digests, transition origin, and state can receive a challenge
    - the signed tombstone digest is rederived from the confirmed canonical tombstone transcript rather than trusted or equated to locator_sha256
    - challenge issuance changes only challenge, clock, and challenge-event state and consumes no cleanup grant
    - pending exact-context reuse consumes no entropy and appends no duplicate event
    - provisional, claimed, deleted, cross-store, cross-account, wrong-binding, changed-transition, changed-locator, changed-tombstone, and corrupt rows fail closed
    - no locator material appears in challenge projection, output, event detail, fixture, evidence, or logs
  forbidden_changes:
    - Authority SQLite schema, application ID, user version, or Cargo graph
    - core canonical transcript bytes, manifest types, action policy table, or confirmed security contracts without explicit user approval
    - cleanup claim/delete, grant use, DeleteOnlyLocator, CredentialJanitor, keyring, runtime, config, local I/O, protocol, CLI, MCP, network, or external calls
    - cleanup read, probe, contains, list, copy, export, set, rebind, fallback, material logging, or active-locator conversion
    - remote effect, account transition, credential mutation, owner rotation, recovery, policy, or assurance behavior

