contract_snapshot:
  unchanged_owner: T202C3-A006
  challenge_phase_order:
    - pure manifest preflight, including transition_id presence
    - apply lock and transaction
    - request-independent global integrity validation
    - checked effective time without request-directed pending access
    - closed public store/account pair classification
    - private cleanup/origin/locator/tombstone validation
    - request-directed pending lookup and exact reuse or expired replacement
    - successor creation and commit
  public_pair_precedence:
    - absent store, absent account, or pair mismatch returns credential_cleanup_invalid
    - matched recovery store returns owner_recovery_required
    - matched blocked store or blocked/proposed account returns account_update_conflict
    - unrelated matched blocked and unrelated matched recovery pairs return those same public projections without target distinction
    - active store plus active or removed account proceeds to private validation
    - finalized-origin account persisted as proposed is step-2 owner_recovery_required corruption
  private_invalid_cells:
    - wrong origin
    - wrong locator kind
    - wrong locator digest
    - wrong tombstone
    - wrong lifecycle
    - missing or duplicate descriptor
  locator_contract:
    domain: KIRJE-DELETE-ONLY-LOCATOR-V1 followed by NUL
    fields: [locator_kind u8, service canonical UTF-8, username canonical UTF-8]
    active_v2: exact v2 service and lowercase digest username from immutable historical origin
    legacy_v1: exact legacy service and validated historical display ID from origin-before
    digest: SHA-256 of the complete canonical transcript
  tombstone_contract:
    domain: KIRJE-CREDENTIAL-CLEANUP-TOMBSTONE-V1 followed by NUL
    source: immutable finalized origin transition, manifest, before snapshot, historical account/credential/binding, locator digest, and prepared_at
    exclusions: [raw locator, mutable lifecycle, claim state, deleted state]
  replacement_contract:
    - blocked/recovery public classification performs no request-directed pending lookup or interaction
    - active eligible OldChallengeExpiredState and OldChallengeExpiredEvent fault hooks roll back all tentative predecessor, event, clock, successor, entropy, and cleanup work
    - different-context invalid target has zero predecessor interaction
    - persisted target corruption is step-2 owner_recovery_required
  effect_contract:
    - first issuance, reuse, response loss, replacement, faults, restart, concurrent winner, and every loser have zero external calls
    - each path proves zero delta in challenge_effects, remote_effects, effect_claims, effect_invocations, effect_observations, and grant_uses as applicable
    - exact pending reuse and concurrent losers may advance only the paired authority clock high-water
  privacy_contract:
    - real or private locator material is prohibited in every committed file
    - synthetic non-real locator bytes may occur only in authority_registry.rs
    - evidence contains only synthetic vector IDs, digests, counts, and results

execution_constraints:
  production_permission: none_pending_f009_authorization_record
  test_permission: none_pending_f009_authorization_record
  fixture_permission: none_pending_f009_authorization_record
  future_allowed_files:
    - crates/kirje-store/src/authority.rs
    - crates/kirje-store/tests/authority_registry.rs
    - crates/kirje-store/tests/fixtures/authority/registry/account_credential_cleanup/**
  forbidden_changes:
    - authority schema, application ID, user version, Cargo graph, Cargo.lock, or core transcript bytes/types
    - cleanup claim/delete, permit, deletion backend, runtime, config, keyring, protocol, CLI, MCP, network, or remote-effect behavior
    - transition state-machine behavior outside locator input hardening before cleanup insertion
  write_rules:
    - No production, test, or fixture edit may begin from this packet preparation commit.
    - Only a direct-child standalone authorization commit with three passing packet reviews may authorize one worker candidate.
    - The worker edits only the exact future_allowed_files and never edits governance or evidence.
    - Evidence and authorization records are orchestrator-owned.
    - Do not mark A007, A008, T202C3, or T110 Ready or Accepted from this packet.

tdd_plan:
  ordering: >-
    After authorization, write discriminating REDs before production changes.
    Each returned-review category requires a real RED where the defect exists;
    already-correct behavior receives honest test-only proof.
  red:
    - transition_id absence returns authorization_malformed before lock, file, database, entropy, or mutation
    - independently cross every public-pair row with all six private-invalid cells and prove exact closed precedence plus zero mutation/entropy
    - prove the complete challenge phase order and unchanged claim/delete proof-expiry order
    - cover correct-kind legacy success and negatives, numeric-only private length classifier, and closed-form locator/tombstone mutation matrices
    - prove blocked/recovery zero-pending interaction and active-pair fault rollback
    - prove complete immutable challenge projection, clock-only reuse/losers, response loss, concurrent issuance, replacement, restart, entropy, and event cardinality
    - prove later update/remove/recreation do not rebind and all descriptor/origin/tuple/timestamp/ready-state restart corruption fails closed
    - prove six effect-table deltas, zero external calls, zero keyring capability, and privacy invariants
  green:
    - parse the canonical locator at reservation and rederive kind/service/username/digest from realm plus historical-before origin before insertion
    - rederive the tombstone from immutable origin history with bounded streaming validation
    - admit only exact ready challenge issuance and exact pending reuse with zero authorization effect
    - extend restart validation for the A006 challenge graph without claim/delete rows or events 16/17
  refactor:
    - share helpers only when action-specific bounds, precedence, and private-data closure remain explicit

validation_loop:
  focused:
    - cargo test -p kirje-store --test authority_registry credential_cleanup_challenge_is_exact --all-features --locked
  complete:
    - cargo test -p kirje-store --test authority_registry --all-features --locked
    - cargo test -p kirje-store --all-features --locked
    - cargo test -p kirje-store --no-default-features --locked
    - cargo test -p kirje-core --all-features --locked
    - cargo test --workspace --all-features --locked
    - cargo clippy -p kirje-store --all-targets --all-features --locked -- -D warnings
    - cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
    - cargo fmt --all --check
    - cargo build --workspace --all-features --locked
  known_baseline_blocker:
    - cargo deny remains the T111-owned yanked chacha20/io-imap baseline blocker and is not reported as passing
  integrity:
    - git diff --check
    - verify crates/kirje-store/src/authority/schema_v1.sql and Cargo.lock are unchanged from the authorization commit

authority_dag:
  model: append_only_single_parent
  packet_preparation_P:
    rule: >-
      This packet commit is clean, has baseline_head as its direct parent, keeps
      all permissions closed, and contains no F009 review, authorization, or
      implementation evidence record. The packet is immutable after P.
  authorization_A:
    parent: P
    exact_added_files:
      - .ai-platform/evidence/T202C3/attempts/T202C3-A006-F009-spec-review.yaml
      - .ai-platform/evidence/T202C3/attempts/T202C3-A006-F009-engineering-review.yaml
      - .ai-platform/evidence/T202C3/attempts/T202C3-A006-F009-qa-review.yaml
      - .ai-platform/evidence/T202C3/attempts/T202C3-A006-F009-authorization.yaml
    rules:
      - A is P's direct single-parent child and adds exactly the four regular 100644 files above without modifying P artifacts.
      - Each review binds P commit and tree, records PASS with exact severity counts, and has an explicit residual_risk disposition.
      - The authorization record references P and all three review paths, records one unspent decision, and introduces no scope field; scope is read only from P.
      - A does not name or hash itself.
  production_candidate_C:
    parent: A
    rules:
      - C is A's direct single-parent child and has a non-empty diff.
      - C must modify authority.rs and authority_registry.rs; cleanup fixture files are optional.
      - C changes no other path and no .ai-platform file.
      - Every changed path is a regular 100644 blob; deletion, rename, copy, symlink, submodule, executable mode, and type change are forbidden.
  terminal_integration_I:
    parent: C
    exact_added_files:
      - .ai-platform/evidence/T202C3/attempts/T202C3-A006-F009-implementation-spec-review.yaml
      - .ai-platform/evidence/T202C3/attempts/T202C3-A006-F009-implementation-engineering-review.yaml
      - .ai-platform/evidence/T202C3/attempts/T202C3-A006-F009-implementation-qa-review.yaml
      - .ai-platform/evidence/T202C3/attempts/T202C3-A006-F009-integration.yaml
    rules:
      - I is C's direct single-parent child and adds exactly the four regular 100644 files above.
      - Each implementation review binds the same C commit and tree and records exact finding counts plus residual-risk disposition.
      - Integration binds P, A, and C; records RED, GREEN, complete validation, candidate paths, review paths, and review_complete; permissions are spent and non-replayable.
      - I never records or hashes itself; repeat validation derives I from committed HEAD.

review_schemas:
  packet_review:
    exact_keys: [schema_version, review_kind, status, reviewed_packet_commit, reviewed_packet_tree, findings, residual_risk]
    required_status: PASS
    findings_keys: [critical, high, medium, low]
  authorization:
    exact_keys: [schema_version, status, reviewed_packet_commit, reviewed_packet_tree, review_paths, grant_state]
    required_status: AUTHORIZED
    grant_state: unspent_one_time
  implementation_review:
    exact_keys: [schema_version, review_kind, status, candidate_commit, candidate_tree, findings, residual_risk]
    required_status: PASS
  integration:
    exact_keys: [schema_version, status, packet_commit, authorization_commit, candidate_commit, candidate_tree, candidate_paths, red_observed, green_passed, validations, implementation_review_paths, grant_state]
    required_status: review_complete
    grant_state: spent_non_replayable

evidence_contract:
  preparation_path: .ai-platform/evidence/T202C3/attempts/T202C3-A006-F009-preparation.md
  authorization_path: .ai-platform/evidence/T202C3/attempts/T202C3-A006-F009-authorization.yaml
  integration_path: .ai-platform/evidence/T202C3/attempts/T202C3-A006-F009-integration.yaml
  required:
    - exact RED and GREEN command/results
    - complete validation results and explicit cargo-deny T111 blocker
    - exact candidate diff paths and regular Git modes
    - three packet reviews binding P and three implementation reviews binding C
    - sanitized evidence with no raw locator or private data
  prohibited:
    - authorization inferred from Markdown prose, historical tokens, file cardinality, or an audit script
    - packet or review artifact mutation after its committed phase
    - self-referential commit, tree, file, or manifest hashes

review_contract:
  packet_pass_rule:
    - unresolved Critical or High findings block authorization
    - Medium blocks only when it violates the F006 substantive contract, exact scope, Definition of Done, or validation sufficiency
    - other Medium and Low findings require explicit disposition but do not create an automatic successor packet
    - all three reviewers must return PASS under this rule before A is created
  implementation_pass_rule:
    - the same severity/disposition rule applies to implementation review
    - all three reviews must bind the same candidate commit and tree
  acceptance_rule:
    - review_complete requires TDD, all complete gates, sanitized evidence, and three passing implementation reviews
    - delegated acceptance never claims user personal review of unseen work

handoff:
  current_state: F009 packet preparation only; permissions are closed and no authorization record exists
  next_state: three independent reviews bind immutable P, then a standalone direct-child authorization record A may be created
  after_authorization: one worker creates exact-scope candidate C, followed by implementation reviews and standalone integration I
  later_tasks: A007/A008 remain non-executable and T202C3/T110 remain unaccepted
  commit_policy:
    - local commits only
    - no push, merge, tag, publish, GitHub Release, live provider, mailbox, credential, or external destructive operation

stop_conditions:
  - Any unresolved Critical or High packet-review or implementation-review finding.
  - A Medium finding that violates the F006 contract, exact scope, Definition of Done, or validation sufficiency.
  - Production work requested before standalone authorization A exists and is verified.
  - Schema, dependency, core transcript/type, runtime, keyring, protocol, CLI, MCP, network, or external-effect change is required.
  - Any locator material, secret, credential, private origin value, or real provider data would enter committed evidence.
