tdd_plan:
  ordering: >-
    F008 remains non-executable until all three independent packet reviews pass
    and the post-authorization audit succeeds. The pre-review audit is preparation
    evidence only and never authorizes worker execution.
    After governance authorization, the manifest-preflight and public-projection
    REDs run before production edits. Each retained
    initial/F001 review category receives its discriminating pre-change test;
    real defects require a captured RED before corresponding production change,
    while already-correct behavior receives honest test-only proof.
  red:
    - Prove transition_id=None returns AuthorizationMalformed before apply lock, file, database, or entropy work with zero I/O, mutation, and entropy; source/call-order proof must establish the pure authority.rs preflight and no core change.
    - Run independent public rows before every production edit: absent store, absent account, and pair mismatch each expect CredentialCleanupInvalid; matched recovery expects OwnerRecoveryRequired; matched blocked store/account expects AccountUpdateConflict; unrelated matched proposed expects AccountUpdateConflict; unrelated existing matched blocked expects AccountUpdateConflict; unrelated existing matched recovery-store expects OwnerRecoveryRequired; active/active and active/removed proceed and expect CredentialCleanupInvalid for each invalid private cell. Cross EACH row independently with wrong origin, locator kind, locator digest, tombstone, lifecycle, and descriptor. Same-origin proposed is step-2 corruption. Every row states its own exact result.
    - Prove the exact phase sequence through source/call-order and discriminating faults: pure preflight, lock/transaction, global validation, checked effective time/time shape without pending access, public classification, private validation, pending lookup, reuse/replacement, successor commit. Prove no durable pending expiry before eligibility and keep ordinary claim/delete proof-expiry behavior unchanged.
    - Run correct-kind legacy, private numeric-only length-classifier unit tests, closed-form registry locator/tombstone goldens and mutations, malformed reservation/wrong-origin prepare, and the successful transition-bound legacy flow.
    - Prove same-context expired pending plus later blocked returns AccountUpdateConflict and later recovery store returns OwnerRecoveryRequired, each with zero pending-row lookup-dependent interaction and no predecessor/event/clock/entropy/successor/grant/nonce/cleanup change; use OldChallengeExpiredState and OldChallengeExpiredEvent on active eligible valid-target replacement to prove full rollback; retain different-context zero-predecessor and step-2 corruption controls plus valid replacement freshness/event cardinality.
    - Run complete immutable-projection, paired-clock-only reuse/loser, concurrent issuance, restart, and cleanup response-loss matrices.
    - Run later-history non-rebinding plus descriptor/origin/tuple/timestamp/ready-state durable restart-corruption matrices.
    - Run all-effect-table/grant-use/external-call cardinality and privacy/capability source scans.
    - For first issuance, exact reuse, response loss, valid replacement, both replacement faults, restart reuse, concurrent winner, and every loser, assert zero delta in all six effect/external tables, zero external calls, and unchanged cleanup; compare grant_uses by delta because origin uses may preexist.
  green:
    - Parse the canonical locator at reservation and rederive/compare kind, service, username, and digest from realm plus signed historical-before origin before row insertion.
    - Rederive the tombstone from immutable origin history with bounded streaming validation.
    - Admit only exact ready challenge issuance and pending reuse with zero authorization effect.
    - Extend restart validation for the A006 challenge graph without admitting claim/delete rows or events 16/17.
  refactor:
    - Share canonical TLV helpers only when the private locator/tombstone bounds and action-specific validation stay explicit.

