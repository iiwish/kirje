    - exact transcripts, explicit cleanup-only historical-before binding exception, transition-bound legacy, ready eligibility, and no core/schema change
  pass_2_engineering:
    - strict bounds, reservation/prepare canonicality, streaming restart derivation, error precedence, clock-only pending reuse, replacement/concurrency rollback, zero-effect transaction, and privacy/capability closure
  pass_3_qa:
    - golden/mutation, malformed reservation/prepare, active/removed/later-history, blocked/recovery, NULL transition, corruption, clock-only reuse, expired replacement, concurrent issuance/restart, response loss, and zero-external-call coverage
  packet_pass_condition:
