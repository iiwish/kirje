work_unit:
  title: Complete the account-remove authority transition
  attempt: T202C3-A003
  goal: >-
    Implement the exact account_remove prepare, config-commit, finalize, abort,
    unsafe-observation recovery, retry, expiry, restart, immutable store-version,
    and provisional-to-ready cleanup lifecycle. Preserve the removed account and
    credential history, release only its active display slot, and do not expose
    credential mutation or cleanup claim/delete capability.
  parent: T110 Complete Authority Lifecycles
  security_task: T202C3 Account Credential And Cleanup Lifecycles
  depends_on:
    - T109 Accepted
    - T202C2 Accepted at production commit 94f3495
    - T202C3-A002 Accepted at production commit 2c00f32
  blocks:
    - credential-set transition attempt
    - credential-delete transition attempt
    - cleanup claim/delete attempt
  parallel: false
  conflicts_with:
    - all concurrent authority registry, transition, cleanup, event, or restart validation work

codebase_context:
  branch: codex/v1-roadmap-governance
  baseline_head: 9fbf893
  existing_patterns:
    - Account update supplies the atomic existing-account block, store block, observation, event, retry, cleanup, and recovery skeleton.
    - A001 admits an exact effect-free account_remove challenge with a before snapshot, no after snapshot, and one provisional cleanup descriptor.
    - A002 stores cleanup material privately and readies it only after authority finalize.
    - Immutable store versions are created for every committed config transition; account removal has no after account snapshot and must not invent an account version.
  invariants:
    - prepare rechecks the complete signed before account snapshot and exact active store CAS.
    - remove keeps the account ID, display digest, generation, credential, and binding tuple unchanged while blocking account plus store.
    - prepare changes the current account receipt to the removal receipt and records the active transition, but reserves no new credential identity.
    - cleanup locator material stays private, bounded to 1..4096 bytes, and hashes to the sealed descriptor.
    - config commit inserts exactly one after store version and no account version.
    - finalize alone marks the account removed with removed_at, releases the active display slot, unblocks the store, and changes cleanup to ready with exact events.
    - abort restores the exact active before tuple and predecessor receipt while retaining provisional cleanup identities.
    - recovery keeps the before tuple blocked with the removal transition and never guesses whether config or keyring work occurred.
    - removed account, credential, grant, receipt, transition, versions, and cleanup identities remain immutable and globally reserved.
  forbidden_changes:
    - Authority SQLite schema, application ID, user version, or Cargo graph
    - core canonical transcript bytes, manifest types, or action policy table
    - credential set/delete transition, cleanup challenge/claim/delete, account purge, or remote-effect behavior
    - config, runtime, keyring, local I/O, protocol, CLI, MCP, or network code

