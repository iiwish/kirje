    - Record the focused RED command and exact create/update-only rejection.
    - Synthetic public signatures may be committed; private keys, seeds, proofs, nonces, locator material, and real account data may not.
    - Do not mark T202C3 or T110 Accepted in this attempt.
    - Do not broaden into credential mutation, cleanup claim/delete, account purge, or another transition kind.
  ownership:
    worktree: /Users/iiwish/self/kirje
    branch: codex/v1-roadmap-governance
    executor: primary Codex agent because the user requested direct serial continuation

tdd_plan:
  red:
    - Build and finalize one synthetic active account through the accepted account-create lifecycle.
    - Authorize one exact account_remove challenge and prove prepare reaches the create/update-only gate.
    - Assert the failed prepare writes no grant, transition, cleanup, event, or clock row.
  green:
    - Reuse the private cleanup-reservation input with exact manifest comparison.
    - Implement remove prepare, commit, finalize, abort, recovery, replay, expiry, restart, store version, and cleanup provisional-to-ready behavior.
    - Generalize registry history only for create, update, and remove chains without accepting credential transitions.
  refactor:
    - Share before/after snapshot selection and predecessor validation only where action-specific state remains explicit.

validation_loop:
  focused_red_green:
    - cargo test -p kirje-store --test authority_registry account_remove_transition_lifecycle_is_exact --all-features --locked
  changed_crate:
    - cargo test -p kirje-store --test authority_registry --all-features --locked
    - cargo test -p kirje-store --all-features --locked
    - cargo test -p kirje-store --no-default-features --locked
    - cargo clippy -p kirje-store --all-targets --all-features --locked -- -D warnings
    - cargo fmt --all --check
  integrity:
    - git diff --check
    - shasum -a 256 crates/kirje-store/src/authority/schema_v1.sql Cargo.lock
    - python3 /Users/iiwish/.codex/skills/ai-delivery-governor/scripts/validate_delivery_artifacts.py --root /Users/iiwish/self/kirje --feature-id 007-stable-v1-program
  expected_signal:
    - exact remove completes prepared, config_committed, finalized with account removed, store active, and cleanup ready
    - config commit adds a store version but no account version or credential identity
    - exact pre-config abort restores the active predecessor receipt and retains provisional cleanup identity
    - unsafe observations enter recovery_required without readying cleanup
    - removed display reuse is admitted only for a fresh account and credential identity
    - schema and dependency hashes remain unchanged
  failure_handling:
    - First relevant failure: fix only inside packet-authorized production/test files.
    - Second same-cause contract failure: stop and record the blocker rather than weakening assertions.
    - Never expose cleanup material, delete a historical row, or manufacture an after account version.

