stop_conditions:
  - A required change touches schema, core, runtime, keyring, local I/O, protocol, CLI, MCP, network, or dependency files.
  - Exact predecessor account state or receipt cannot be recovered from accepted immutable versions and grant history.
  - Removal would require deleting or rewriting an account, credential, version, grant, receipt, transition, or cleanup identity.
  - RED cannot discriminate the create/update-only gate from fixture or proof failure.
  - A Critical or High review finding cannot be fixed inside the allowed production/test files.
