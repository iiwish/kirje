review_contract:
  pass_1_spec_compliance:
    - exact signed before/CAS/cleanup binding and absent after snapshot
    - no new credential or account version; removed history stays immutable
    - provisional cleanup becomes ready only after authority finalize
  pass_2_engineering:
    - transaction atomicity, predecessor receipt restoration, retry identity, event order, successor history, error precedence, and restart corruption checks
    - removed display slot is released without allowing old account or credential identity reuse
    - cleanup material stays private and no read/probe/copy/export/set/claim/delete capability is added
  pass_3_qa:
    - success, abort, unsafe recovery, expiry, restart, tamper, display reuse, and predecessor regression paths
  acceptance:
    - no unresolved Critical or High finding
    - every validation command passes
    - attempt commit remains independently reviewable without accepting T202C3 or T110

