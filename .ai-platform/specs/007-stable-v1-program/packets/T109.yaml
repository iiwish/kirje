  - Any preserved content hash differs before review.
  - A required fix touches a forbidden or undeclared path.
  - Schema, dependency, core public contract, runtime, CLI, MCP, protocol, keyring, or network change is required.
  - Real/private authority or mailbox material would be required.
  - Review finds a Critical or High issue that cannot be fixed within scope.
  - Focused validation fails twice for the same unresolved cause.
