tdd_plan:
  recovery_rule: >-
    The exact RED and GREEN outputs in the interrupted attempt may be reused
    only when all preserved source, test, fixture, schema, lib, and Cargo.lock
    hashes match. Do not reconstruct RED by reverting the shared worktree.
  red:
    - Confirm the recorded unresolved transition surface and exact unsupported-capability failure.
    - For any review fix, add a new discriminating focused failure first.
  green:
    - Confirm the recorded focused, package, MSRV, workspace, Clippy, build, hash, query, and privacy results.
    - Run fresh focused validation after any review fix.
  refactor:
    - No cleanup-only refactor is permitted in checkpoint recovery.

validation_loop:
  preflight:
    - git status --short --branch
    - shasum -a 256 crates/kirje-store/src/authority.rs crates/kirje-store/tests/authority_registry.rs crates/kirje-store/tests/fixtures/authority/registry/account_create/vectors.txt crates/kirje-store/src/authority/schema_v1.sql crates/kirje-store/src/lib.rs Cargo.lock
    - git diff --check
  fresh_required:
    - cargo fmt --all --check
    - cargo test -p kirje-store --test authority_registry --all-features --locked
    - cargo clippy -p kirje-store --all-targets --all-features --locked -- -D warnings
  reuse_when_hashes_match:
    - cargo test -p kirje-store --test authority_authorization --all-features --locked
    - cargo test -p kirje-store --test authority_schema --all-features --locked
    - cargo test -p kirje-store --no-default-features --locked
    - cargo test -p kirje-store --all-features --locked
    - cargo +1.88.0 test -p kirje-store --all-features --locked
    - cargo test --workspace --all-features --locked
    - cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
    - cargo build --workspace --all-features --locked
  known_baseline_failure:
    command: cargo deny check advisories
    result: yanked chacha20 0.10.1 through io-imap dependency graph
    owner: T111
    introduced_by_this_task: false
  failure_handling:
    - First relevant failure: inspect and fix only within allowed files.
    - Second relevant failure: stop and report scope or contract mismatch.
    - Hash mismatch before review: stop and classify the unexpected change.
    - Never delete, ignore, serialize, or weaken a failing test.

