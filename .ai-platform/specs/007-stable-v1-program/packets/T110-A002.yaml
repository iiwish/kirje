codebase_context:
  branch: codex/v1-roadmap-governance
  baseline_head: 72c6592
  existing_patterns:
    - Account-create already supplies the atomic grant, store block, transition, version, observation, event, retry, and recovery skeleton.
    - A finalized account-create leaves immutable generation-one store/account versions and a globally reserved credential identity.
    - A001 admits an exact effect-free account_update challenge whose sealed payload includes one provisional cleanup descriptor.
    - Authority SQLite v1 already stores private cleanup material and provisional, ready, claimed, and deleted states.
  invariants:
    - prepare rechecks the complete sealed before snapshot against the active current account and exact active store CAS.
    - update keeps account and display identity, increments account and config generation once, reserves a new credential identity, and blocks account plus store.
    - cleanup locator material is supplied only through a non-Debug store type, is bounded to 1..4096 bytes, and must hash to the sealed descriptor.
    - prepare writes cleanup rows only as provisional; finalize alone changes this transition's cleanup rows to ready and emits cleanup-ready events.
    - abort restores the exact prior account tuple and owner receipt from immutable history while retaining the new credential and provisional cleanup identities.
    - recovery keeps the proposed account and cleanup blocked/provisional and never guesses whether a keyring or config effect occurred.
    - old create retries remain transition-scoped after the update begins or finishes.
  forbidden_changes:
    - Authority SQLite schema, application ID, user version, or Cargo graph
    - core canonical transcript bytes, manifest types, or action policy table
    - account remove, credential set/delete, cleanup challenge/claim/delete, or remote-effect behavior
    - config, runtime, keyring, local I/O, protocol, CLI, MCP, or network code

