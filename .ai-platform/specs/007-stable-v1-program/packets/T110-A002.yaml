stop_conditions:
  - A required change touches schema, core, runtime, keyring, local I/O, protocol, CLI, MCP, network, or dependency files.
  - Exact prior account state cannot be recovered from accepted immutable versions and grant history.
  - Cleanup material would need to be returned, printed, logged, serialized, or converted to an active locator.
  - RED cannot discriminate the create-only gate from fixture or proof failure.
  - A Critical or High review finding cannot be fixed inside the allowed production/test files.
