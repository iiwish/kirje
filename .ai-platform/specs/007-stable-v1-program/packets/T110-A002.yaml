tdd_plan:
  red:
    - Build and finalize one synthetic account through the accepted account-create lifecycle.
    - Authorize one exact account_update challenge and show prepare fails at the create-only transition gate.
    - Assert the failed prepare writes no grant, transition, credential, cleanup, event, or clock row.
  green:
    - Add a private bounded cleanup-reservation input and exact manifest comparison.
    - Implement update prepare, commit, finalize, abort, recovery, replay, restart, immutable versions, and cleanup provisional-to-ready state.
    - Generalize registry history validation only for account_create plus account_update chains.
  refactor:
    - Share manifest and current-account helpers only where they preserve explicit action and state precedence.

validation_loop:
  focused_red_green:
    - cargo test -p kirje-store --test authority_registry account_update_transition_lifecycle_is_exact --all-features --locked
  changed_crate:
    - cargo test -p kirje-store --test authority_registry --all-features --locked
    - cargo test -p kirje-store --all-features --locked
    - cargo test -p kirje-store --no-default-features --locked
    - cargo clippy -p kirje-store --all-targets --all-features --locked -- -D warnings
    - cargo fmt --all --check
  integrity:
    - git diff --check
    - shasum -a 256 crates/kirje-store/src/authority/schema_v1.sql Cargo.lock
    - python3 /Users/iiwish/.codex/skills/ai-delivery-governor/scripts/validate_delivery_artifacts.py --root /Users/iiwish/self/kirje --feature-id 007-stable-v1-program
  expected_signal:
    - exact update completes prepared, config_committed, finalized with account/store active and cleanup ready
    - exact pre-config abort restores the generation-one active account while retaining immutable reserved identities
    - unsafe observations enter recovery_required without readying cleanup
    - exact retries and restart validation remain green for create and update history
    - schema and dependency hashes remain unchanged
  failure_handling:
    - First relevant failure: fix only inside packet-authorized production/test files.
    - Second same-cause contract failure: stop and record the blocker rather than weakening assertions.
    - Never expose cleanup material, bypass restart validation, or erase an immutable identity.

