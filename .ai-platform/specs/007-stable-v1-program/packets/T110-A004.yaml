review_contract:
  pass_1_spec_compliance:
    - exact credential target and signed before/after/CAS/active-locator binding
    - existing credential identity with one new account version and no cleanup row
    - after state is authorized/bound with no state reason
  pass_2_engineering:
    - transaction atomicity, predecessor receipt restoration, retry identity, event order, successor history, error precedence, and restart corruption checks
    - no credential bytes, locator material, read/probe/copy/export/set/delete API, or external call surface
  pass_3_qa:
    - success, abort, unsafe recovery, expiry, restart, target mismatch, fault, and predecessor regression paths
  acceptance:
    - no unresolved Critical or High finding
    - every validation command passes
    - attempt commit remains independently reviewable without accepting T202C3 or T110

handoff:
