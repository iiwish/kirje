work_unit:
  title: Complete the credential-set authority transition
  attempt: T202C3-A004
  goal: >-
    Implement the exact credential_set prepare, config-commit, finalize, abort,
    unsafe-observation recovery, retry, expiry, restart, and immutable version
    lifecycle. Bind the credential-targeted grant to the complete signed account
    mutation and active-locator digest without storing credential bytes or
    adding keyring, cleanup, runtime, CLI, MCP, protocol, or network capability.
  parent: T110 Complete Authority Lifecycles
  security_task: T202C3 Account Credential And Cleanup Lifecycles
  depends_on:
    - T109 Accepted
    - T202C2 Accepted at production commit 94f3495
    - T202C3-A003 Accepted at production commit 703b5a1
  blocks:
    - credential-delete transition attempt
    - cleanup claim/delete attempt
  parallel: false
  conflicts_with:
    - all concurrent authority registry, transition, credential, event, or restart validation work

codebase_context:
  branch: codex/v1-roadmap-governance
  baseline_head: e79cc85
  existing_patterns:
    - A001 admits an exact effect-free credential_set challenge targeted at the current credential identity and signed with the proposed binding.
    - Account update supplies the existing-account block, store block, observation, immutable-version, terminal retry, and predecessor restoration skeleton.
    - Account remove proves transition-kind-specific target, version, generation, and restart validation can remain explicit without schema changes.
  invariants:
    - prepare rechecks the complete signed before and after account snapshots plus exact active store CAS.
    - before credential state is reentry_required or missing; after is bound with an authorized binding and no state reason.
    - account ID, display ID, credential identity, binding material, and cleanup IDs remain exact; account and config generations each advance once.
    - grant target kind is credential and target bytes equal the after credential ID; the transition still owns the signed account ID and store.
    - active_locator_sha256 remains only in the immutable signed manifest; authority stores no credential bytes or locator material and exposes no locator operation.
    - prepare blocks account plus store, changes only the current account generation/receipt projection, inserts no credential or cleanup identity, and records one credential_set transition.
    - config commit inserts one store version and one account version with the existing credential identity.
    - finalize activates the bound after projection; abort restores the exact predecessor tuple and receipt; unsafe observation remains blocked recovery.
    - every historical credential, account, grant, receipt, transition, and version identity remains immutable.
  forbidden_changes:
    - Authority SQLite schema, application ID, user version, or Cargo graph
    - core canonical transcript bytes, manifest types, or action policy table
    - credential delete, cleanup challenge/claim/delete, account remove/purge, or remote-effect behavior
    - config, runtime, keyring, local I/O, protocol, CLI, MCP, or network code

