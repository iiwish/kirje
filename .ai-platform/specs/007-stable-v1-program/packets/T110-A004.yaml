    - .ai-platform/evidence/T202C3/**
    - .ai-platform/specs/007-stable-v1-program/**
    - .ai-platform/specs/008-security-baseline/tasks.md
  write_rules:
    - Add one bounded full-lifecycle credential-set integration test before production changes.
    - Record the focused RED command and exact account-only transition rejection.
    - Synthetic public signatures may be committed; private keys, seeds, proofs, nonces, credential bytes, locator material, and real account data may not.
    - Do not mark T202C3 or T110 Accepted in this attempt.
    - Do not broaden into credential delete, cleanup claim/delete, keyring work, or another transition kind.
  ownership:
    worktree: /Users/iiwish/self/kirje
    branch: codex/v1-roadmap-governance
    executor: primary Codex agent because the user requested direct serial continuation

tdd_plan:
  red:
    - Build and finalize one synthetic active account through the accepted account-create lifecycle.
    - Authorize one exact credential_set challenge and prove prepare reaches the account-only transition gate.
    - Assert the failed prepare writes no grant, transition, credential, cleanup, version, event, or clock row.
  green:
    - Reparse the credential mutation and compare its credential target plus complete account transition request.
    - Implement credential-set prepare, commit, finalize, abort, recovery, replay, expiry, restart, and immutable account/store version behavior.
    - Generalize registry history only for create, update, remove, and credential-set chains without accepting credential-delete execution.
  refactor:
    - Share credential/account snapshot selection and existing-credential validation only where action-specific target and version rules remain explicit.

validation_loop:
  focused_red_green:
    - cargo test -p kirje-store --test authority_registry credential_set_transition_lifecycle_is_exact --all-features --locked
  changed_crate:
    - cargo test -p kirje-store --test authority_registry --all-features --locked
    - cargo test -p kirje-store --all-features --locked
    - cargo test -p kirje-store --no-default-features --locked
    - cargo clippy -p kirje-store --all-targets --all-features --locked -- -D warnings
    - cargo fmt --all --check
  integrity:
    - git diff --check
    - shasum -a 256 crates/kirje-store/src/authority/schema_v1.sql Cargo.lock
    - python3 /Users/iiwish/.codex/skills/ai-delivery-governor/scripts/validate_delivery_artifacts.py --root /Users/iiwish/self/kirje --feature-id 007-stable-v1-program
  expected_signal:
    - exact set completes prepared, config_committed, finalized with account/store active and no cleanup row
    - prepare adds no credential identity; config commit adds store and account versions using the existing credential identity
    - exact pre-config abort restores the active predecessor receipt and tuple
    - unsafe observations enter recovery_required and exact retries remain transition-scoped
    - expiry and valid create-set history restart exactly
    - schema and dependency hashes remain unchanged
  failure_handling:
    - First relevant failure: fix only inside packet-authorized production/test files.
    - Second same-cause contract failure: stop and record the blocker rather than weakening assertions.
    - Never store credential bytes or locator material, invent a cleanup row, or call config/keyring/runtime code.

