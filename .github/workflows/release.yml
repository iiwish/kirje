name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify tag matches workspace version
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test "${GITHUB_REF_NAME}" = "v${version}"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: cargo build --workspace --all-features --locked
      - uses: EmbarkStudios/cargo-deny-action@v2

  build:
    name: Build (${{ matrix.target }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            format: tar
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            format: tar
          - os: macos-15-intel
            target: x86_64-apple-darwin
            format: tar
          - os: macos-latest
            target: aarch64-apple-darwin
            format: tar
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            format: zip
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --locked --package kirje-cli --target ${{ matrix.target }}
      - name: Package Unix archive
        if: matrix.format == 'tar'
        shell: bash
        run: |
          name="kirje-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "${name}"
          cp "target/${{ matrix.target }}/release/kirje" "${name}/kirje"
          cp README.md RELEASE_NOTES.md CHANGELOG.md LICENSE NOTICE "${name}/"
          tar -czf "${name}.tar.gz" "${name}"
      - name: Package Windows archive
        if: matrix.format == 'zip'
        shell: pwsh
        run: |
          $name = "kirje-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $name
          Copy-Item "target/${{ matrix.target }}/release/kirje.exe" "$name/kirje.exe"
          Copy-Item README.md,RELEASE_NOTES.md,CHANGELOG.md,LICENSE,NOTICE $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: kirje-${{ matrix.target }}
          path: kirje-${{ github.ref_name }}-${{ matrix.target }}.*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: kirje-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: (cd dist && sha256sum * > SHA256SUMS)
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*
          --prerelease --verify-tag
          --title "Kirje ${GITHUB_REF_NAME}"
          --notes-file RELEASE_NOTES.md
