[workspace]
members = [
  "crates/kirje-cli",
  "crates/kirje-core",
  "crates/kirje-mcp",
  "crates/kirje-protocol",
  "crates/kirje-runtime",
  "crates/kirje-store",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/iiwish/kirje"

[workspace.dependencies]
anyhow = "1.0"
ammonia = "4.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["alloc", "clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
directories = "6.0"
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["fast"] }
io-imap = { version = "0.6", default-features = false, features = ["client", "rustls-ring"] }
io-sasl = { version = "0.1", default-features = false }
kirje-core = { path = "crates/kirje-core" }
kirje-mcp = { path = "crates/kirje-mcp" }
kirje-protocol = { path = "crates/kirje-protocol" }
kirje-runtime = { path = "crates/kirje-runtime" }
kirje-store = { path = "crates/kirje-store" }
keyring = "4.1"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "hostname", "rustls-tls", "smtp-transport"] }
mail-parser = { version = "0.11", features = ["full_encoding"] }
pimalaya-stream = { version = "0.3", default-features = false, features = ["std", "rustls-ring"] }
rfc2047-decoder = "1.0"
rusqlite = { version = "0.37", features = ["bundled"] }
rmcp = { version = "3.1", features = ["server", "transport-io"] }
rpassword = "7.5"
schemars = { version = "1.0", features = ["chrono04"] }
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.23"
tokio = { version = "1.0", features = ["io-std", "macros", "rt-multi-thread"] }
thiserror = "2.0"
toml = "1.1"
url = "2.5"
uuid = { version = "1.18", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
