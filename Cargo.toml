[workspace]
members = [
  "crates/kirje-cli",
  "crates/kirje-core",
  "crates/kirje-mcp",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/iiwish/kirje"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
kirje-core = { path = "crates/kirje-core" }
kirje-mcp = { path = "crates/kirje-mcp" }
rmcp = { version = "3.1", features = ["server", "transport-io"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["io-std", "macros", "rt-multi-thread"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
