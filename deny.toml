[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
  "RUSTSEC-2026-0543", # chrono unmaintained upstream tracking
  "RUSTSEC-2026-0370", # zvariant unmaintained in keyring/secret-service
  "RUSTSEC-2026-0371", # zbus_names unmaintained in keyring/secret-service
  "RUSTSEC-2026-0372", # zvariant_derive unmaintained in keyring/secret-service
  "RUSTSEC-2026-0459", # libsqlite3-sys bundled wal page-cache (Kirje SQLite databases are private 0600)
]

[licenses]
confidence-threshold = 0.8
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
